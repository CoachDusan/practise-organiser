<title>Practise Organiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground:     #1B1A17;
    --panel:      #24221D;
    --panel-hi:   #2E2B24;
    --line:       #3B372F;
    --text:       #E9E4D8;
    --dim:        #948C7C;
    --accent:     #F2A413;
    --accent-ink: #1B1A17;
    --court:      #EDE6D8;
    --court-line: #3A342A;
    --danger:     #C8574B;
    --rail: 64px;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  .label {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase; letter-spacing: .09em; font-weight: 600;
  }

  /* ---------- chrome ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; row-gap: 8px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .12em;
    font-weight: 700; font-size: 18px; line-height: 1; white-space: nowrap;
  }
  .wordmark span { color: var(--accent); }
  .spacer { margin-left: auto; }

  button, input, select, textarea {
    font: inherit; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  button {
    background: var(--panel-hi); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; touch-action: manipulation;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .chip {
    padding: 8px 13px; font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
    font-size: 14px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.ghost { background: transparent; }
  .chip.danger { color: var(--danger); border-color: #4A342F; background: transparent; }

  input[type="text"], input[type="number"], input[type="date"], input[type="time"],
  textarea, select {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.5; }

  .field { display: grid; gap: 5px; min-width: 0; }
  .field > .label { font-size: 10px; color: var(--dim); }

  /* ---------- library ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 80px; }

  .lib-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .lib-head h1 { font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
                 letter-spacing: .06em; font-size: 30px; margin: 0; font-weight: 700; }
  .count { color: var(--dim); font-size: 13px; }

  .filters { display: flex; gap: 7px; flex-wrap: wrap; margin: 16px 0 20px; }
  .filters button { padding: 6px 11px; font-size: 13px; border-radius: 99px; background: transparent; }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 0; overflow: hidden; text-align: left; display: grid;
    grid-template-rows: auto 1fr; min-height: 168px;
  }
  .card:hover { border-color: #4C463C; }
  .card .thumb {
    background: var(--court); height: 92px; position: relative; overflow: hidden;
    display: grid; place-items: center;
  }
  .card .thumb svg { width: 100%; height: 100%; display: block; }
  .card .meta { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
  .card .name {
    font-family: "Barlow Condensed", sans-serif; font-size: 21px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; line-height: 1.05;
  }
  .card .sub { font-size: 11.5px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 99px;
    background: #332F27; color: var(--accent); border: 1px solid #433D33;
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .07em;
  }

  .card.new { border-style: dashed; place-items: center; display: grid; grid-template-rows: 1fr;
               color: var(--dim); background: transparent; }
  .card.new:hover { color: var(--accent); border-color: var(--accent); }
  .card.new .plus { font-size: 30px; line-height: 1; }

  .empty { color: var(--dim); text-align: center; padding: 60px 20px; line-height: 1.6; }

  /* ---------- editor ---------- */
  .editor { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100dvh; }
  .rail {
    position: sticky; top: 49px; align-self: start;
    height: calc(100dvh - 49px);
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 0; overflow-y: auto; z-index: 20;
  }
  .rail .cap { font-size: 9px; color: var(--dim); margin: 6px 0 1px; }
  .rail hr { width: 30px; border: 0; border-top: 1px solid var(--line); margin: 7px 0; }
  .tool { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px;
          background: transparent; border: 1px solid transparent; }
  .tool svg { width: 23px; height: 23px; stroke: var(--text); fill: none;
              stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tool[aria-pressed="true"] { background: var(--panel-hi); border-color: var(--accent); }
  .tool[aria-pressed="true"] svg { stroke: var(--accent); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; padding: 0;
            box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); }
  .swatch[aria-pressed="true"] { border-color: var(--accent); transform: scale(1.09); }
  .size-btn { width: 38px; height: 28px; display: grid; place-items: center; border-radius: 8px;
              background: transparent; border: 1px solid transparent; }
  .size-btn i { display: block; background: var(--text); border-radius: 99px; }
  .size-btn[aria-pressed="true"] { background: var(--panel-hi); border-color: var(--accent); }
  .size-btn[aria-pressed="true"] i { background: var(--accent); }

  .sheet { padding: 18px 20px 100px; max-width: 1100px; }

  .name-input {
    font-family: "Barlow Condensed", sans-serif; font-size: 32px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    background: transparent; border: 0; border-bottom: 2px solid var(--line);
    border-radius: 0; padding: 4px 2px; width: 100%;
  }
  .name-input:focus { border-bottom-color: var(--accent); outline: none; }
  .name-input::placeholder { color: #4E483E; }

  .metarow {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin: 18px 0 8px;
  }

  .int-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .int-read {
    font-family: "Barlow Condensed", sans-serif; font-size: 13px; letter-spacing: .05em;
    color: var(--accent); text-transform: uppercase;
  }
  .pips { display: flex; gap: 5px; flex-wrap: wrap; }
  .pips button {
    width: 34px; height: 34px; border-radius: 8px; background: transparent;
    font-variant-numeric: tabular-nums; font-size: 13px;
  }
  .pips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .diagrams { display: grid; gap: 18px; margin-top: 22px; }

  .diagram { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .diagram-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .diagram-head .num {
    font-family: "Barlow Condensed", sans-serif; font-size: 12px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--accent); white-space: nowrap;
  }
  .diagram-head input[type="text"] { flex: 1 1 180px; min-width: 120px; background: var(--ground); }
  .diagram-head .grp { display: flex; gap: 5px; margin-left: auto; }
  .diagram-head .grp button { padding: 6px 10px; font-size: 12px; }

  .court-wrap {
    position: relative; background: var(--court); border-radius: 5px; margin: 0 auto;
    box-shadow: 0 8px 26px rgba(0,0,0,.38), 0 0 0 1px rgba(0,0,0,.35);
    max-width: 100%;
  }
  .court-wrap svg, .court-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .court-wrap svg  { pointer-events: none; }
  /* touch-action:none guarantees the Pencil draws instead of scrolling the page.
     Finger scrolling over a court is then handled by hand, in the pad below. */
  .court-wrap canvas { touch-action: none; }
  .court-wrap .ink-base { pointer-events: none; }

  .court-line { stroke: var(--court-line); fill: none; stroke-width: 4; }
  .court-line.thick { stroke-width: 7; }
  .court-line.dash { stroke-dasharray: 26 20; }
  .rim { stroke: #C0552A; stroke-width: 6; fill: none; }

  .add-court, .add-row { width: 100%; padding: 15px; border-style: dashed; background: transparent; color: var(--dim); }
  .add-court:hover, .add-row:hover { color: var(--accent); border-color: var(--accent); }

  .savechip { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  .savechip.on { color: var(--accent); }

  .warn {
    background: #33231E; border: 1px solid #593B33; color: #E8C9BF;
    border-radius: 10px; padding: 11px 14px; font-size: 13px; line-height: 1.5;
    margin: 0 0 18px;
  }
  .warn b { color: #fff; }

  /* ---------- practices ---------- */
  .tabs { display: flex; gap: 6px; }
  .tabs .chip { padding: 6px 12px; font-size: 13px; }

  .narrow { max-width: 780px; }

  .month {
    font-size: 11px; color: var(--dim); margin: 22px 0 8px;
  }
  .month:first-of-type { margin-top: 14px; }

  .prow {
    width: 100%; display: grid; grid-template-columns: 190px 1fr; gap: 16px;
    align-items: start; text-align: left; padding: 13px 15px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .prow:hover { border-color: #4C463C; }
  .pwhen { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .pdate {
    font-family: "Barlow Condensed", sans-serif; font-size: 19px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; line-height: 1.1;
  }
  .pbadge {
    display: inline-block; font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .09em; font-size: 10px;
    padding: 3px 8px; border-radius: 99px;
    background: #332F27; color: var(--dim); border: 1px solid #433D33;
  }
  .pbadge.done { background: #2A3326; color: #9CC47F; border-color: #3E4C36; }
  .pwhat { display: grid; gap: 5px; min-width: 0; }
  .psub { font-size: 11.5px; color: var(--dim); }
  .pnames { font-size: 13.5px; line-height: 1.5; }
  .pnames.dim { color: var(--dim); font-style: italic; }
  .pnote {
    font-size: 12.5px; color: var(--dim); line-height: 1.5;
    border-left: 2px solid var(--line); padding-left: 9px; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .prac-head {
    display: grid; grid-template-columns: minmax(150px, 200px) auto auto auto;
    gap: 18px; align-items: end; margin: 6px 0 22px;
  }
  .ptotal {
    font-family: "Barlow Condensed", sans-serif; font-size: 24px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.2;
  }

  .items { display: grid; gap: 7px; margin-bottom: 14px; }
  .item {
    display: grid; grid-template-columns: 26px 1fr 66px 28px auto;
    gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px;
  }
  .inum {
    font-family: "Barlow Condensed", sans-serif; font-size: 15px; color: var(--accent);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .ibody { min-width: 0; display: grid; gap: 3px; }
  .iname {
    font-family: "Barlow Condensed", sans-serif; font-size: 19px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; line-height: 1.15;
  }
  .isub { font-size: 11px; color: var(--dim); }
  .isub.gone { color: #C08A80; }
  .imin { text-align: right; padding: 7px 8px; font-variant-numeric: tabular-nums; }
  .imunit { font-size: 11px; color: var(--dim); }
  .imoves { display: flex; gap: 4px; }
  .mini {
    width: 38px; height: 38px; border-radius: 8px; background: transparent;
    display: grid; place-items: center; font-size: 15px; line-height: 1; color: var(--dim);
  }
  .mini:hover:not(:disabled) { color: var(--text); border-color: #4C463C; }
  .mini:disabled { opacity: .3; cursor: default; }
  .mini.rm:hover { color: var(--danger); border-color: #4A342F; }

  .prac-foot { margin-top: 28px; display: grid; gap: 14px; }
  .foot-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 11px 14px; font-size: 13px; line-height: 1.55; color: var(--dim);
  }
  .hint b { color: var(--text); }

  /* ---------- schedule ---------- */
  .cal-nav { display: flex; align-items: center; gap: 8px; margin: 16px 0 14px; flex-wrap: wrap; }
  .cal-nav .chip { padding: 7px 13px; }
  .cal-title {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .06em; font-size: 19px; font-weight: 700; min-width: 210px;
  }

  .week { display: grid; gap: 7px; }
  .day {
    display: grid; grid-template-columns: 62px 1fr 42px; gap: 12px; align-items: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px;
  }
  .day.today { border-color: var(--accent); }
  .dwhen { display: grid; gap: 1px; justify-items: center; padding-top: 2px; }
  .dday { font-size: 10px; color: var(--dim); }
  .day.today .dday { color: var(--accent); }
  .dnum {
    font-family: "Barlow Condensed", sans-serif; font-size: 24px; font-weight: 700;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .dbody { display: grid; gap: 6px; min-width: 0; }
  .dempty { color: #4E483E; font-size: 13px; padding: 5px 0; }
  .dadd {
    width: 38px; height: 38px; border-radius: 10px; background: transparent;
    color: var(--dim); font-size: 19px; line-height: 1; display: grid; place-items: center;
  }
  .dadd:hover { color: var(--accent); border-color: var(--accent); }

  /* One chip per thing on a day. The left edge carries the colour, so a week
     can be read at a glance without a legend. */
  .chip-item {
    display: grid; gap: 2px; text-align: left; padding: 7px 10px;
    background: var(--panel-hi); border: 1px solid var(--line);
    border-left: 3px solid var(--dim); border-radius: 8px; width: 100%;
  }
  .chip-item:hover { border-color: #4C463C; }
  .ci-title {
    font-family: "Barlow Condensed", sans-serif; font-size: 16px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; line-height: 1.15;
  }
  .ci-sub { font-size: 11.5px; color: var(--dim); line-height: 1.4; }

  .chip-item.practice        { border-left-color: var(--accent); }
  .chip-item.practice.done   { border-left-color: #9CC47F; }
  .chip-item.game            { border-left-color: #D2603F; }
  .chip-item.tournament      { border-left-color: #C08BD8; }
  .chip-item.travel          { border-left-color: #6FA8C7; }
  .chip-item.off             { border-left-color: #6B655A; }
  .chip-item.gym             { border-left-color: #8C7A55; }
  .chip-item.note            { border-left-color: #575149; }

  .month-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;
  }
  .mg-head { font-size: 10px; color: var(--dim); text-align: center; padding-bottom: 2px; }
  .mg-cell {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    min-height: 92px; padding: 5px; display: grid; gap: 3px; align-content: start;
    cursor: pointer; overflow: hidden;
  }
  .mg-cell:hover { border-color: #4C463C; }
  .mg-cell.outside { opacity: .38; }
  .mg-cell.today { border-color: var(--accent); }
  .mg-num {
    font-family: "Barlow Condensed", sans-serif; font-size: 13px; color: var(--dim);
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .mg-cell.today .mg-num { color: var(--accent); }
  .mg-item {
    font-size: 10px; line-height: 1.25; padding: 2px 4px; border-radius: 4px;
    background: var(--panel-hi); border-left: 2px solid var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mg-item.practice      { border-left-color: var(--accent); }
  .mg-item.practice.done { border-left-color: #9CC47F; }
  .mg-item.game          { border-left-color: #D2603F; }
  .mg-item.tournament    { border-left-color: #C08BD8; }
  .mg-item.travel        { border-left-color: #6FA8C7; }
  .mg-item.off           { border-left-color: #6B655A; }
  .mg-item.gym           { border-left-color: #8C7A55; }

  .ev-form { display: grid; gap: 14px; }
  .ev-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  @media (max-width: 620px) {
    .day { grid-template-columns: 52px 1fr 38px; gap: 8px; }
    .month-grid { gap: 3px; }
    .mg-cell { min-height: 62px; padding: 3px; }
    .mg-item { font-size: 9px; }
    .cal-title { min-width: 0; font-size: 17px; }
  }

  /* ---------- drill picker ---------- */
  .modal-back {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,9,7,.72);
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
  }
  .modal {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 720px;
    max-height: 88dvh; overflow-y: auto; padding: 14px 16px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .modal-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: -14px; background: var(--ground);
    padding: 6px 0 12px; margin: -6px 0 0; z-index: 2;
  }
  .mtitle {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .06em; font-size: 22px; font-weight: 700;
  }
  .msearch { margin-bottom: 12px; }
  .mrows { display: grid; gap: 7px; }
  .mrow {
    display: grid; grid-template-columns: 78px 1fr 34px; gap: 12px; align-items: center;
    text-align: left; padding: 8px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .mrow:hover { border-color: var(--accent); }
  .mthumb {
    background: var(--court); height: 46px; border-radius: 5px; overflow: hidden;
  }
  .mthumb svg { width: 100%; height: 100%; display: block; }
  .mbody { min-width: 0; display: grid; gap: 3px; }
  .mname {
    font-family: "Barlow Condensed", sans-serif; font-size: 18px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; line-height: 1.15;
  }
  .mplus {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--dim); font-size: 17px; line-height: 1;
  }
  .mplus.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .modal.choice { max-width: 520px; border-radius: 16px; align-self: center; }
  .modal-back:has(.choice) { align-items: center; padding: 16px; }
  .choice-body { font-size: 13.5px; line-height: 1.7; color: var(--dim); margin-bottom: 16px; }
  .choice-body b { color: var(--text); }
  .choice-opts { display: grid; gap: 8px; }
  .choice-btn {
    text-align: left; padding: 12px 14px; display: grid; gap: 3px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .choice-btn:hover { border-color: var(--accent); }
  .choice-btn b {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .05em; font-size: 16px; font-weight: 700;
  }
  .choice-btn span { font-size: 12px; color: var(--dim); line-height: 1.45; }
  .choice-btn.danger-choice:hover { border-color: var(--danger); }
  .choice-btn.danger-choice b { color: #E0A79E; }

  .usage {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .07em; font-size: 10px; color: #9CC47F;
  }

  @media (max-width: 620px) {
    .prow { grid-template-columns: 1fr; gap: 8px; }
    .prac-head { grid-template-columns: 1fr 1fr; }

<script>

  /* ================= court geometry (FIBA, centimetres) ================= */

  function halfCourtMarks() {

           '<path class="court-line" d="M 570 580 A 180 180 0 0 0 930 580"/>' +
           '<path class="court-line dash" d="M 570 580 A 180 180 0 0 1 930 580"/>' +
           '<path class="court-line" d="M 90 0 L 90 299 A 675 675 0 0 0 1410 299 L 1410 0"/>' +
           '<path class="court-line" d="M 625 157.5 A 125 125 0 0 0 875 157.5"/>' +
           '<path class="court-line thick" d="M 660 120 L 840 120"/>' +
           '<path class="court-line" d="M 750 120 L 750 135"/>' +
           '<circle class="rim" cx="750" cy="157.5" r="22.5"/>';
  }

  var COURTS = {
    half: { w: 1500, h: 1400, svg:
      '<rect class="court-line thick" x="0" y="0" width="1500" height="1400"/>' + halfCourtMarks() +
      '<path class="court-line" d="M 570 1400 A 180 180 0 0 1 930 1400"/>' },
    full: { w: 2800, h: 1500, svg:
      '<rect class="court-line thick" x="0" y="0" width="2800" height="1500"/>' +
      '<g transform="matrix(0 1 1 0 0 0)">' + halfCourtMarks() + '</g>' +
      '<g transform="matrix(0 1 -1 0 2800 0)">' + halfCourtMarks() + '</g>' +
      '<path class="court-line" d="M 1400 0 L 1400 1500"/>' +
      '<circle class="court-line" cx="1400" cy="750" r="180"/>' }
  };
  var BLEED = 8;   // keeps boundary lines off the viewBox edge

  function courtSvg(kind) {
    var c = COURTS[kind] || COURTS.half;
    return '<svg viewBox="' + (-BLEED) + ' ' + (-BLEED) + ' ' + (c.w + BLEED * 2) + ' ' +
           (c.h + BLEED * 2) + '" preserveAspectRatio="none">' + c.svg + '</svg>';
  }
  function courtAspect(kind) {
    var c = COURTS[kind] || COURTS.half;
    return (c.h + BLEED * 2) / (c.w + BLEED * 2);   // height / width
  }

  /* ================= state ================= */

  var TAGS = ["Warm-up", "Shooting", "Transition", "Offence", "Defence",
              "Live / scrimmage", "Pick & roll", "Post play", "Rebounding",
              "Conditioning", "Set plays", "Ball handling"];
  var FORMATS = ["Individual", "Pairs", "3v3", "4v4", "5v5", "5:0", "Whole team"];
  var SIZES = { S: 300, M: 460, L: 660 };   // css px, the court's drawn width

  var state = { version: 3, drills: [], practices: [], events: [] };
  var PREVIEW = !!(window.claude);   // running inside the claude.ai preview sandbox

  /* ================= storage =================
     IndexedDB, not localStorage: a far larger quota, and it stores structured
     records so saving one drill does not mean rewriting the whole library.
     Drills are held one record each, packed. localStorage is kept only as a
     fallback for a browser that refuses IndexedDB. */

  var Store = { kind: "memory" };
  var LS_KEY = "practise-organiser/v1";

  /* One object store per kind of record. Practices arrived at DB version 2 and
     schedule events at version 3; each upgrade only creates what is missing, so
     data written under an older version is carried across untouched. */
  var DB = (function () {
    var opening = null;
    function open() {
      if (opening) return opening;
      opening = new Promise(function (resolve, reject) {
        var req = indexedDB.open("practise-organiser", 3);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains("drills")) db.createObjectStore("drills", { keyPath: "id" });
          if (!db.objectStoreNames.contains("practices")) db.createObjectStore("practices", { keyPath: "id" });
          if (!db.objectStoreNames.contains("events")) db.createObjectStore("events", { keyPath: "id" });
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
        req.onblocked = function () { reject(new Error("blocked")); };
      });
      return opening;
    }
    function run(store, mode, fn) {
      return open().then(function (db) {
        return new Promise(function (resolve, reject) {
          var t = db.transaction(store, mode);
          var req = fn(t.objectStore(store));
          t.oncomplete = function () { resolve(req ? req.result : undefined); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
        });
      });
    }
    return {
      all:   function (s)     { return run(s, "readonly",  function (o) { return o.getAll(); }); },
      put:   function (s, d)  { return run(s, "readwrite", function (o) { return o.put(d); }); },
      del:   function (s, id) { return run(s, "readwrite", function (o) { return o.delete(id); }); },
      clear: function (s)     { return run(s, "readwrite", function (o) { return o.clear(); }); }
    };
  })();

  function initStore() {
    return Promise.resolve()
      .then(function () {
        if (!window.indexedDB) throw new Error("no idb");
        return Promise.all([DB.all("drills"), DB.all("practices"), DB.all("events")])

            Store.kind = "idb";
            return { drills: r[0] || [], practices: r[1] || [], events: r[2] || [] };

      })
      .catch(function () {
        try {
          localStorage.setItem("__probe", "1");
          var ok = localStorage.getItem("__probe") === "1";
          localStorage.removeItem("__probe");
          if (!ok) throw new Error("no ls");
          Store.kind = "local";
          var raw = localStorage.getItem(LS_KEY);
          var saved = raw ? JSON.parse(raw) : null;
          return { drills: (saved && saved.drills) || [],
                   practices: (saved && saved.practices) || [],
                   events: (saved && saved.events) || [] };
        } catch (e) {
          Store.kind = "memory";
          return { drills: [], practices: [], events: [] };
        }
      })
      .then(function (rows) {
        state.drills = rows.drills.map(inflateDrill)
          .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
        state.practices = rows.practices.map(inflatePractice).sort(byDateDesc);
        state.events = rows.events.map(inflateEvent).sort(byDateDesc);

        if (navigator.storage && navigator.storage.persist) {

        }
      });
  }

  function persistAll() {

          practices: state.practices.map(deflatePractice),
          events: state.events.map(deflateEvent)
        }));
        return Promise.resolve();
      } catch (e) { return Promise.reject(e); }
    }
    return Promise.resolve();
  }

  /* dirty maps a record id to the store it belongs in, so one save queue can
     carry both drills and practices. */
  var dirty = {}, saveTimer = null;

  function touch(drill) {
    drill.updatedAt = Date.now();
    dirty[drill.id] = "drills";
    schedule();
  }

  function touchPractice(p) {
    p.updatedAt = Date.now();
    dirty[p.id] = "practices";
    schedule();
  }

  function touchEvent(e) {
    e.updatedAt = Date.now();
    dirty[e.id] = "events";
    schedule();
  }

  function schedule() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }

  function flush() {
    var queued = dirty;
    var ids = Object.keys(queued);
    dirty = {};
    if (Store.kind === "memory") { chip("Not being saved", true); return; }

    var work;
    if (Store.kind === "idb") {
      work = Promise.all(ids.map(function (id) {
        if (queued[id] === "practices") {
          var p = findPractice(id);
          return p ? DB.put("practices", deflatePractice(p)) : DB.del("practices", id);
        }
        if (queued[id] === "events") {
          var ev = findEvent(id);
          return ev ? DB.put("events", deflateEvent(ev)) : DB.del("events", id);
        }
        var d = findDrill(id);
        return d ? DB.put("drills", deflateDrill(d)) : DB.del("drills", id);

  function removeDrill(id) {
    state.drills = state.drills.filter(function (d) { return d.id !== id; });
    if (Store.kind === "idb") DB.del("drills", id).then(flashSaved).catch(function () {});

  }

  function removePractice(id) {
    state.practices = state.practices.filter(function (p) { return p.id !== id; });
    if (Store.kind === "idb") DB.del("practices", id).then(flashSaved).catch(function () {});

  }

  function removeEvent(id) {
    state.events = state.events.filter(function (e) { return e.id !== id; });
    if (Store.kind === "idb") DB.del("events", id).then(flashSaved).catch(function () {});

  }

  function chip(msg, sticky) {

  function flashSaved() {
    chip("Saved");
    clearTimeout(flashTimer);

  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function newDrill() {
    return {
      id: uid(), name: "", tag: "", format: "", minutes: 10, intensity: 5,
      points: "", diagrams: [newDiagram()], createdAt: Date.now(), updatedAt: Date.now()
    };
  }
  function newDiagram() { return { id: uid(), court: "half", size: "M", caption: "", strokes: [] }; }
  function findDrill(id) {
    for (var i = 0; i < state.drills.length; i++) if (state.drills[i].id === id) return state.drills[i];
    return null;
  }

  /* ================= practices =================
     A practice is a dated list of which drills were run. It holds no ink of its
     own: the diagram lives once, in the drill. An item keeps `drillId` as the
     fact and `name` only as a label to fall back on, so a practice from October
     still reads sensibly if the drill is deleted in March. Counting always goes
     through drillId, never the label.

     `status` is the honesty mechanism. A practice starts "planned" and becomes
     "done" only when the coach says the session happened. Nothing planned is
     ever counted, so the archive can never report an intention as a fact. */

  function newPractice() {
    return {
      id: uid(), date: todayISO(), time: "", status: "planned", items: [], note: "",
      createdAt: Date.now(), updatedAt: Date.now()

  }

  function newItem(drill) {
    return { id: uid(), drillId: drill.id, name: drill.name || "Untitled",

  }

  function findPractice(id) {
    for (var i = 0; i < state.practices.length; i++) {

  // the save path looks the same for both kinds of record.
  function deflatePractice(p) { return p; }

  function inflatePractice(p) {
    if (!Array.isArray(p.items)) p.items = [];
    if (p.status !== "done") p.status = "planned";
    p.items.forEach(function (it) { it.minutes = Number(it.minutes) || 0; });

  function byDateDesc(a, b) {
    var d = String(b.date || "").localeCompare(String(a.date || ""));

  }

  function itemLabel(it) {
    var d = it.drillId ? findDrill(it.drillId) : null;
    return d ? (d.name || "Untitled") : (it.name || "Untitled");
  }

  function practiceMinutes(p) {
    var t = 0;
    for (var i = 0; i < p.items.length; i++) t += Number(p.items[i].minutes) || 0;
    return t;
  }

  /* How many completed sessions each drill has appeared in. Counted once per
     session, not once per entry — "run in 7 practices" is the honest sentence.
     Planned practices are excluded on purpose. */
  function usageMap() {
    var m = {};
    state.practices.forEach(function (p) {
      if (p.status !== "done") return;
      var seen = {};
      p.items.forEach(function (it) {

  /* ================= schedule events =================
     Everything on the calendar that is not a practice. A season is not only
     the nights you coach: the game is what the week is built around, and a
     travel day or a shut gym is the reason a plan changes. Kept as one record
     type with a `kind`, rather than six near-identical ones. */

  var EVENT_KINDS = [
    { id: "game",       label: "Game",            hint: "Who you play, home or away, and the score when you have it" },
    { id: "tournament", label: "Tournament",      hint: "A multi-day competition" },
    { id: "travel",     label: "Travel",          hint: "On the road, not training" },
    { id: "off",        label: "Day off",         hint: "Deliberate rest" },
    { id: "gym",        label: "Gym unavailable", hint: "The hall is taken" },
    { id: "note",       label: "Note",            hint: "Anything else worth seeing on the calendar" }
  ];

  function kindLabel(id) {
    for (var i = 0; i < EVENT_KINDS.length; i++) if (EVENT_KINDS[i].id === id) return EVENT_KINDS[i].label;
    return "Note";
  }

  function newEvent(kind, date) {
    return {
      id: uid(), kind: kind || "note", date: date || todayISO(), time: "",
      title: "", venue: "", scoreUs: null, scoreThem: null, note: "",
      createdAt: Date.now(), updatedAt: Date.now()

  }

  function findEvent(id) {
    for (var i = 0; i < state.events.length; i++) if (state.events[i].id === id) return state.events[i];
    return null;
  }

  function deflateEvent(e) { return e; }

  function inflateEvent(e) {
    if (!e.kind) e.kind = "note";
    e.scoreUs = numOrNull(e.scoreUs);
    e.scoreThem = numOrNull(e.scoreThem);
    return e;
  }

  function numOrNull(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }

  function eventTitle(e) {
    if (e.kind === "game") {
      var who = e.title || "Game";
      var where = e.venue === "home" ? "H" : e.venue === "away" ? "A" : e.venue === "neutral" ? "N" : "";
      return where ? who + " (" + where + ")" : who;
    }
    return e.title || kindLabel(e.kind);
  }

  function gameResult(e) {
    if (e.kind !== "game") return "";
    if (e.scoreUs === null || e.scoreThem === null) return "";
    return e.scoreUs + "\u2013" + e.scoreThem;
  }

  /* Won-lost, from games that actually have both scores filled in. A game with
     no score is not a draw and is not counted — the record says only what the
     data supports. */
  function seasonRecord() {
    var w = 0, l = 0, d = 0, pending = 0;
    state.events.forEach(function (e) {
      if (e.kind !== "game") return;
      if (e.scoreUs === null || e.scoreThem === null) { pending++; return; }
      if (e.scoreUs > e.scoreThem) w++;
      else if (e.scoreUs < e.scoreThem) l++;
      else d++;
    });
    return { w: w, l: l, d: d, pending: pending };
  }

  /* ---------- dates ----------
     Parsed by hand rather than through Date(string): "2026-08-25" fed to the
     Date constructor is read as UTC and can come back as the 24th in a western
     timezone, which would put a session on the wrong day. */

  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                     "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July",

  function todayISO() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function isoParts(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
  }

  function prettyDate(iso) {
    var p = isoParts(iso);
    if (!p) return "No date";
    var dt = new Date(p.y, p.m - 1, p.d);
    return DAY_NAMES[dt.getDay()] + " " + p.d + " " + MONTH_SHORT[p.m - 1] + " " + p.y;
  }

  function monthLabel(iso) {
    var p = isoParts(iso);
    return p ? MONTH_LONG[p.m - 1] + " " + p.y : "Undated";
  }

  function dateFromISO(iso) {
    var p = isoParts(iso);
    return p ? new Date(p.y, p.m - 1, p.d) : new Date();
  }

  function isoFromDate(dt) {
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
  }

  function addDays(iso, n) {
    var d = dateFromISO(iso);
    d.setDate(d.getDate() + n);
    return isoFromDate(d);
  }

  function addMonths(iso, n) {
    var p = isoParts(iso) || isoParts(todayISO());
    var d = new Date(p.y, p.m - 1 + n, 1);
    return isoFromDate(d);
  }

  // Weeks start on Monday: a basketball week runs to the weekend game.
  function startOfWeek(iso) {
    var d = dateFromISO(iso);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return isoFromDate(d);
  }

  function shortDay(iso) { return DAY_NAMES[dateFromISO(iso).getDay()]; }
  function dayNum(iso) { var p = isoParts(iso); return p ? p.d : 0; }

  function shortDate(iso) {
    var p = isoParts(iso);
    return p ? p.d + " " + MONTH_SHORT[p.m - 1] : "";
  }

  // Everything on one day, practices first, then events in time order.
  function dayItems(iso) {
    var out = [];
    state.practices.forEach(function (p) {
      if (p.date === iso) out.push({ type: "practice", rec: p, time: p.time || "" });
    });
    state.events.forEach(function (e) {
      if (e.date === iso) out.push({ type: "event", rec: e, time: e.time || "" });
    });
    out.sort(function (a, b) {
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });
    return out;
  }

  /* ================= stroke storage =================
     Pencil samples arrive at up to 240 Hz, which is far more detail than a
     court diagram needs. Ramer-Douglas-Peucker drops the points that sit on a
     line their neighbours already describe: typically an 8-10x reduction with
     no visible change to the drawing, which is what keeps a season of diagrams
     small enough to hold and to back up. */

  function rdp(pts, eps) {
    if (pts.length < 3) return pts.slice();
    var first = pts[0], last = pts[pts.length - 1];
    var dx = last.x - first.x, dy = last.y - first.y;
    var len2 = dx * dx + dy * dy;
    var maxD = -1, idx = 0;

    for (var i = 1; i < pts.length - 1; i++) {
      var px = pts[i].x - first.x, py = pts[i].y - first.y, d;
      if (len2 === 0) { d = px * px + py * py; }
      else {
        var t = (px * dx + py * dy) / len2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var ex = px - t * dx, ey = py - t * dy;
        d = ex * ex + ey * ey;
      }
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > eps * eps) {
      var left = rdp(pts.slice(0, idx + 1), eps);
      var right = rdp(pts.slice(idx), eps);
      return left.slice(0, -1).concat(right);
    }
    return [first, last];
  }

  function simplify(stroke) {
    var pts = stroke.pts;
    if (pts.length > 2) {
      // Iterative for very long strokes, so deep recursion cannot blow the stack.
      var out = [], CHUNK = 400;
      for (var i = 0; i < pts.length; i += CHUNK) {
        var seg = rdp(pts.slice(i, Math.min(pts.length, i + CHUNK + 1)), 0.0018);
        out = out.length ? out.concat(seg.slice(1)) : seg;
      }
      stroke.pts = out;
    }
    return stroke;
  }

  /* ================= compact storage =================
     A hand-drawn point does not need 16 decimal places. Coordinates go to
     integers at 1/10000 of the court (0.15 cm - far finer than a pencil line),
     pressure to two places, and each point is stored as a DELTA from the last,
     which keeps the numbers tiny and the JSON short. Roughly 7x smaller than
     the raw objects, which is the difference between an archive that grows
     comfortably for years and one that hits a wall. */

  var TOOL_CODE = { pen: "p", marker: "m", eraser: "e" };
  var CODE_TOOL = { p: "pen", m: "marker", e: "eraser" };

  function packStroke(s) {
    var d = [], px = 0, py = 0;
    for (var i = 0; i < s.pts.length; i++) {
      var x = Math.round(s.pts[i].x * 10000);
      var y = Math.round(s.pts[i].y * 10000);
      d.push(x - px, y - py, Math.round(s.pts[i].p * 100));
      px = x; py = y;
    }
    return { t: TOOL_CODE[s.tool] || "p", c: s.color, w: s.size, d: d };
  }

  function unpackStroke(o) {
    if (o && o.pts) return o;                    // already expanded
    var pts = [], px = 0, py = 0;
    for (var i = 0; i + 2 < o.d.length; i += 3) {
      px += o.d[i]; py += o.d[i + 1];
      pts.push({ x: px / 10000, y: py / 10000, p: o.d[i + 2] / 100 });
    }
    return { tool: CODE_TOOL[o.t] || "pen", color: o.c, size: o.w, pts: pts };
  }

  function deflateDrill(d) {
    var copy = {};
    for (var k in d) if (k !== "diagrams") copy[k] = d[k];
    copy.diagrams = d.diagrams.map(function (dg) {
      return { id: dg.id, court: dg.court, size: dg.size, caption: dg.caption,
               strokes: dg.strokes.map(packStroke) };
    });
    return copy;
  }

  function inflateDrill(d) {
    if (!Array.isArray(d.diagrams)) d.diagrams = [];
    d.diagrams.forEach(function (dg) { dg.strokes = (dg.strokes || []).map(unpackStroke); });
    return d;
  }

  function serialize(st) {
    return JSON.stringify({
      version: 3, updatedAt: st.updatedAt,
      drills: st.drills.map(deflateDrill),
      practices: st.practices.map(deflatePractice),
      events: st.events.map(deflateEvent)
    });
  }

  // Backups written before practices existed have no `practices` key; they are
  // still valid and simply restore an empty diary.
  function deserialize(raw) {
    var st = typeof raw === "string" ? JSON.parse(raw) : raw;
    if (!st || !Array.isArray(st.drills)) return null;
    st.drills.forEach(inflateDrill);
    st.practices = Array.isArray(st.practices) ? st.practices.map(inflatePractice) : [];
    st.practices.sort(byDateDesc);
    st.events = Array.isArray(st.events) ? st.events.map(inflateEvent) : [];
    st.events.sort(byDateDesc);
    return st;
  }

  /* ================= ink engine =================
     Two layers per diagram: #base holds finished strokes, #live only the one in
     progress. Pen is opaque so it appends segment by segment (lowest latency);
     marker is see-through so it is repainted whole as ONE path or overlaps go
     blotchy; the eraser has to cut into finished work so it writes to base. */

  var tool = { name: "pen", color: "#22201C", size: 7, fingerDraws: false };

  function Pad(host, diagram, onChange) {
    var wrap = document.createElement("div");
    wrap.className = "court-wrap";
    wrap.innerHTML = courtSvg(diagram.court);

    var base = document.createElement("canvas"); base.className = "ink-base";
    var live = document.createElement("canvas"); live.className = "ink-live";
    wrap.appendChild(base); wrap.appendChild(live);
    host.appendChild(wrap);

    var bctx = base.getContext("2d"), lctx = live.getContext("2d");
    var active = null;
    var pan = null;      // a finger dragging to scroll, rather than to draw

    function dims() { return COURTS[diagram.court] || COURTS.half; }
    function unitScale() { return base.width / (dims().w + BLEED * 2); }

    function layout() {
      var want = SIZES[diagram.size] || SIZES.M;
      var avail = host.clientWidth || want;
      var cssW = Math.max(200, Math.min(want, avail));
      var cssH = Math.round(cssW * courtAspect(diagram.court));

      wrap.style.width = cssW + "px";
      wrap.style.height = cssH + "px";

      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      base.width = live.width = Math.round(cssW * dpr);
      base.height = live.height = Math.round(cssH * dpr);
      redraw();
    }

    function penWidth(s, p) { return Math.max(0.6, s.size * unitScale() * (0.35 + 0.85 * p)); }
    function flatWidth(s) { return s.size * unitScale() * (s.tool === "marker" ? 3.2 : 5.5); }

    function styleFor(ctx, s) {
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (s.tool === "eraser") {
        ctx.globalCompositeOperation = "destination-out";
        ctx.globalAlpha = 1; ctx.strokeStyle = "#000";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = s.tool === "marker" ? 0.42 : 1;
        ctx.strokeStyle = s.color;
      }
    }

    function dot(ctx, s, p) {
      var w = s.tool === "pen" ? penWidth(s, p.p) : flatWidth(s);
      ctx.beginPath();
      ctx.arc(p.x * ctx.canvas.width, p.y * ctx.canvas.height, w / 2, 0, Math.PI * 2);
      ctx.fillStyle = s.tool === "eraser" ? "#000" : s.color;
      ctx.fill();
    }

    function pathThrough(ctx, pts, from, to) {
      var W = ctx.canvas.width, H = ctx.canvas.height;
      var prev = pts[from - 2] || pts[from - 1], a = pts[from - 1];
      ctx.moveTo((prev.x * W + a.x * W) / 2, (prev.y * H + a.y * H) / 2);
      for (var i = from; i <= to; i++) {
        var c = pts[i - 1], b = pts[i];
        ctx.quadraticCurveTo(c.x * W, c.y * H, (c.x * W + b.x * W) / 2, (c.y * H + b.y * H) / 2);
      }
    }

    function paintWhole(ctx, s) {
      var pts = s.pts;
      if (!pts || !pts.length) return;
      ctx.save(); styleFor(ctx, s);
      if (pts.length === 1) { dot(ctx, s, pts[0]); ctx.restore(); return; }
      if (s.tool === "pen") {
        for (var i = 1; i < pts.length; i++) {
          ctx.beginPath(); ctx.lineWidth = penWidth(s, pts[i].p);
          pathThrough(ctx, pts, i, i); ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.lineWidth = flatWidth(s);
        pathThrough(ctx, pts, 1, pts.length - 1); ctx.stroke();
      }
      ctx.restore();
    }

    function paintNewest(ctx, s) {
      var pts = s.pts, n = pts.length;
      ctx.save(); styleFor(ctx, s);
      if (n < 2) { dot(ctx, s, pts[0]); ctx.restore(); return; }
      ctx.beginPath();
      ctx.lineWidth = s.tool === "pen" ? penWidth(s, pts[n - 1].p) : flatWidth(s);
      pathThrough(ctx, pts, n - 1, n - 1); ctx.stroke();
      ctx.restore();
    }

    function redraw() {
      bctx.clearRect(0, 0, base.width, base.height);
      for (var i = 0; i < diagram.strokes.length; i++) paintWhole(bctx, diagram.strokes[i]);
      lctx.clearRect(0, 0, live.width, live.height);
      if (active) paintWhole(lctx, active);
    }

    function accepts(e) {
      if (e.pointerType === "pen") return true;
      if (e.pointerType === "touch") return tool.fingerDraws;
      return true;
    }
    function toNorm(e) {
      var r = live.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
    }
    function pressureOf(e) {
      if (e.pointerType !== "pen") return 0.5;
      return e.pressure > 0 ? e.pressure : 0.25;
    }
    function surface(s) { return s.tool === "eraser" ? bctx : lctx; }

    live.addEventListener("pointerdown", function (e) {
      // A finger on the court scrolls the page, unless it has been given a pen.
      if (e.pointerType === "touch" && !tool.fingerDraws) {
        pan = { y: e.clientY, from: window.scrollY };
        live.setPointerCapture(e.pointerId);
        return;
      }
      if (!accepts(e)) return;
      e.preventDefault();
      live.setPointerCapture(e.pointerId);
      var n = toNorm(e);
      active = { tool: tool.name, color: tool.color, size: tool.size,
                 pts: [{ x: n.x, y: n.y, p: pressureOf(e) }] };
      paintNewest(surface(active), active);
    });

    live.addEventListener("pointermove", function (e) {
      if (pan) { window.scrollTo(0, pan.from - (e.clientY - pan.y)); return; }
      if (!active) return;
      e.preventDefault();
      var evs = (typeof e.getCoalescedEvents === "function") ? e.getCoalescedEvents() : null;
      if (!evs || !evs.length) evs = [e];
      var added = false;
      for (var i = 0; i < evs.length; i++) {
        var n = toNorm(evs[i]);
        var last = active.pts[active.pts.length - 1];
        if (Math.abs(n.x - last.x) < 0.0004 && Math.abs(n.y - last.y) < 0.0004) continue;
        active.pts.push({ x: n.x, y: n.y, p: pressureOf(evs[i]) });
        added = true;
        if (active.tool !== "marker") paintNewest(surface(active), active);
      }
      if (added && active.tool === "marker") {
        lctx.clearRect(0, 0, live.width, live.height);
        paintWhole(lctx, active);
      }
    });

    function end(e) {
      if (pan) {
        pan = null;
        if (e && live.hasPointerCapture && live.hasPointerCapture(e.pointerId)) {
          live.releasePointerCapture(e.pointerId);
        }
        return;
      }
      if (!active) return;
      var done = active; active = null;
      lctx.clearRect(0, 0, live.width, live.height);
      if (done.pts.length) {
        diagram.strokes.push(simplify(done));
        if (done.tool !== "eraser") paintWhole(bctx, done);
        onChange();
      }
      if (e && live.hasPointerCapture && live.hasPointerCapture(e.pointerId)) {
        live.releasePointerCapture(e.pointerId);
      }
    }
    live.addEventListener("pointerup", end);
    live.addEventListener("pointercancel", end);

    return {
      el: wrap,
      layout: layout,
      redraw: redraw,
      undo: function () { diagram.strokes.pop(); redraw(); onChange(); },
      clear: function () { diagram.strokes.length = 0; redraw(); onChange(); },
      setCourt: function (kind) { diagram.court = kind; wrap.innerHTML = courtSvg(kind);
                                  wrap.appendChild(base); wrap.appendChild(live); layout(); onChange(); }
    };
  }

  /* ================= thumbnails ================= */

  function thumbFor(drill) {
    var d = drill.diagrams && drill.diagrams[0];
    var kind = d ? d.court : "half";
    var c = COURTS[kind] || COURTS.half;
    var ink = "";
    if (d && d.strokes.length) {
      for (var i = 0; i < d.strokes.length; i++) {
        var s = d.strokes[i];
        if (s.tool === "eraser" || !s.pts || s.pts.length < 2) continue;
        var dd = "";
        for (var j = 0; j < s.pts.length; j++) {
          dd += (j ? "L" : "M") + (s.pts[j].x * c.w).toFixed(0) + " " + (s.pts[j].y * c.h).toFixed(0) + " ";
        }
        ink += '<path d="' + dd + '" fill="none" stroke="' + s.color +
               '" stroke-width="' + (s.size * 1.6) + '" stroke-linecap="round" stroke-linejoin="round" opacity="' +
               (s.tool === "marker" ? 0.45 : 0.95) + '"/>';
      }
    }
    return '<svg viewBox="0 0 ' + c.w + ' ' + c.h + '" preserveAspectRatio="xMidYMid slice">' +
           c.svg + ink + '</svg>';
  }

  /* ================= views ================= */

  var app = document.getElementById("app");
  var crumb = document.getElementById("crumb");
  var route = { view: "schedule", id: null, filter: "", pfilter: "",
                anchor: null, smode: "week" };
  var pads = [];

  function go(view, id) {
    route.view = view; route.id = id || null;
    render();
    window.scrollTo(0, 0);
  }

  var tabsEl = document.getElementById("tabs");

  // The tabs are for moving between the two lists; inside a record the crumb
  // takes over as the way back, so both are never on screen at once.
  function setChrome() {
    var onList = route.view === "library" || route.view === "practices" ||
                 route.view === "schedule";
    tabsEl.style.display = onList ? "" : "none";
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === route.view));
    });
    crumb.textContent = "";
    crumb.onclick = null;
    crumb.style.cursor = "";
  }

  Array.prototype.forEach.call(tabsEl.children, function (b) {
    b.onclick = function () { go(b.getAttribute("data-view")); };
  });

  function backTo(view, text) {
    crumb.textContent = "\u2039 " + text;
    crumb.style.cursor = "pointer";
    crumb.onclick = function () { go(view); };
  }

  function render() {
    pads = [];
    app.innerHTML = "";
    setChrome();
    if (route.view === "drill") renderEditor();
    else if (route.view === "schedule") renderSchedule();
    else if (route.view === "practices") renderPractices();
    else if (route.view === "practice") renderPracticeEditor();
    else renderLibrary();
    relayout();
  }

  function relayout() { for (var i = 0; i < pads.length; i++) pads[i].layout(); }
  window.addEventListener("resize", function () { clearTimeout(window.__rl);
    window.__rl = setTimeout(relayout, 100); });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- library ---------- */

  // Always tell the truth about whether work is being kept.
  function storageBanner() {
    if (Store.kind === "idb" && !PREVIEW) return null;   // the good case: say nothing
    var w = el("div", "warn");
    if (PREVIEW) {
      w.innerHTML = "<b>Preview — nothing here is kept.</b> This page runs in a sandbox that " +
                    "wipes its storage when you close it. Try the app out, but do not build " +
                    "your real library until it has its own home on the web.";
    } else if (Store.kind === "local") {
      w.innerHTML = "<b>Saving, but to the smaller store.</b> This browser refused the main " +
                    "one, so the library will run out of room sooner. Export a backup regularly.";
    } else {
      w.innerHTML = "<b>Nothing is being saved.</b> This browser is blocking storage entirely — " +
                    "everything you do will vanish when you close the page. Export a backup now.";
    }
    return w;
  }

  function renderLibrary() {
    var wrap = el("div", "wrap");
    var usage = usageMap();

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    var head = el("div", "lib-head");
    var h1 = el("h1", null, "Drill Library");
    var count = el("span", "count",
      state.drills.length ? state.drills.length + (state.drills.length === 1 ? " drill" : " drills") : "");
    head.appendChild(h1); head.appendChild(count);
    wrap.appendChild(head);

    // tag filters, built from what is actually in the library
    var used = {};
    state.drills.forEach(function (d) { if (d.tag) used[d.tag] = (used[d.tag] || 0) + 1; });
    var tagNames = Object.keys(used).sort();
    if (tagNames.length > 1) {
      var f = el("div", "filters");
      var all = el("button", null, "All");
      all.setAttribute("aria-pressed", String(!route.filter));
      all.onclick = function () { route.filter = ""; render(); };
      f.appendChild(all);
      tagNames.forEach(function (t) {
        var b = el("button", null, t + " (" + used[t] + ")");
        b.setAttribute("aria-pressed", String(route.filter === t));
        b.onclick = function () { route.filter = (route.filter === t ? "" : t); render(); };
        f.appendChild(b);
      });
      wrap.appendChild(f);
    }

    var grid = el("div", "grid");

    var add = el("button", "card new");
    add.innerHTML = '<div><div class="plus">+</div><div class="label" style="font-size:12px;margin-top:6px">New drill</div></div>';
    add.onclick = function () {
      var d = newDrill();
      state.drills.unshift(d);
      touch(d);
      go("drill", d.id);
    };
    grid.appendChild(add);

    var list = state.drills.filter(function (d) { return !route.filter || d.tag === route.filter; });
    list.forEach(function (d) {
      var card = el("button", "card");
      var thumb = el("div", "thumb");
      thumb.innerHTML = thumbFor(d);
      var meta = el("div", "meta");
      meta.appendChild(el("div", "name", d.name || "Untitled"));
      var sub = el("div", "sub");
      if (d.tag) { var t = el("span", "tag", d.tag); sub.appendChild(t); }
      var bits = [];
      if (d.format) bits.push(d.format);
      if (d.minutes) bits.push(d.minutes + " min");
      var n = d.diagrams.length;
      bits.push(n + (n === 1 ? " court" : " courts"));
      sub.appendChild(el("span", null, bits.join(" · ")));
      meta.appendChild(sub);
      // The countable fact the library exists to produce.
      if (usage[d.id]) {
        meta.appendChild(el("div", "usage",
          "Run in " + usage[d.id] + (usage[d.id] === 1 ? " practice" : " practices")));
      }
      card.appendChild(thumb); card.appendChild(meta);
      card.onclick = function () { go("drill", d.id); };
      grid.appendChild(card);
    });

    wrap.appendChild(grid);

    if (!state.drills.length) {
      var e = el("div", "empty");
      e.innerHTML = "Nothing here yet.<br>Draw a drill once, then reuse it all season.";
      wrap.appendChild(e);
    }
    app.appendChild(wrap);
  }

  /* ---------- schedule ----------
     Two ways of looking at the same dates. The week is the working view — it
     is where a coach decides what Thursday looks like given Saturday's game.
     The month is for standing back and seeing the block. */

  function renderSchedule() {
    var wrap = el("div", "wrap");

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    if (!route.anchor) route.anchor = todayISO();
    if (!route.smode) route.smode = "week";

    var head = el("div", "lib-head");
    head.appendChild(el("h1", null, "Schedule"));

    var rec = seasonRecord();
    if (rec.w || rec.l || rec.d || rec.pending) {
      var parts = [];
      if (rec.w || rec.l || rec.d) {
        parts.push(rec.w + "–" + rec.l + (rec.d ? "–" + rec.d : ""));
      }
      if (rec.pending) parts.push(rec.pending + " still to play");
      head.appendChild(el("span", "count", parts.join("  ·  ")));
    }

    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);

    var modes = el("div", "tabs");
    [["week", "Week"], ["month", "Month"]].forEach(function (m) {
      var b = el("button", "chip", m[1]);
      b.setAttribute("aria-pressed", String(route.smode === m[0]));
      b.onclick = function () { route.smode = m[0]; render(); };
      modes.appendChild(b);
    });
    head.appendChild(modes);
    wrap.appendChild(head);

    // moving through the season
    var nav = el("div", "cal-nav");
    var step = route.smode === "week" ? 7 : 0;

    var prev = el("button", "chip ghost", "‹");
    prev.setAttribute("aria-label", "Previous");
    prev.onclick = function () {
      route.anchor = step ? addDays(route.anchor, -step) : addMonths(route.anchor, -1);
      render();
    };
    nav.appendChild(prev);

    var title = el("div", "cal-title");
    if (route.smode === "week") {
      var from = startOfWeek(route.anchor);
      title.textContent = shortDate(from) + " – " + shortDate(addDays(from, 6)) +
                          "  " + (isoParts(from) || {}).y;
    } else {
      title.textContent = monthLabel(route.anchor);
    }
    nav.appendChild(title);

    var next = el("button", "chip ghost", "›");
    next.setAttribute("aria-label", "Next");
    next.onclick = function () {
      route.anchor = step ? addDays(route.anchor, step) : addMonths(route.anchor, 1);
      render();
    };
    nav.appendChild(next);

    var today = el("button", "chip ghost", "Today");
    today.onclick = function () { route.anchor = todayISO(); render(); };
    nav.appendChild(today);

    wrap.appendChild(nav);

    if (route.smode === "week") wrap.appendChild(weekView());
    else wrap.appendChild(monthView());

    app.appendChild(wrap);
  }

  function weekView() {
    var box = el("div", "week");
    var from = startOfWeek(route.anchor);
    var now = todayISO();
    for (var i = 0; i < 7; i++) {
      var iso = addDays(from, i);
      box.appendChild(dayRow(iso, iso === now));
    }
    return box;
  }

  function dayRow(iso, isToday) {
    var row = el("div", "day" + (isToday ? " today" : ""));

    var when = el("div", "dwhen");
    when.appendChild(el("div", "dday label", shortDay(iso)));
    when.appendChild(el("div", "dnum", String(dayNum(iso))));
    row.appendChild(when);

    var body = el("div", "dbody");
    var items = dayItems(iso);
    if (!items.length) body.appendChild(el("div", "dempty", "—"));
    items.forEach(function (it) { body.appendChild(itemChip(it)); });
    row.appendChild(body);

    var add = el("button", "dadd", "+");
    add.setAttribute("aria-label", "Add to " + prettyDate(iso));
    add.onclick = function () { openDayMenu(iso); };
    row.appendChild(add);

    return row;
  }

  function itemChip(it) {
    if (it.type === "practice") {
      var p = it.rec;
      var b = el("button", "chip-item practice" + (p.status === "done" ? " done" : ""));
      var line = el("div", "ci-title", "Practice");
      b.appendChild(line);
      var bits = [];
      if (p.time) bits.push(p.time);
      bits.push(p.items.length + (p.items.length === 1 ? " drill" : " drills"));
      var mins = practiceMinutes(p);
      if (mins) bits.push(mins + " min");
      bits.push(p.status === "done" ? "done" : "planned");
      b.appendChild(el("div", "ci-sub", bits.join(" · ")));
      b.onclick = function () { go("practice", p.id); };
      return b;
    }
    var e = it.rec;
    var c = el("button", "chip-item " + e.kind);
    c.appendChild(el("div", "ci-title", eventTitle(e)));
    var sub = [];
    if (e.time) sub.push(e.time);
    if (e.kind !== "note") sub.push(kindLabel(e.kind));
    var r = gameResult(e);
    if (r) sub.push(r + (e.scoreUs > e.scoreThem ? "  W" : e.scoreUs < e.scoreThem ? "  L" : "  D"));
    if (e.note) sub.push(e.note);
    if (sub.length) c.appendChild(el("div", "ci-sub", sub.join(" · ")));
    c.onclick = function () { openEventEditor(e); };
    return c;
  }

  function monthView() {
    var box = el("div", "month-grid");
    var p = isoParts(route.anchor) || isoParts(todayISO());
    var first = p.y + "-" + (p.m < 10 ? "0" : "") + p.m + "-01";
    var gridStart = startOfWeek(first);
    var now = todayISO();

    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) {
      box.appendChild(el("div", "mg-head label", d));
    });

    // six rows always, so the grid does not jump height month to month
    for (var i = 0; i < 42; i++) {
      var iso = addDays(gridStart, i);
      var parts = isoParts(iso);
      var cell = el("div", "mg-cell" +
        (parts.m !== p.m ? " outside" : "") + (iso === now ? " today" : ""));
      cell.appendChild(el("div", "mg-num", String(parts.d)));
      dayItems(iso).forEach(function (it) {
        var dot = el("div", "mg-item " +
          (it.type === "practice" ? "practice" + (it.rec.status === "done" ? " done" : "")
                                  : it.rec.kind));
        dot.textContent = it.type === "practice" ? "Practice" : eventTitle(it.rec);
        cell.appendChild(dot);
      });
      (function (dayIso) {
        cell.onclick = function () {
          route.anchor = dayIso; route.smode = "week"; render();
        };
      })(iso);
      box.appendChild(cell);
    }
    return box;
  }

  /* What can go on a day. A practice is a full record with its own screen; the
     rest are small enough to edit in a sheet. */
