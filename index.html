  /* Four areas over time.
     Decisions worth keeping:
     - The y axis is pinned to the full 1-10 scale. Auto-scaling to the data would
       turn a one-point drift into a cliff, which is exactly the lie a coach would
       act on.
     - x is real elapsed time, not one step per assessment, so two ratings a week
       apart sit a week apart.
     - A rating that was never given breaks the line instead of interpolating.
     - The rows below the chart carry every number, so nothing is readable only
       as a colour. */
  function progressChart(p) {
    var W = 620, H = 250;
    var L = 30, R = 104, T = 12, B = 30;
    var pw = W - L - R, ph = H - T - B;

    var xs = p.assessments.map(function (a) { return dateFromISO(a.date).getTime(); });
    var t0 = Math.min.apply(null, xs), t1 = Math.max.apply(null, xs);
    var span = t1 - t0 || 1;

    function px(t) { return L + ((t - t0) / span) * pw; }
    function py(v) { return T + (1 - (v - 1) / 9) * ph; }

    var svg = ['<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" ' +
               'aria-label="Assessment ratings over time, 1 to 10">'];

    // recessive grid
    [1, 4, 7, 10].forEach(function (v) {
      svg.push('<line x1="' + L + '" y1="' + py(v).toFixed(1) + '" x2="' + (L + pw) +
               '" y2="' + py(v).toFixed(1) + '" class="grid"/>');
      svg.push('<text x="' + (L - 7) + '" y="' + (py(v) + 3.5).toFixed(1) +
               '" class="ax" text-anchor="end">' + v + '</text>');
    });

    // one date label per assessment, thinned if they would collide
    var lastX = -999;
    p.assessments.forEach(function (a, i) {
      var x = px(xs[i]);
      if (x - lastX < 54) return;
      lastX = x;
      svg.push('<text x="' + x.toFixed(1) + '" y="' + (H - 10) +
               '" class="ax" text-anchor="middle">' + shortDate(a.date) + '</text>');
    });

    AREAS.forEach(function (area) {
      var run = [];
      var segments = [];
      p.assessments.forEach(function (a, i) {
        if (a[area.id] === null) {
          if (run.length) segments.push(run);
          run = [];
          return;
        }
        run.push([px(xs[i]), py(a[area.id])]);
      });
      if (run.length) segments.push(run);

      segments.forEach(function (seg) {
        if (seg.length < 2) return;
        var d = seg.map(function (pt, i) {
          return (i ? "L" : "M") + pt[0].toFixed(1) + " " + pt[1].toFixed(1);
        }).join(" ");
        svg.push('<path d="' + d + '" fill="none" stroke="' + area.hue +
                 '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>');
      });

      segments.forEach(function (seg) {
        seg.forEach(function (pt) {
          svg.push('<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) +
                   '" r="4" fill="' + area.hue + '" stroke="var(--panel)" stroke-width="2"/>');
        });
      });

      // direct label at the last point it has a value for
      var lastSeg = segments.length ? segments[segments.length - 1] : null;
      if (lastSeg && lastSeg.length) {
        var end = lastSeg[lastSeg.length - 1];
        svg.push('<circle cx="' + (L + pw + 12) + '" cy="' + end[1].toFixed(1) +
                 '" r="3.5" fill="' + area.hue + '"/>');
        svg.push('<text x="' + (L + pw + 21) + '" y="' + (end[1] + 3.5).toFixed(1) +
                 '" class="ser">' + area.label + '</text>');
      }
    });

    svg.push('</svg>');

    var box = el("div", "chart-box");
    var legend = el("div", "legend");
    AREAS.forEach(function (x) {
      var item = el("div", "leg");
      var dot = el("span", "ma-dot");
      dot.style.background = x.hue;
      item.appendChild(dot);
      item.appendChild(el("span", null, x.label));
      legend.appendChild(item);
    });
    box.appendChild(legend);
    var holder = el("div", "chart-holder");
    holder.innerHTML = svg.join("");
    box.appendChild(holder);
    box.appendChild(el("div", "chart-cap",
      "Rated 1-10. The scale is fixed, so a small change looks small. " +
      "Every number is in the rows below."));
    return box;
  }

  /* ---------- attendance, on a practice ---------- */

  function attendanceBlock(p) {
    var box = el("div", "attend");

    var head = el("div", "assess-head");
    head.appendChild(el("div", "label", "Attendance"));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);

    var squad = state.players.filter(function (x) { return x.active; }).sort(bySquadNumber);

    if (squad.length) {
      var allIn = el("button", "chip ghost", "Everyone in");
      allIn.onclick = function () {
        squad.forEach(function (x) { p.attendance[x.id] = "in"; });
        touchPractice(p); render();
      };
      head.appendChild(allIn);

      var clear = el("button", "chip ghost", "Clear");
      clear.onclick = function () {
        squad.forEach(function (x) { delete p.attendance[x.id]; });
        touchPractice(p); render();
      };
      head.appendChild(clear);
    }
    box.appendChild(head);

    if (!squad.length) {
      box.appendChild(el("div", "empty", "No players in the squad yet."));
      return box;
    }

    squad.forEach(function (pl) {
      var row = el("div", "att-row");
      row.appendChild(el("div", "shirt small",
        pl.number === "" || pl.number === null ? "–" : String(pl.number)));
      row.appendChild(el("div", "att-name", pl.name || "Unnamed"));

      var pips = el("div", "pips");
      ATTEND.forEach(function (a) {
        var b = el("button", null, a.label);
        b.style.width = "auto";
        b.style.padding = "0 11px";
        b.setAttribute("aria-pressed", String(p.attendance[pl.id] === a.id));
        b.onclick = function () {
          if (p.attendance[pl.id] === a.id) delete p.attendance[pl.id];
          else p.attendance[pl.id] = a.id;
          touchPractice(p);
          Array.prototype.forEach.call(pips.children, function (c, k) {
            c.setAttribute("aria-pressed", String(p.attendance[pl.id] === ATTEND[k].id));
          });
        };
        pips.appendChild(b);
      });
      row.appendChild(pips);
      box.appendChild(row);
    });

    var taken = attendanceTaken(p);
    var note = el("div", "chart-cap");
    note.textContent = taken
      ? "Anyone left unmarked is not counted at all — not counted as absent."
      : "No register taken for this practice, so it counts towards nobody's attendance.";
    box.appendChild(note);

    return box;
  }

  /* ---------- schedule ----------
     Two ways of looking at the same dates. The week is the working view — it
     is where a coach decides what Thursday looks like given Saturday's game.
     The month is for standing back and seeing the block. */

  function renderSchedule() {
    var wrap = el("div", "wrap");

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    if (!route.anchor) route.anchor = todayISO();
    if (!route.smode) route.smode = "week";

    var head = el("div", "lib-head");
    head.appendChild(el("h1", null, "Schedule"));

    var rec = seasonRecord();
    if (rec.w || rec.l || rec.d || rec.pending) {
      var parts = [];
      if (rec.w || rec.l || rec.d) {
        parts.push(rec.w + "–" + rec.l + (rec.d ? "–" + rec.d : ""));
      }
      if (rec.pending) parts.push(rec.pending + " still to play");
      head.appendChild(el("span", "count", parts.join("  ·  ")));
    }

    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);

    var modes = el("div", "tabs");
    [["week", "Week"], ["month", "Month"]].forEach(function (m) {
      var b = el("button", "chip", m[1]);
      b.setAttribute("aria-pressed", String(route.smode === m[0]));
      b.onclick = function () { route.smode = m[0]; render(); };
      modes.appendChild(b);
    });
    head.appendChild(modes);

    var sprint = el("button", "chip ghost noprint", "Print");
    sprint.onclick = function () { window.print(); };
    head.appendChild(sprint);
    wrap.appendChild(head);

    // moving through the season
    var nav = el("div", "cal-nav");
    var step = route.smode === "week" ? 7 : 0;

    var prev = el("button", "chip ghost", "‹");
    prev.setAttribute("aria-label", "Previous");
    prev.onclick = function () {
      route.anchor = step ? addDays(route.anchor, -step) : addMonths(route.anchor, -1);
      render();
    };
    nav.appendChild(prev);

    var title = el("div", "cal-title");
    if (route.smode === "week") {
      var from = startOfWeek(route.anchor);
      title.textContent = shortDate(from) + " – " + shortDate(addDays(from, 6)) +
                          "  " + (isoParts(from) || {}).y;
    } else {
      title.textContent = monthLabel(route.anchor);
    }
    nav.appendChild(title);

    var next = el("button", "chip ghost", "›");
    next.setAttribute("aria-label", "Next");
    next.onclick = function () {
      route.anchor = step ? addDays(route.anchor, step) : addMonths(route.anchor, 1);
      render();
    };
    nav.appendChild(next);

    var today = el("button", "chip ghost", "Today");
    today.onclick = function () { route.anchor = todayISO(); render(); };
    nav.appendChild(today);

    wrap.appendChild(nav);

    if (route.smode === "week") wrap.appendChild(weekView());
    else wrap.appendChild(monthView());

    app.appendChild(wrap);
  }

  function weekView() {
    var box = el("div", "week");
    var from = startOfWeek(route.anchor);
    var now = todayISO();
    for (var i = 0; i < 7; i++) {
      var iso = addDays(from, i);
      box.appendChild(dayRow(iso, iso === now));
    }
    return box;
  }

  function dayRow(iso, isToday) {
    var row = el("div", "day" + (isToday ? " today" : ""));

    var when = el("div", "dwhen");
    when.appendChild(el("div", "dday label", shortDay(iso)));
    when.appendChild(el("div", "dnum", String(dayNum(iso))));
    row.appendChild(when);

    var body = el("div", "dbody");
    var items = dayItems(iso);
    if (!items.length) body.appendChild(el("div", "dempty", "—"));
    items.forEach(function (it) { body.appendChild(itemChip(it)); });
    row.appendChild(body);

    var add = el("button", "dadd", "+");
    add.setAttribute("aria-label", "Add to " + prettyDate(iso));
    add.onclick = function () { openDayMenu(iso); };
    row.appendChild(add);

    return row;
  }

  function itemChip(it) {
    if (it.type === "practice") {
      var p = it.rec;
      var b = el("button", "chip-item mid practice" + (p.status === "done" ? " done" : ""));
      var line = el("div", "ci-title", "Practice");
      b.appendChild(line);
      var bits = [];
      var when = timeRange(p.time, p.timeEnd);
      if (when) bits.push(when);
      bits.push(p.items.length + (p.items.length === 1 ? " item" : " items"));
      var mins = practiceMinutes(p);
      if (mins) bits.push(mins + " min");
      bits.push(p.status === "done" ? "done" : "planned");
      b.appendChild(el("div", "ci-sub", bits.join(" · ")));
      b.onclick = function () { go("practice", p.id, "schedule"); };
      return b;
    }
    var e = it.rec;
    var c = el("button", "chip-item " + tierOf(it) + " " + e.kind);
    c.appendChild(el("div", "ci-title", eventTitle(e)));
    var sub = [];
    if (e.time) sub.push(e.time);
    if (e.kind !== "note") sub.push(kindLabel(e.kind));
    var r = gameResult(e);
    if (r) sub.push(r + (e.scoreUs > e.scoreThem ? "  W" : e.scoreUs < e.scoreThem ? "  L" : "  D"));
    if (e.note) sub.push(e.note);
    if (sub.length) c.appendChild(el("div", "ci-sub", sub.join(" · ")));
    c.onclick = function () { openEventEditor(e); };
    return c;
  }

  function monthView() {
    var box = el("div", "month-grid");
    var p = isoParts(route.anchor) || isoParts(todayISO());
    var first = p.y + "-" + (p.m < 10 ? "0" : "") + p.m + "-01";
    var gridStart = startOfWeek(first);
    var now = todayISO();

    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) {
      box.appendChild(el("div", "mg-head label", d));
    });

    // six rows always, so the grid does not jump height month to month
    for (var i = 0; i < 42; i++) {
      var iso = addDays(gridStart, i);
      var parts = isoParts(iso);
      var cell = el("div", "mg-cell" +
        (parts.m !== p.m ? " outside" : "") + (iso === now ? " today" : ""));
      cell.appendChild(el("div", "mg-num", String(parts.d)));
      dayItems(iso).forEach(function (it) {
        var dot = el("div", "mg-item " + tierOf(it) + " " +
          (it.type === "practice" ? "practice" + (it.rec.status === "done" ? " done" : "")
                                  : it.rec.kind));
        dot.textContent = it.type === "practice" ? "Practice" : eventTitle(it.rec);
        (function (item) {
          dot.onclick = function (ev) {
            if (ev && ev.stopPropagation) ev.stopPropagation();
            if (item.type === "practice") go("practice", item.rec.id, "schedule");
            else openEventEditor(item.rec);
          };
        })(it);
        cell.appendChild(dot);
      });
      /* This used to drop straight into the week, which quietly changed the view
         mode and left it changed — plan a session from the month and every later
         visit to the schedule opened on the week instead. The month now adds to
         the day you are standing on, and going to that week is an option on the
         menu rather than something that happens to you. */
      (function (dayIso) {
        cell.onclick = function () { route.anchor = dayIso; openDayMenu(dayIso, true); };
      })(iso);
      box.appendChild(cell);
    }
    return box;
  }

  /* What can go on a day. A practice is a full record with its own screen; the
     rest are small enough to edit in a sheet. */

  function openDayMenu(iso, offerWeek) {
    var back = el("div", "modal-back");
    var panel = el("div", "modal choice");

    var head = el("div", "modal-head");
    head.appendChild(el("div", "mtitle", "Add to " + prettyDate(iso)));
    panel.appendChild(head);

    function close() { back.remove(); }

    var opts = el("div", "choice-opts");

    var prac = el("button", "choice-btn");
    prac.innerHTML = "<b>Practice</b><span>A session: which drills, how long, and how it went.</span>";
    prac.onclick = function () {
      close();
      var p = newPractice();
      p.date = iso;
      state.practices.unshift(p);
      state.practices.sort(byDateDesc);
      touchPractice(p);
      go("practice", p.id, "schedule");
    };
    opts.appendChild(prac);

    EVENT_KINDS.forEach(function (k) {
      var b = el("button", "choice-btn");
      b.innerHTML = "<b>" + k.label + "</b><span>" + k.hint + "</span>";
      b.onclick = function () {
        close();
        var e = newEvent(k.id, iso);
        state.events.push(e);
        state.events.sort(byDateDesc);
        touchEvent(e);
        openEventEditor(e);
      };
      opts.appendChild(b);
    });

    if (offerWeek) {
      var wk = el("button", "choice-btn");
      wk.innerHTML = "<b>Open this week</b><span>See the whole week this day sits in.</span>";
      wk.onclick = function () { close(); route.smode = "week"; render(); };
      opts.appendChild(wk);
    }

    var cancel = el("button", "choice-btn");
    cancel.innerHTML = "<b>Cancel</b><span>Change nothing.</span>";
    cancel.onclick = close;
    opts.appendChild(cancel);

    panel.appendChild(opts);
    back.onclick = function (ev) { if (ev.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  function openEventEditor(e) {
    var back = el("div", "modal-back");
    var panel = el("div", "modal choice");

    var head = el("div", "modal-head");
    head.appendChild(el("div", "mtitle", kindLabel(e.kind)));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);
    var doneBtn = el("button", "chip primary", "Done");
    doneBtn.onclick = close;
    head.appendChild(doneBtn);
    panel.appendChild(head);

    var form = el("div", "ev-form");

    function field(label, node) {
      var f = el("div", "field");
      f.appendChild(el("div", "label", label));
      f.appendChild(node);
      return f;
    }

    function textInput(value, placeholder, set) {
      var i = document.createElement("input");
      i.type = "text"; i.value = value || ""; i.placeholder = placeholder || "";
      i.oninput = function () { set(i.value); touchEvent(e); };
      return i;
    }

    var whenRow = el("div", "ev-row");
    var di = document.createElement("input");
    di.type = "date"; di.value = e.date || "";
    di.onchange = function () {
      e.date = di.value; touchEvent(e); state.events.sort(byDateDesc);
    };
    whenRow.appendChild(field("Date", di));

    whenRow.appendChild(typedField("Time", e.time, "19:00", parseTime,
      function (v) { return v; },
      function (v) { e.time = v; touchEvent(e); }, ""));
    form.appendChild(whenRow);

    if (e.kind === "game") {
      form.appendChild(field("Opponent",
        textInput(e.title, "Who you play", function (v) { e.title = v; })));

      var venue = el("div", "field");
      venue.appendChild(el("div", "label", "Where"));
      var vr = el("div", "pips");
      [["home", "Home"], ["away", "Away"], ["neutral", "Neutral"]].forEach(function (v) {
        var b = el("button", null, v[1]);
        b.style.width = "auto";
        b.style.padding = "0 12px";
        b.setAttribute("aria-pressed", String(e.venue === v[0]));
        b.onclick = function () {
          e.venue = (e.venue === v[0] ? "" : v[0]);
          touchEvent(e);
          Array.prototype.forEach.call(vr.children, function (c, k) {
            c.setAttribute("aria-pressed", String(e.venue === ["home", "away", "neutral"][k]));
          });
        };
        vr.appendChild(b);
      });
      venue.appendChild(vr);
      form.appendChild(venue);

      var scoreRow = el("div", "ev-row");
      function scoreInput(value, set) {
        var i = document.createElement("input");
        i.type = "number"; i.min = "0"; i.max = "300";
        i.value = value === null || value === undefined ? "" : value;
        i.oninput = function () {
          set(i.value === "" ? null : Math.max(0, parseInt(i.value, 10) || 0));
          touchEvent(e);
        };
        return i;
      }
      scoreRow.appendChild(field("Us", scoreInput(e.scoreUs, function (v) { e.scoreUs = v; })));
      scoreRow.appendChild(field("Them", scoreInput(e.scoreThem, function (v) { e.scoreThem = v; })));
      form.appendChild(scoreRow);

      var unplayed = el("div", "hint");
      unplayed.innerHTML = "Leave the scores empty until it is played — " +
                           "a game with no score is counted as still to play, never as a draw.";
      form.appendChild(unplayed);
    } else {
      form.appendChild(field(e.kind === "tournament" ? "Tournament" : "What",
        textInput(e.title, kindLabel(e.kind), function (v) { e.title = v; })));
    }

    var noteField = el("div", "field");
    noteField.appendChild(el("div", "label", "Note"));
    var ta = document.createElement("textarea");
    ta.value = e.note || "";
    ta.style.minHeight = "60px";
    ta.oninput = function () { e.note = ta.value; touchEvent(e); };
    noteField.appendChild(ta);
    form.appendChild(noteField);

    panel.appendChild(form);

    var foot = el("div", "foot-row");
    foot.style.marginTop = "16px";
    var del = el("button", "chip danger", "Delete");
    del.onclick = function () {
      if (!confirm("Delete this " + kindLabel(e.kind).toLowerCase() + "?")) return;
      removeEvent(e.id);
      close();
    };
    foot.appendChild(del);
    panel.appendChild(foot);

    function close() {
      document.removeEventListener("keydown", onKey);
      back.remove();
      render();
    }
    function onKey(ev) { if (ev.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    back.onclick = function (ev) { if (ev.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  /* ---------- practices ---------- */

  function renderPractices() {
    var wrap = el("div", "wrap");

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    var doneList = state.practices.filter(function (p) { return p.status === "done"; });
    var planned = state.practices.length - doneList.length;

    var head = el("div", "lib-head");
    head.appendChild(el("h1", null, "Practices"));
    var bits = [];
    if (doneList.length) bits.push(doneList.length + " done");
    if (planned) bits.push(planned + " planned");
    head.appendChild(el("span", "count", bits.join(" · ")));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);
    var add = el("button", "chip primary", "+  New practice");
    add.onclick = function () {
      var p = newPractice();
      state.practices.unshift(p);
      touchPractice(p);
      go("practice", p.id);
    };
    head.appendChild(add);
    wrap.appendChild(head);

    if (state.practices.length > 1) {
      var f = el("div", "filters");
      [["", "All"], ["planned", "Planned"], ["done", "Done"]].forEach(function (o) {
        var b = el("button", null, o[1]);
        b.setAttribute("aria-pressed", String(route.pfilter === o[0]));
        b.onclick = function () { route.pfilter = o[0]; render(); };
        f.appendChild(b);
      });
      wrap.appendChild(f);
    }

    var list = state.practices.filter(function (p) {
      return !route.pfilter || p.status === route.pfilter;
    });

    var month = null;
    list.forEach(function (p) {
      var m = monthLabel(p.date);
      if (m !== month) { month = m; wrap.appendChild(el("div", "month label", m)); }
      wrap.appendChild(practiceRow(p));
    });

    if (!state.practices.length) {
      var e = el("div", "empty");
      e.innerHTML = "No practices yet.<br>Log a session and the library starts counting.";
      wrap.appendChild(e);
    } else if (!list.length) {
      wrap.appendChild(el("div", "empty", "Nothing with that status."));
    }

    app.appendChild(wrap);
  }

  function practiceRow(p) {
    var row = el("button", "prow");

    var left = el("div", "pwhen");
    left.appendChild(el("div", "pdate", prettyDate(p.date)));
    left.appendChild(el("div", "pbadge" + (p.status === "done" ? " done" : ""),
                       p.status === "done" ? "Done" : "Planned"));
    row.appendChild(left);

    var right = el("div", "pwhat");
    var drills = p.items.filter(function (it) { return it.kind !== "tactic"; }).length;
    var tactics = p.items.length - drills;
    var mins = practiceMinutes(p);
    var sub = [];
    if (drills || !tactics) sub.push(drills + (drills === 1 ? " drill" : " drills"));
    if (tactics) sub.push(tactics + (tactics === 1 ? " tactic" : " tactics"));
    if (mins) sub.push(mins + " min");
    right.appendChild(el("div", "psub", sub.join(" · ")));
    right.appendChild(p.items.length
      ? el("div", "pnames", p.items.map(itemLabel).join("   ·   "))
      : el("div", "pnames dim", "Nothing added yet"));
    if (p.note) right.appendChild(el("div", "pnote", p.note));
    row.appendChild(right);

    row.onclick = function () { go("practice", p.id); };
    return row;
  }

  /* ---------- one practice ---------- */

  function renderPracticeEditor() {
    var p = findPractice(route.id);
    if (!p) { go("practices"); return; }

    var back = route.from === "schedule" ? ["schedule", "Schedule"] : ["practices", "Practices"];
    backTo(back[0], back[1]);

    var wrap = el("div", "wrap narrow");

    var head = el("div", "prac-head");

    var dateField = el("div", "field");
    dateField.appendChild(el("div", "label", "Date"));
    var di = document.createElement("input");
    di.type = "date"; di.value = p.date || "";
    di.onchange = function () {
      p.date = di.value;
      touchPractice(p);
      state.practices.sort(byDateDesc);
    };
    dateField.appendChild(di);
    head.appendChild(dateField);

    var span = spanMinutes(p.time, p.timeEnd);
    head.appendChild(typedField("From", p.time, "18:00", parseTime, function (v) { return v; },
      function (v) { p.time = v; touchPractice(p); render(); },
      span === null ? "" : "on court " + span + " min"));
    head.appendChild(typedField("To", p.timeEnd, "19:30", parseTime, function (v) { return v; },
      function (v) { p.timeEnd = v; touchPractice(p); render(); }, ""));

    var statusField = el("div", "field");
    statusField.appendChild(el("div", "label", "Status"));
    var st = el("div");
    st.appendChild(el("span", "pbadge" + (p.status === "done" ? " done" : ""),
                      p.status === "done" ? "Done" : "Planned"));
    statusField.appendChild(st);
    head.appendChild(statusField);

    var totalField = el("div", "field");
    totalField.appendChild(el("div", "label", "Total"));
    var mins = practiceMinutes(p);
    totalField.appendChild(el("div", "ptotal", mins ? mins + " min" : "—"));
    head.appendChild(totalField);

    wrap.appendChild(head);

    var list = el("div", "items");
    p.items.forEach(function (it, i) { list.appendChild(itemRow(p, it, i)); });
    wrap.appendChild(list);

    if (!p.items.length) {

    ta.placeholder = "How it went, who stood out, what to fix next time.";
    ta.oninput = function () { p.note = ta.value; touchPractice(p); };
    noteField.appendChild(ta);
    wrap.appendChild(noteField);

    var footer = el("div", "prac-foot");

  function itemRow(p, it, i) {
    var row = el("div", "item");

    row.appendChild(el("div", "inum", String(i + 1)));

    var sub = [], gone = false;
    if (it.kind === "tactic") {
      var t = it.tacticId ? findTactic(it.tacticId) : null;
      gone = it.tacticId && !t;
      sub.push("Tactic");
      if (t && t.side) sub.push(t.side);
      if (t && t.category) sub.push(t.category);
      if (gone) sub.push("no longer in the package");
    } else {
      var d = it.drillId ? findDrill(it.drillId) : null;
      gone = it.drillId && !d;
      if (d && d.tag) sub.push(d.tag);
      if (d && d.format) sub.push(d.format);
      if (gone) sub.push("no longer in the library");
    }

    var body = el("div", "ibody");
    body.appendChild(el("div", "iname", itemLabel(it)));
    if (sub.length) body.appendChild(el("div", "isub" + (gone ? " gone" : ""), sub.join(" · ")));
    row.appendChild(body);

    var mi = document.createElement("input");
    mi.type = "number"; mi.min = "0"; mi.max = "240"; mi.className = "imin";
    mi.value = it.minutes;
    mi.setAttribute("aria-label", "Minutes");
    mi.oninput = function () {
      it.minutes = Math.max(0, parseInt(mi.value, 10) || 0);
      touchPractice(p);
      var t = app.querySelector(".ptotal");
      var m = practiceMinutes(p);
      if (t) t.textContent = m ? m + " min" : "—";
    };
    row.appendChild(mi);
    row.appendChild(el("div", "imunit", "min"));

    var moves = el("div", "imoves");
    var up = el("button", "mini", "↑");
    up.title = "Move earlier";
    up.disabled = i === 0;
    up.onclick = function () {
      p.items.splice(i - 1, 0, p.items.splice(i, 1)[0]);
      touchPractice(p); render();
    };
    var down = el("button", "mini", "↓");
    down.title = "Move later";
    down.disabled = i === p.items.length - 1;
    down.onclick = function () {
      p.items.splice(i + 1, 0, p.items.splice(i, 1)[0]);
      touchPractice(p); render();
    };
    var rm = el("button", "mini rm", "×");
    rm.title = "Take out of this practice";
    rm.onclick = function () {
      p.items.splice(i, 1);
      touchPractice(p); render();
    };
    moves.appendChild(up); moves.appendChild(down); moves.appendChild(rm);
    row.appendChild(moves);

    return row;

  /* ---------- putting things into a practice ----------
     Drills and tactics come from the same sheet, because from the coach's side
     they are the same act: this is what we spent the session on. The sheet stays
     open after each pick — a practice is several things, and reopening the list
     every time would turn taps back into work. */

  function openDrillPicker(p) {
    var q = "", tag = "", source = "drills", filterRow = null, rows = null;

    var back = el("div", "modal-back");
    var panel = el("div", "modal");

    var mhead = el("div", "modal-head");
    mhead.appendChild(el("div", "mtitle", "Add to practice"));
    var added = el("div", "count", "");
    mhead.appendChild(added);
    var gap = el("div"); gap.style.marginLeft = "auto";
    mhead.appendChild(gap);
    var closeBtn = el("button", "chip primary", "Done");
    closeBtn.onclick = close;
    mhead.appendChild(closeBtn);
    panel.appendChild(mhead);

    var sourceRow = el("div", "tabs");
    sourceRow.style.margin = "0 0 12px";
    [["drills", "Drills"], ["tactics", "Tactics"]].forEach(function (s) {
      var b = el("button", "chip", s[1]);
      b.setAttribute("aria-pressed", String(source === s[0]));
      b.onclick = function () {
        source = s[0]; tag = "";
        Array.prototype.forEach.call(sourceRow.children, function (c, k) {
          c.setAttribute("aria-pressed", String(["drills", "tactics"][k] === source));
        });
        rebuildFilters();
        paint();
      };
      sourceRow.appendChild(b);
    });
    panel.appendChild(sourceRow);

    var search = document.createElement("input");
    search.type = "text"; search.placeholder = "Search";
    search.className = "msearch";
    search.oninput = function () { q = search.value.toLowerCase(); paint(); };
    panel.appendChild(search);

    var filterHolder = el("div");
    panel.appendChild(filterHolder);

    rows = el("div", "mrows");
    panel.appendChild(rows);

    function rebuildFilters() {
      filterHolder.innerHTML = "";
      filterRow = null;
      var names;
      if (source === "drills") {
        var used = {};
        state.drills.forEach(function (d) { if (d.tag) used[d.tag] = 1; });
        names = Object.keys(used).sort();
      } else {
        names = SIDES.filter(function (s) {
          return state.tactics.some(function (t) { return t.side === s; });
        });
      }
      if (names.length < 2) return;
      filterRow = el("div", "filters");
      var all = el("button", null, "All");
      all.onclick = function () { tag = ""; paint(); };
      filterRow.appendChild(all);
      names.forEach(function (n) {
        var b = el("button", null, n);
        b.onclick = function () { tag = (tag === n ? "" : n); paint(); };
        filterRow.appendChild(b);
      });
      filterHolder.appendChild(filterRow);
    }

    function row(thumbHtml, title, subBits, onPick) {
      var r = el("button", "mrow");
      var th = el("div", "mthumb");
      th.innerHTML = thumbHtml;
      r.appendChild(th);
      var body = el("div", "mbody");
      body.appendChild(el("div", "mname", title));
      body.appendChild(el("div", "isub", subBits.filter(Boolean).join(" · ")));
      r.appendChild(body);
      var plus = el("div", "mplus", "+");
      r.appendChild(plus);
      r.onclick = function () {
        onPick();
        touchPractice(p);
        count();
        plus.textContent = "✓";
        plus.className = "mplus on";
        setTimeout(function () { plus.textContent = "+"; plus.className = "mplus"; }, 700);
      };
      return r;
    }

    function matches(text) { return !q || String(text || "").toLowerCase().indexOf(q) >= 0; }

    function paint() {
      if (filterRow) {
        Array.prototype.forEach.call(filterRow.children, function (b, idx) {
          b.setAttribute("aria-pressed", String(idx === 0 ? tag === "" : tag === b.textContent));
        });
      }
      rows.innerHTML = "";

      if (source === "drills") {
        if (!state.drills.length) {
          var e = el("div", "empty");
          e.innerHTML = "The library is empty.<br>Draw a drill first — practices are built from it.";
          rows.appendChild(e);
          return;
        }
        var hits = state.drills.filter(function (d) {
          if (tag && d.tag !== tag) return false;
          return matches(d.name) || matches(d.tag) || matches(d.points);
        });
        if (!hits.length) { rows.appendChild(el("div", "empty", "No drill matches that.")); return; }
        hits.forEach(function (d) {
          rows.appendChild(row(thumbFor(d), d.name || "Untitled",
            [d.tag, d.format, d.minutes ? d.minutes + " min" : ""],
            function () { p.items.push(newItem(d)); }));
        });
        return;
      }

      if (!state.tactics.length) {
        var e2 = el("div", "empty");
        e2.innerHTML = "No tactics yet.<br>Build a set and its options first.";
        rows.appendChild(e2);
        return;
      }
      var any = false;
      state.tactics.forEach(function (t) {
        if (tag && t.side !== tag) return;
        t.options.forEach(function (o) {
          if (!(matches(t.name) || matches(o.name) || matches(o.points) || matches(t.category))) return;
          any = true;
          rows.appendChild(row(thumbForDiagram(o.diagrams && o.diagrams[0]),
            optionLabel(t, o), [t.side, t.category],
            function () { p.items.push(newTacticItem(t, o)); }));
        });
      });
      if (!any) rows.appendChild(el("div", "empty", "No tactic matches that."));
    }

    function count() {
      var n = p.items.length;
      added.textContent = n ? n + (n === 1 ? " thing in this practice" : " things in this practice") : "";
    }

    function close() {
      document.removeEventListener("keydown", onKey);
      back.remove();
      render();
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    rebuildFilters();
    paint();
    count();

    back.onclick = function (e) { if (e.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  function buildMeta(drill) {

  // A select that also accepts a value it has never seen, so the lists grow with use.
  /* Intensity runs 1-10, not 1-5, because that is the scale the club's own
     measurements were taken on — 36 of the imported drills carry a real tracked
     number. Measured values have a decimal (8.59); the pips mark the nearest
     whole number and the exact figure is shown beside them, so tapping a pip is
     always a deliberate change rather than a silent rounding. The untouched
     original stays in `load.measured` either way. */

  function buildIntensity(drill) {
    var f = el("div", "field");
    f.style.marginTop = "14px";

    var head = el("div", "int-head");
    head.appendChild(el("div", "label", "Intensity"));
    var readout = el("div", "int-read");
    var measured = drill.load && typeof drill.load.measured === "number";
    function say() {
      var v = Number(drill.intensity) || 0;
      readout.textContent = (Math.round(v * 100) % 100 ? v.toFixed(2) : String(v)) + " / 10" +
        (measured && Math.abs(v - drill.load.measured) < 1e-9 ? "  ·  measured" : "");
    }
    head.appendChild(readout);
    f.appendChild(head);

    var pips = el("div", "pips");
    var lit = Math.round(Number(drill.intensity) || 0);
    for (var i = 1; i <= 10; i++) (function (n) {
      var b = el("button", null, String(n));
      b.setAttribute("aria-pressed", String(lit === n));
      b.onclick = function () {
        drill.intensity = n; touch(drill);
        measured = false;
        Array.prototype.forEach.call(pips.children, function (c, k) {
          c.setAttribute("aria-pressed", String(k + 1 === n));
        });
        say();
      };
      pips.appendChild(b);
    })(i);
    f.appendChild(pips);
    say();
    return f;
  }

  /* A typed field that validates on blur: good input is normalised and saved,
     a typo turns the box red and is not saved over the last good value. */
  /* Type only the numbers; the box puts the dots and colons in as you go.
     He knows the format — making him also tap "." and ":" on an iPad keyboard is
     two extra taps per field, and the punctuation is never in doubt.

     The mask is read from the placeholder rather than declared a second time
     beside it, so "DD.MM.YYYY" and "18:00" cannot drift apart from the thing
     that describes them. Any alphanumeric character in the placeholder is a slot
     for a digit; anything else is punctuation the box supplies itself. */
  function maskFrom(placeholder) {
    // A format has no spaces in it. "Who you play" is a prompt, not a pattern,
    // and must never be turned into a mask that eats what he types.
    if (!placeholder || /\s/.test(placeholder)) return null;
    var seps = {}, n = 0, marks = 0;
    for (var i = 0; i < placeholder.length; i++) {
      var c = placeholder.charAt(i);
      if (/[A-Za-z0-9]/.test(c)) n++;
      else { seps[n] = c; marks++; }
    }
    return (marks > 0 && n > 1) ? { seps: seps, max: n } : null;
  }

  function maskText(m, digits) {
    var out = "";
    for (var i = 0; i < digits.length; i++) {
      if (i > 0 && m.seps[i]) out += m.seps[i];
      out += digits.charAt(i);
    }
    return out;
  }

  // Where the caret sits after the nth digit of the punctuated text.
  function caretAfter(text, n) {
    if (n <= 0) return 0;
    var seen = 0;
    for (var i = 0; i < text.length; i++) {
      if (/\d/.test(text.charAt(i))) { seen++; if (seen === n) return i + 1; }
    }
    return text.length;
  }

  function autoPunctuate(input, m) {
    input._digits = input.value.replace(/\D/g, "");
    input.addEventListener("input", function (e) {
      var raw = input.value;
      var caret = typeof input.selectionStart === "number" ? input.selectionStart : raw.length;
      var before = raw.slice(0, caret).replace(/\D/g, "").length;
      var digits = raw.replace(/\D/g, "");
      /* Backspacing onto a dot deletes only the dot, which the next reformat puts
         straight back — one press would look like nothing happened. Take the digit
         it was guarding as well, so one press always removes one thing. */
      var deleting = e && typeof e.inputType === "string" && e.inputType.indexOf("delete") === 0;
      if (deleting && digits.length === input._digits.length && before > 0) {
        digits = digits.slice(0, before - 1) + digits.slice(before);
        before -= 1;
      }
      digits = digits.slice(0, m.max);
      if (before > digits.length) before = digits.length;
      var text = maskText(m, digits);
      input._digits = digits;
      if (input.value !== text) input.value = text;
      if (input.setSelectionRange) {
        var at = caretAfter(text, before);
        try { input.setSelectionRange(at, at); } catch (err) {}
      }
    });
    return input;
  }

  function typedField(label, value, placeholder, parse, format, onSet, hint) {
    var f = el("div", "field");
    f.appendChild(el("div", "label", label));
    var i = document.createElement("input");
    i.type = "text";
    i.setAttribute("inputmode", "numeric");
    i.autocomplete = "off";
    i.placeholder = placeholder;
    i.value = value ? format(value) : "";
    var note = el("div", "field-note");
    if (hint) note.textContent = hint;
    function commit() {
      var raw = i.value.trim();
      if (raw === "") { onSet(""); i.classList.remove("bad"); note.textContent = hint || ""; return; }
      var parsed = parse(raw);
      if (parsed === null) {
        i.classList.add("bad");
        note.textContent = "Not a " + label.toLowerCase() + " — expected " + placeholder;
        return;
      }
      i.classList.remove("bad");
      i.value = format(parsed);
      i._digits = i.value.replace(/\D/g, "");
      note.textContent = hint || "";
      onSet(parsed);
    }
    i.onblur = commit;
    i.onkeydown = function (e) { if (e.key === "Enter") { commit(); i.blur(); } };
    var m = maskFrom(placeholder);
    if (m) autoPunctuate(i, m);
    f.appendChild(i);
    f.appendChild(note);
    return f;
  }

  function pickerField(label, options, value, onSet) {
    var f = el("div", "field");
    f.appendChild(el("div", "label", label));
    var sel = document.createElement("select");
    var opts = options.slice();
    if (value && opts.indexOf(value) === -1) opts.push(value);
    sel.appendChild(new Option("—", ""));
    opts.forEach(function (o) { sel.appendChild(new Option(o, o)); });
    sel.appendChild(new Option("Add new…", "__new"));
    sel.value = value || "";
    sel.onchange = function () {
      if (sel.value === "__new") {
        var v = prompt("New " + label.toLowerCase());
        if (v && v.trim()) {
          v = v.trim();
          sel.insertBefore(new Option(v, v), sel.lastChild);
          sel.value = v; onSet(v);
        } else { sel.value = value || ""; }
        return;
      }
      value = sel.value; onSet(sel.value);
    };
    f.appendChild(sel);
    return f;
  }

  /* The diagram editor is shared by drills and tactic options, so it takes the
     list it belongs to and a save function rather than a drill. */
  function buildDiagram(dg, i, list, save, ownerWord) {
    var box = el("div", "diagram");
    var head = el("div", "diagram-head");
    head.appendChild(el("span", "num", "Court " + (i + 1)));

    var cap = document.createElement("input");
    cap.type = "text"; cap.value = dg.caption;
    cap.placeholder = "What this one shows — e.g. initial spacing";
    cap.oninput = function () { dg.caption = cap.value; save(); };
    head.appendChild(cap);

    var grp = el("div", "grp");
    var pad;

    ["half", "full"].forEach(function (k) {
      var b = el("button", "chip", k === "half" ? "Half" : "Full");
      b.setAttribute("aria-pressed", String(dg.court === k));
      b.onclick = function () {
        dg.court = k; save();
        Array.prototype.forEach.call(grp.querySelectorAll("[data-court]"), function (x) {
          x.setAttribute("aria-pressed", String(x.getAttribute("data-court") === k));
        });
        pad.setCourt(k);
      };
      b.setAttribute("data-court", k);
      grp.appendChild(b);
    });

    ["S", "M", "L"].forEach(function (s) {
      var b = el("button", "chip", s);
      b.setAttribute("data-size", s);
      b.setAttribute("aria-pressed", String(dg.size === s));
      b.onclick = function () {
        dg.size = s; save();
        Array.prototype.forEach.call(grp.querySelectorAll("[data-size]"), function (x) {
          x.setAttribute("aria-pressed", String(x.getAttribute("data-size") === s));
        });
        pad.layout();
      };
      grp.appendChild(b);
    });

    var undo = el("button", "chip", "Undo");
    undo.onclick = function () { pad.undo(); };
    grp.appendChild(undo);

    if (list.length > 1) {
      var rm = el("button", "chip danger", "Remove");
      rm.onclick = function () {
        if (!confirm("Remove court " + (i + 1) + " from this " + ownerWord + "?")) return;
        list.splice(i, 1); save(); render();
      };
      grp.appendChild(rm);
    }

    head.appendChild(grp);
    box.appendChild(head);

    var holder = el("div", null);
    box.appendChild(holder);
    pad = Pad(holder, dg, save);
    pads.push(pad);

    return box;
  }

  /* ---------- tool rail ---------- */

  var ICONS = {
    pen: '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>',
    marker: '<path d="M5 19h5l9-9a2.8 2.8 0 0 0-4-4l-9 9v4z"/><path d="M3 21h8"/>',
    eraser: '<path d="M8 20l-4-4a1.8 1.8 0 0 1 0-2.5l8-8a1.8 1.8 0 0 1 2.5 0l4.5 4.5a1.8 1.8 0 0 1 0 2.5L14 20z"/><path d="M20 20h-9"/>'
  };

  function buildRail() {
    var rail = el("nav", "rail");
    rail.setAttribute("aria-label", "Drawing tools");

    ["pen", "marker", "eraser"].forEach(function (t) {
      var b = el("button", "tool");
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[t] + "</svg>";
      b.title = t.charAt(0).toUpperCase() + t.slice(1);
      b.setAttribute("aria-pressed", String(tool.name === t));
      b.onclick = function () {
        tool.name = t;
        Array.prototype.forEach.call(rail.querySelectorAll(".tool"), function (x, i) {
          x.setAttribute("aria-pressed", String(["pen", "marker", "eraser"][i] === t));
        });
      };
      rail.appendChild(b);
    });

    rail.appendChild(el("hr"));
    rail.appendChild(el("div", "cap label", "Ink"));
    [["#22201C", "Black"], ["#C8322B", "Red"], ["#2563B0", "Blue"], ["#2E8B4F", "Green"]]
      .forEach(function (c) {
        var b = el("button", "swatch");
        b.style.background = c[0]; b.title = c[1];
        b.setAttribute("data-color", c[0]);
        b.setAttribute("aria-pressed", String(tool.color === c[0]));
        b.onclick = function () {
          tool.color = c[0];
          Array.prototype.forEach.call(rail.querySelectorAll(".swatch"), function (x) {
            x.setAttribute("aria-pressed", String(x.getAttribute("data-color") === c[0]));
          });
        };
        rail.appendChild(b);
      });

    rail.appendChild(el("hr"));
    rail.appendChild(el("div", "cap label", "Size"));
    [[4, 2], [7, 4], [12, 7]].forEach(function (s) {
      var b = el("button", "size-btn");
      b.innerHTML = '<i style="width:20px;height:' + s[1] + 'px"></i>';
      b.setAttribute("data-size", String(s[0]));
      b.setAttribute("aria-pressed", String(tool.size === s[0]));
      b.onclick = function () {
        tool.size = s[0];
        Array.prototype.forEach.call(rail.querySelectorAll(".size-btn"), function (x) {
          x.setAttribute("aria-pressed", String(parseInt(x.getAttribute("data-size"), 10) === s[0]));
        });
      };
      rail.appendChild(b);
    });

    rail.appendChild(el("hr"));
    var finger = el("button", "tool");
    finger.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/>' +
      '<path d="M12 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 11V6.5a1.5 1.5 0 0 1 3 0V13a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2-3.5a1.5 1.5 0 0 1 2.5-1.7L9 14"/></svg>';
    finger.title = "Let a finger draw as well as the Pencil";
    finger.setAttribute("aria-pressed", String(tool.fingerDraws));
    finger.onclick = function () {
      tool.fingerDraws = !tool.fingerDraws;
      finger.setAttribute("aria-pressed", String(tool.fingerDraws));
    };
    rail.appendChild(finger);

    return rail;
  }

  /* ================= backup ================= */

  function stamp() { return todayISO(); }

  document.getElementById("exportBtn").onclick = async function () {
    var json = serialize(state);
    var filename = "practise-organiser-backup-" + stamp() + ".json";
    var downloads = null;
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    if (downloads) {
      try { await downloads.save({ filename: filename, data: json }); chip("Backup saved", false); }
      catch (e) { chip("Backup cancelled", false); }
      return;
    }
    var blob = new Blob([json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  };

  /* Import used to be replace-only, which is a bad thing to hand a coach whose
     season is already in the app. Merging by id means the same file can be
     imported twice without doubling the library. */

  function applyImport(incoming, mode) {
    if (mode === "replace") {
      state = incoming;
      state.drills.forEach(function (d) { dirty[d.id] = "drills"; });
      state.practices.forEach(function (p) { dirty[p.id] = "practices"; });
      if (Store.kind === "idb") {
        Promise.all([DB.clear("drills"), DB.clear("practices")]).then(flush);
      } else flush();
    } else {
      incoming.drills.forEach(function (d) {
        var at = -1;
        for (var i = 0; i < state.drills.length; i++) if (state.drills[i].id === d.id) at = i;
        if (at >= 0) state.drills[at] = d; else state.drills.push(d);
        dirty[d.id] = "drills";
      });
      incoming.practices.forEach(function (p) {
        var at = -1;
        for (var i = 0; i < state.practices.length; i++) if (state.practices[i].id === p.id) at = i;
        if (at >= 0) state.practices[at] = p; else state.practices.push(p);
        dirty[p.id] = "practices";
      });
      state.drills.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
      state.practices.sort(byDateDesc);
      flush();
    }
    render();
    chip("Imported", false);
  }

  function askImportMode(incoming, then) {
    var fresh = incoming.drills.filter(function (d) { return !findDrill(d.id); }).length;
    var again = incoming.drills.length - fresh;

    var back = el("div", "modal-back");
    var panel = el("div", "modal choice");

    var head = el("div", "modal-head");
    head.appendChild(el("div", "mtitle", "Import"));
    panel.appendChild(head);

    var lines = [];
    lines.push("<b>" + incoming.drills.length + "</b> drill" +
               (incoming.drills.length === 1 ? "" : "s") +
               (incoming.practices.length ? " and <b>" + incoming.practices.length +
                "</b> practice" + (incoming.practices.length === 1 ? "" : "s") : "") +
               " in this file.");
    if (again) {
      lines.push("<b>" + again + "</b> of them " + (again === 1 ? "is" : "are") +
                 " already here and would be updated to the version in the file.");
    }
    lines.push("This app currently holds <b>" + state.drills.length + "</b> drill" +
               (state.drills.length === 1 ? "" : "s") + " and <b>" +
               state.practices.length + "</b> practice" +
               (state.practices.length === 1 ? "" : "s") + ".");
    var body = el("div", "choice-body");
    body.innerHTML = lines.join("<br>");
    panel.appendChild(body);

    function close() { back.remove(); }

    var opts = el("div", "choice-opts");

    var merge = el("button", "choice-btn");
    merge.innerHTML = "<b>Add to what is here</b>" +
      "<span>Keeps everything already in the app. Nothing is lost.</span>";
    merge.onclick = function () { close(); then(incoming, "merge"); };
    opts.appendChild(merge);

    var replace = el("button", "choice-btn danger-choice");
    replace.innerHTML = "<b>Replace everything</b>" +
      "<span>Deletes what is in the app now and leaves only this file.</span>";
    replace.onclick = function () {
      if (!confirm("Delete the " + state.drills.length + " drill" +
                   (state.drills.length === 1 ? "" : "s") + " and " +
                   state.practices.length + " practice" +
                   (state.practices.length === 1 ? "" : "s") +
                   " in the app now? This cannot be undone.")) return;
      close(); then(incoming, "replace");
    };
    opts.appendChild(replace);

    var cancel = el("button", "choice-btn");
    cancel.innerHTML = "<b>Cancel</b><span>Change nothing.</span>";
    cancel.onclick = close;
    opts.appendChild(cancel);

    panel.appendChild(opts);
    back.onclick = function (e) { if (e.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  var fileInput = document.getElementById("importFile");
  document.getElementById("importBtn").onclick = function () { fileInput.click(); };
  fileInput.onchange = function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = deserialize(String(reader.result));
        if (!incoming) throw new Error("shape");
        askImportMode(incoming, applyImport);
      } catch (e) {
        alert("That file is not a Practise Organiser backup.");
      }
      fileInput.value = "";
    };
    reader.readAsText(f);
  };

  /* ================= boot ================= */

  chip("Opening…");
  loadUI();
  applyTheme();
  if (themeBtn) {
    themeBtn.textContent = ui.theme === "dark" ? "\u2600" : "\u263D";
    themeBtn.onclick = toggleTheme;
  }
  initStore().then(function () {
    chip("");
    render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    if (!PREVIEW && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  });
})();
</script>
