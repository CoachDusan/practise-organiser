<title>Practise Organiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    /* ---- PAPER AND COURT (the default) ----
       Dusan's call: the base is the same warm cream as the court, so the app and
       the thing he draws on are the same material and a diagram stops looking
       like a window cut into a different app. Orange stays the accent; light
       blue is the second colour.

       Every value here was measured, not chosen by eye. Picking tints by eye had
       already shipped two invisible ones. Rules used: small text 4.5:1, large
       text and borders 3:1, and a visible step between stacked surfaces. */
    --ground:     #E7DFCD;   /* the desk */
    --panel:      #F8F4EA;   /* paper - cards sit on the desk */
    --panel-hi:   #FFFDF6;   /* raised */
    --line:       #D5CBB4;
    --line-hi:    #B5A78B;   /* hover */
    --text:       #221F19;
    --dim:        #6B6252;
    --faint:      #8C816B;   /* placeholders, empty days */

    /* Three oranges, because one cannot do all three jobs on a light ground:
       a vivid orange is unreadable as small text, and a text-dark orange is
       muddy as a fill. --accent-fill keeps the app's identity colour. */
    --accent:      #C2700A;  /* borders and large text - 3.4:1 */
    --accent-text: #8F5104;  /* small text - 5.7:1 */
    --accent-fill: #F2A413;  /* filled chips */
    --accent-ink:  #221F19;  /* on the fill - 7.9:1 */

    --blue:       #1F6392;

    /* The iPad draws its clock in WHITE over this app (the status bar is
       black-translucent, which is what makes it look full-screen). A cream top
       bar would hide the clock completely, so the bar is deep blue - which is
       also where the second colour belongs. White clock on it: 11.2:1. */
    --topbar-bg:   #1D3E57;
    --topbar-text: #F3EFE5;
    --topbar-dim:  #A9BECD;
    --topbar-line: #2E5876;
    --topbar-chip: #27506E;
    --court-shadow: 0 2px 10px rgba(74,58,32,.16), 0 0 0 1px rgba(74,58,32,.16);

    --court:      #EDE6D8;
    --court-line: #3A342A;
    --rim:        #C0552A;

    --pill-bg:    #EBE4D4;
    --pill-line:  #D5CBB4;
    --pill-text:  #6B6252;

    --good:       #2E7D4F;
    --good-bg:    #DDEEE2;
    --good-line:  #A9CDB6;

    --danger:      #B3372B;
    --danger-line: #E0B0A8;
    --danger-soft: #8C3A30;
    --danger-ink:  #8C3A30;

    --warn-bg:     #FCE9DF;
    --warn-line:   #E0B49E;
    --warn-text:   #6B3A22;
    --warn-strong: #4A2415;

    /* Schedule kinds. Colour says which; size and fill say how much it counts. */
    /* Every kind carries its own colour, not just games - Dusan's call. The
       colour is the card's tint and its edge; the TIER decides how loud that
       colour is allowed to be (bar thickness, type size, and which of the two
       tints). Tints are the hue mixed into the panel, so they are the same
       colour rather than eight unrelated pastels.

       Only the loud tier colours its title. A 14.5px title in the kind colour
       could not hold 4.5:1 against its own tint for half of these, so on the
       smaller tiers the tint and the bar carry the colour and the text stays
       black. Measured; worst pair separation dE 22.5. */
    --k-practice: #B5620A; --k-practice-bg: #F1E5D4;
    --k-done: #2E7D4F; --k-done-bg: #E4E8DA;
    --k-game: #B33F22; --k-game-bg: #F1E2D6; --k-game-loud: #E7C9BA;
    --k-tournament: #7B4A9E; --k-tournament-bg: #ECE3E2; --k-tournament-loud: #DACBD8;
    --k-travel: #2166A8; --k-travel-bg: #E3E6E3;
    --k-off: #8A8272; --k-off-bg: #FFFFFF;   /* a clear day is white paper */
    --k-gym: #7A6420; --k-gym-bg: #EBE6D6;
    --k-note: #5A6472; --k-note-bg: #E8E6DE;
    --chip-sub: #6B6252;

    --pos-g: #1D5A80; --pos-g-bg: #DCEAF3; --pos-g-line: #A9CEE4;
    --pos-f: #2C5E2A; --pos-f-bg: #DFEEDA; --pos-f-line: #AFD3A6;
    --pos-c: #5E3576; --pos-c-bg: #EDE0F5; --pos-c-line: #CDAFDF;

    --chart-1: #2F6FBF; --chart-2: #BE4A1E; --chart-3: #15805C; --chart-4: #9C6A00;
    --rail: 64px;
    /* The app is installed with a translucent status bar, so iPadOS draws the
       clock and battery OVER the page. These are the strips the system owns;
       they are 0 in a browser tab. */
    --safe-top:   env(safe-area-inset-top, 0px);
    --safe-left:  env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --bar: 49px;                                  /* the top bar's own height */
    --bar-total: calc(var(--bar) + var(--safe-top));
  }
  /* ---- the original dark theme, kept and switchable ----
     A gym at 21:00 and a gym at 10:00 are different rooms. Rather than decide
     that from a description, both are here and the toggle is in the top bar;
     the choice is remembered on this iPad. Same token names throughout, so a
     screen built once works in both. */
  [data-theme="dark"] {
    --ground:     #1B1A17;
    --panel:      #24221D;
    --panel-hi:   #2E2B24;
    --line:       #3B372F;
    --line-hi:    #4C463C;
    --text:       #E9E4D8;
    --dim:        #948C7C;
    --faint:      #4E483E;

    --accent:      #F2A413;
    --accent-text: #F2A413;
    --accent-fill: #F2A413;
    --accent-ink:  #1B1A17;

    --blue:       #6FA8C7;

    --topbar-bg:   #24221D;
    --topbar-text: #E9E4D8;
    --topbar-dim:  #948C7C;
    --topbar-line: #3B372F;
    --topbar-chip: #2E2B24;
    --court-shadow: 0 8px 26px rgba(0,0,0,.38), 0 0 0 1px rgba(0,0,0,.35);

    --court:      #EDE6D8;
    --court-line: #3A342A;
    --rim:        #C0552A;

    --pill-bg:    #332F27;
    --pill-line:  #433D33;
    --pill-text:  #A49B8A;

    --good:       #9CC47F;
    --good-bg:    #2A3326;
    --good-line:  #3E4C36;

    --danger:      #C8574B;
    --danger-line: #4A342F;
    --danger-soft: #C08A80;
    --danger-ink:  #E0A79E;

    --warn-bg:     #33231E;
    --warn-line:   #593B33;
    --warn-text:   #E8C9BF;
    --warn-strong: #FFFFFF;

    /* Same system. `note` moved off blue-grey (#9AA7B5) because it sat dE 15.7
       from travel; and the sub line uses --chip-sub rather than --dim, which
       could not reach 4.5:1 on any tinted card here. */
    --k-practice: #F2A413; --k-practice-bg: #3D321C;
    --k-done: #9CC47F; --k-done-bg: #323529;
    --k-game: #DC6D4B; --k-game-bg: #3A2B23; --k-game-loud: #543629;
    --k-tournament: #C08BD8; --k-tournament-bg: #372F33; --k-tournament-loud: #4D3D4E;
    --k-travel: #6FA8C7; --k-travel-bg: #2D3231;
    --k-off: #FFFFFF; --k-off-bg: #43413D;   /* a clear day is white */
    --k-gym: #C9A45E; --k-gym-bg: #383225;
    --k-note: #B0A492; --k-note-bg: #35322B;
    --chip-sub: #C4BCAB;

    --pos-g: #8FC4E0; --pos-g-bg: #1F2C33; --pos-g-line: #334B59;
    --pos-f: #B0D694; --pos-f-bg: #212C1E; --pos-f-line: #384C31;
    --pos-c: #D0A5E4; --pos-c-bg: #2B2431; --pos-c-line: #443850;

    --chart-1: #3987e5; --chart-2: #d95926; --chart-3: #199e70; --chart-4: #c98500;
  }

  /* Belt and braces. env() is the right answer and adapts to the device, but
     if it ever reports 0 while installed, the clock lands on the menu again —
     so when running off the Home Screen there is a floor under it. In a normal
     browser tab the browser's own chrome is already above us and this does
     nothing. */
  @media (display-mode: standalone) {
    :root { --safe-top: max(env(safe-area-inset-top, 0px), 22px); }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    /* iPadOS reads a Pencil drag as a text-selection gesture, so circling a play
       on a court was painting the card blue. Switching selection off for the
       *editor* only was not enough, and made it worse in a way worth remembering:
       the gesture still fires, so the selection simply landed on the nearest
       selectable text instead — which was Import, up in the top bar. Turning it
       off for a region only moves where the highlight appears. It has to be the
       whole page, with selection handed back to the boxes that are for text. */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  .label {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase; letter-spacing: .09em; font-weight: 600;
  }

  /* ---------- chrome ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; row-gap: 8px;
    padding: calc(10px + var(--safe-top)) calc(16px + var(--safe-right))
             10px calc(16px + var(--safe-left));
    background: var(--topbar-bg);
    color: var(--topbar-text);
    border-bottom: 1px solid var(--topbar-line);
  }
  /* The bar carries its own colours so it works over a cream body as well as a
     dark one; everything inside it inherits from the bar, not from the page. */
  .topbar .chip {
    background: var(--topbar-chip); border-color: var(--topbar-line);
    color: var(--topbar-text);
  }
  .topbar .chip.ghost { background: transparent; }
  .topbar .chip:hover { border-color: var(--topbar-dim); }
  .topbar .chip[aria-pressed="true"] {
    background: var(--accent-fill); border-color: var(--accent-fill);
    color: var(--accent-ink);
  }
  .topbar .savechip { color: var(--topbar-dim); }
  .topbar .label { color: var(--topbar-dim); }

  .wordmark {
    font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .12em;
    font-weight: 700; font-size: 18px; line-height: 1; white-space: nowrap;
  }
  .wordmark span { color: var(--accent-text); }
  .spacer { margin-left: auto; }

  button, input, select, textarea {
    font: inherit; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  button {
    background: var(--panel-hi); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; touch-action: manipulation;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .chip {
    padding: 8px 13px; font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
    font-size: 14px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
  .chip.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
  .chip.ghost { background: transparent; }
  .chip.danger { color: var(--danger); border-color: var(--danger-line); background: transparent; }

  input, textarea { -webkit-user-select: text; user-select: text; }

  input[type="text"], input[type="number"], input[type="date"], input[type="time"],
  textarea, select {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.5; }

  /* align-content:start matters: without it a field that carries a hint line
     makes every other box in the row stretch to match, which is what made the
     date of birth look like a different control from the ones beside it. */
  .field { display: grid; gap: 5px; min-width: 0; align-content: start; }
  /* iOS gives input[type=date] its own intrinsic height from the native control,
     so a date box came out a different size from the typed From/To boxes beside
     it. align-content:start stops rows stretching; this pins the boxes themselves
     to one height so every control in a row is the same size on the device.
     Content box is 40 - 18 padding - 2 border = 20px, which is the line-height. */
  .field > input, .field > select { height: 40px; line-height: 20px; }
  .field > .label { font-size: 10px; color: var(--dim); }

  /* ---------- library ---------- */
  .wrap {
    max-width: 1180px; margin: 0 auto;
    padding: 20px calc(16px + var(--safe-right)) 80px calc(16px + var(--safe-left));
  }

  .lib-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .lib-head h1 { font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
                 letter-spacing: .06em; font-size: 30px; margin: 0; font-weight: 700; }
  .count { color: var(--dim); font-size: 13px; }

  .filters { display: flex; gap: 7px; flex-wrap: wrap; margin: 16px 0 20px; }
  .filters button { padding: 6px 11px; font-size: 13px; border-radius: 99px; background: transparent; }
  .filters button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 0; overflow: hidden; text-align: left; display: grid;
    grid-template-rows: auto 1fr; min-height: 168px;
  }
  .card:hover { border-color: var(--line-hi); }
  .card .thumb {
    background: var(--court); height: 92px; position: relative; overflow: hidden;
    display: grid; place-items: center;
  }
  .card .thumb svg { width: 100%; height: 100%; display: block; }
  .card .meta { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
  .card .name {
    font-family: "Barlow Condensed", sans-serif; font-size: 21px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; line-height: 1.05;
  }
  .card .sub { font-size: 11.5px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 99px;
    background: var(--pill-bg); color: var(--accent-text); border: 1px solid var(--pill-line);
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .07em;
  }

  .card.new { border-style: dashed; place-items: center; display: grid; grid-template-rows: 1fr;
               color: var(--dim); background: transparent; }
  .card.new:hover { color: var(--accent); border-color: var(--accent); }
  .card.new .plus { font-size: 30px; line-height: 1; }

  .empty { color: var(--dim); text-align: center; padding: 60px 20px; line-height: 1.6; }

  /* ---------- editor ---------- */
  .editor { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100dvh; }
  .rail {
    position: sticky; top: var(--bar-total); align-self: start;
    height: calc(100dvh - var(--bar-total));
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 0; overflow-y: auto; z-index: 20;
  }
  .rail .cap { font-size: 9px; color: var(--dim); margin: 6px 0 1px; }
  .rail hr { width: 30px; border: 0; border-top: 1px solid var(--line); margin: 7px 0; }
  .tool { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px;
          background: transparent; border: 1px solid transparent; }
  .tool svg { width: 23px; height: 23px; stroke: var(--text); fill: none;
              stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tool[aria-pressed="true"] { background: var(--panel-hi); border-color: var(--accent); }
  .tool[aria-pressed="true"] svg { stroke: var(--accent); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; padding: 0;
            box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); }
  .swatch[aria-pressed="true"] { border-color: var(--accent); transform: scale(1.09); }
  .size-btn { width: 38px; height: 28px; display: grid; place-items: center; border-radius: 8px;
              background: transparent; border: 1px solid transparent; }
  .size-btn i { display: block; background: var(--text); border-radius: 99px; }
  .size-btn[aria-pressed="true"] { background: var(--panel-hi); border-color: var(--accent); }
  .size-btn[aria-pressed="true"] i { background: var(--accent); }

  .sheet { padding: 18px 20px 100px; max-width: 1100px; }

  .name-input {
    font-family: "Barlow Condensed", sans-serif; font-size: 32px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    background: transparent; border: 0; border-bottom: 2px solid var(--line);
    border-radius: 0; padding: 4px 2px; width: 100%;
  }
  .name-input:focus { border-bottom-color: var(--accent); outline: none; }
  .name-input::placeholder { color: var(--faint); }

  .sheet-foot { margin-top: 26px; display: flex; gap: 8px; flex-wrap: wrap; }

  .metarow {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin: 18px 0 8px;
  }

  .int-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .int-read {
    font-family: "Barlow Condensed", sans-serif; font-size: 13px; letter-spacing: .05em;
    color: var(--accent-text); text-transform: uppercase;
  }
  .pips { display: flex; gap: 5px; flex-wrap: wrap; }
  .pips button {
    width: 34px; height: 34px; border-radius: 8px; background: transparent;
    font-variant-numeric: tabular-nums; font-size: 13px;
  }
  .pips button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }

  .diagrams { display: grid; gap: 18px; margin-top: 22px; }

  .diagram { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .diagram-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .diagram-head .num {
    font-family: "Barlow Condensed", sans-serif; font-size: 12px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--accent-text); white-space: nowrap;
  }
  .diagram-head input[type="text"] { flex: 1 1 180px; min-width: 120px; background: var(--ground); }
  .diagram-head .grp { display: flex; gap: 5px; margin-left: auto; }
  .diagram-head .grp button { padding: 6px 10px; font-size: 12px; }

  .court-wrap {
    position: relative; background: var(--court); border-radius: 5px; margin: 0 auto;
    box-shadow: var(--court-shadow);
    max-width: 100%;
  }
  .court-wrap svg, .court-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .court-wrap svg  { pointer-events: none; }
  /* touch-action:none guarantees the Pencil draws instead of scrolling the page.
     Finger scrolling over a court is then handled by hand, in the pad below. */
  .court-wrap canvas { touch-action: none; }
  .court-wrap .ink-base { pointer-events: none; }

  .court-line { stroke: var(--court-line); fill: none; stroke-width: 4; }
  .court-line.thick { stroke-width: 7; }
  .court-line.dash { stroke-dasharray: 26 20; }
  .rim { stroke: var(--rim); stroke-width: 6; fill: none; }

  .add-court, .add-row { width: 100%; padding: 15px; border-style: dashed; background: transparent; color: var(--dim); }
  .add-court:hover, .add-row:hover { color: var(--accent); border-color: var(--accent); }

  .themebtn { font-size: 15px; line-height: 1; padding: 7px 10px; }
  /* Which build is on screen. Three characters, but it ends an argument: for
     several rounds neither of us could tell whether a reload had actually
     picked up a change or was serving a stale cached shell. */
  .buildtag { font-size: 10px; color: var(--topbar-dim); letter-spacing: .06em; }

  .savechip { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  .savechip.on { color: var(--accent-text); }

  .warn {
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text);
    border-radius: 10px; padding: 11px 14px; font-size: 13px; line-height: 1.5;
    margin: 0 0 18px;
  }
  .warn b { color: var(--warn-strong); }

  /* ---------- practices ---------- */
  .tabs { display: flex; gap: 6px; }
  .tabs .chip { padding: 6px 12px; font-size: 13px; }

  .narrow { max-width: 780px; }

  .month {
    font-size: 11px; color: var(--dim); margin: 22px 0 8px;
  }
  .month:first-of-type { margin-top: 14px; }

  .prow {
    width: 100%; display: grid; grid-template-columns: 190px 1fr; gap: 16px;
    align-items: start; text-align: left; padding: 13px 15px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .prow:hover { border-color: var(--line-hi); }
  .pwhen { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .pdate {
    font-family: "Barlow Condensed", sans-serif; font-size: 19px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; line-height: 1.1;
  }
  .pbadge {
    display: inline-block; font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .09em; font-size: 10px;
    padding: 3px 8px; border-radius: 99px;
    background: var(--pill-bg); color: var(--dim); border: 1px solid var(--pill-line);
  }
  .pbadge.done { background: var(--good-bg); color: var(--good); border-color: var(--good-line); }
  .pwhat { display: grid; gap: 5px; min-width: 0; }
  .psub { font-size: 11.5px; color: var(--dim); }
  .pnames { font-size: 13.5px; line-height: 1.5; }
  .pnames.dim { color: var(--dim); font-style: italic; }
  .pnote {
    font-size: 12.5px; color: var(--dim); line-height: 1.5;
    border-left: 2px solid var(--line); padding-left: 9px; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .prac-head {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 16px; align-items: start; margin: 6px 0 22px;
  }
  .ptotal {
    font-family: "Barlow Condensed", sans-serif; font-size: 24px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.2;
  }

  .items { display: grid; gap: 7px; margin-bottom: 14px; }
  .item {
    display: grid; grid-template-columns: 26px 1fr 66px 28px auto;
    gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px;
  }
  .inum {
    font-family: "Barlow Condensed", sans-serif; font-size: 15px; color: var(--accent-text);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .ibody { min-width: 0; display: grid; gap: 3px; }
  .iname {
    font-family: "Barlow Condensed", sans-serif; font-size: 19px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; line-height: 1.15;
  }
  .isub { font-size: 11px; color: var(--dim); }
  .isub.gone { color: var(--danger-soft); }
  .imin { text-align: right; padding: 7px 8px; font-variant-numeric: tabular-nums; }
  .imunit { font-size: 11px; color: var(--dim); }
  .imoves { display: flex; gap: 4px; }
  .mini {
    width: 38px; height: 38px; border-radius: 8px; background: transparent;
    display: grid; place-items: center; font-size: 15px; line-height: 1; color: var(--dim);
  }
  .mini:hover:not(:disabled) { color: var(--text); border-color: var(--line-hi); }
  .mini:disabled { opacity: .3; cursor: default; }
  .mini.rm:hover { color: var(--danger); border-color: var(--danger-line); }

  .prac-foot { margin-top: 28px; display: grid; gap: 14px; }
  .foot-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 11px 14px; font-size: 13px; line-height: 1.55; color: var(--dim);
  }
  .hint b { color: var(--text); }

  /* ---------- typed fields ---------- */
  .field-note { font-size: 11px; color: var(--dim); line-height: 1.35; min-height: 14px; }
  input.bad { border-color: var(--danger); }
  input.bad + .field-note { color: var(--danger-soft); }

  /* ---------- what an assessment is ---------- */
  .help-areas { display: grid; gap: 10px; margin-bottom: 14px; }
  .help-area { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: baseline; }
  .help-lab {
    display: flex; align-items: center; gap: 6px;
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .05em; font-size: 14px; font-weight: 600;
  }
  .help-what { font-size: 13px; color: var(--dim); line-height: 1.5; }
  .help-note {
    font-size: 12.5px; color: var(--dim); line-height: 1.6;
    padding-top: 10px; border-top: 1px solid var(--line); margin-top: 10px;
  }
  .help-note b { color: var(--text); }

  @media (max-width: 620px) {
    .help-area { grid-template-columns: 1fr; gap: 3px; }
  }

  /* ---------- categories that open ---------- */
  .sect-tools { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; }
  .sect-tools .chip { padding: 6px 12px; font-size: 13px; }

  .sect {
    border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 8px; background: var(--panel); overflow: hidden;
  }
  .sect.on { background: transparent; border-color: var(--line-hi); }
  .sect-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: transparent; border: 0; border-radius: 0;
    text-align: left;
  }
  .sect-head:hover .sect-title { color: var(--accent); }
  .sect-caret { color: var(--dim); font-size: 11px; width: 12px; flex: none; }
  .sect-title {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .05em; font-size: 19px; font-weight: 700; line-height: 1.1;
  }
  .sect-count { font-size: 11.5px; color: var(--dim); margin-left: auto; white-space: nowrap; }
  .sect-body { padding: 2px 14px 16px; }

  /* ---------- tactics ---------- */
  .cat-head {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .07em; font-size: 12px; color: var(--accent-text);
    margin: 14px 0 7px;
  }
  .prow.tactic { grid-template-columns: 108px 1fr; }
  .tthumb {
    background: var(--court); height: 66px; width: 100%; border-radius: 6px; overflow: hidden;
  }
  .tthumb svg { width: 100%; height: 100%; display: block; }

  .option {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-top: 20px;
  }
  .option-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .option-head .num {
    font-family: "Barlow Condensed", sans-serif; font-size: 12px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--accent-text); white-space: nowrap;
  }
  .option-head input[type="text"] {
    flex: 1 1 200px; min-width: 140px; background: var(--ground);
    font-family: "Barlow Condensed", sans-serif; font-size: 20px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .option .diagrams { margin-top: 16px; }
  .option .diagram { background: var(--ground); }

  /* ---------- roster ---------- */
  .prow.player { grid-template-columns: 62px 1fr; }

  /* The name is what he looks for, so it is clearly the biggest thing in the
     row; the details drop back rather than sitting at the same weight. */
  .pname-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pname-row .pdate {
    font-size: 25px; letter-spacing: .03em; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .posbadge {
    margin-left: auto; flex: none;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700;
    font-size: 15px; letter-spacing: .09em; text-transform: uppercase;
    padding: 2px 10px; border-radius: 6px;
    background: var(--pill-bg); color: var(--pill-text); border: 1px solid var(--pill-line);
  }
  .posbadge.pg { background: var(--pos-g-bg); color: var(--pos-g); border-color: var(--pos-g-line); }
  .posbadge.pf { background: var(--pos-f-bg); color: var(--pos-f); border-color: var(--pos-f-line); }
  .posbadge.pc { background: var(--pos-c-bg); color: var(--pos-c); border-color: var(--pos-c-line); }
  .prow.player .psub { font-size: 12px; }
  .prow.inactive { opacity: .55; }
  .shirt {
    font-family: "Barlow Condensed", sans-serif; font-size: 26px; font-weight: 700;
    line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent);
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--line); display: grid; place-items: center;
  }
  .shirt.small { width: 34px; height: 34px; font-size: 16px; border-width: 1px; }

  .mini-areas { display: flex; gap: 12px; flex-wrap: wrap; margin: 3px 0 1px; }
  .ma { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--dim); }
  .ma-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .ma-label { color: var(--dim); }
  .ma-val { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }

  .att-summary {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 18px 0 4px;
  }
  .att-big {
    font-family: "Barlow Condensed", sans-serif; font-size: 30px; font-weight: 700;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .att-detail { font-size: 12.5px; color: var(--dim); line-height: 1.5; }

  .assess { margin-top: 26px; }
  .assess-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .assess-head .chip { padding: 6px 12px; font-size: 13px; }

  .arow {
    display: grid; grid-template-columns: 138px 1fr 150px 38px; gap: 10px;
    align-items: center; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; margin-bottom: 7px;
  }
  .adate { padding: 7px 9px; }
  .agrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .afield { display: grid; gap: 3px; min-width: 0; }
  .alab {
    display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--dim);
    white-space: nowrap; overflow: hidden;
  }
  .afield input { text-align: center; padding: 6px 4px; font-variant-numeric: tabular-nums; }
  .anote { padding: 7px 9px; font-size: 13px; }

  /* ---------- chart ---------- */
  .chart-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px 10px; margin-bottom: 14px;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--dim); }
  .chart-holder { width: 100%; overflow-x: auto; }
  .chart { width: 100%; height: auto; display: block; min-width: 380px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .ax { fill: var(--dim); font-size: 11px; font-family: "IBM Plex Sans", sans-serif; }
  .chart .ser {
    fill: var(--text); font-size: 11.5px; font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .chart-cap { font-size: 11.5px; color: var(--dim); line-height: 1.5; margin-top: 8px; }

  .bars {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 14px; display: grid; gap: 10px;
  }
  .bar-row { display: grid; grid-template-columns: 128px 1fr 78px; gap: 10px; align-items: center; }
  .bar-lab { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .bar-track { height: 10px; background: var(--ground); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .bar-val { font-size: 11.5px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- attendance on a practice ---------- */
  .attend { margin-top: 26px; }
  .att-row {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 11px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; margin-bottom: 6px;
  }
  .att-name {
    font-family: "Barlow Condensed", sans-serif; font-size: 17px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  @media (max-width: 720px) {
    .arow { grid-template-columns: 1fr 38px; row-gap: 8px; }
    .arow .agrid { grid-column: 1 / -1; }
    .arow .anote { grid-column: 1 / -1; }
    .att-row { grid-template-columns: 30px 1fr; row-gap: 7px; }
    .att-row .pips { grid-column: 1 / -1; }
    .bar-row { grid-template-columns: 108px 1fr 62px; }
  }

  /* ---------- schedule ---------- */
  .cal-nav { display: flex; align-items: center; gap: 8px; margin: 16px 0 14px; flex-wrap: wrap; }
  .cal-nav .chip { padding: 7px 13px; }
  .cal-title {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .06em; font-size: 19px; font-weight: 700; min-width: 210px;
  }

  .week { display: grid; gap: 7px; }
  .day {
    display: grid; grid-template-columns: 62px 1fr 42px; gap: 12px; align-items: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px;
  }
  .day.today { border-color: var(--accent); }
  .dwhen { display: grid; gap: 1px; justify-items: center; padding-top: 2px; }
  .dday { font-size: 10px; color: var(--dim); }
  .day.today .dday { color: var(--accent-text); }
  .dnum {
    font-family: "Barlow Condensed", sans-serif; font-size: 24px; font-weight: 700;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .dbody { display: grid; gap: 6px; min-width: 0; }
  .dempty { color: var(--faint); font-size: 13px; padding: 5px 0; }
  .dadd {
    width: 38px; height: 38px; border-radius: 10px; background: transparent;
    color: var(--dim); font-size: 19px; line-height: 1; display: grid; place-items: center;
  }
  .dadd:hover { color: var(--accent); border-color: var(--accent); }

  /* One chip per thing on a day. The left edge carries the colour, so a week
     can be read at a glance without a legend. */
  .chip-item {
    display: grid; gap: 2px; text-align: left; padding: 7px 10px;
    background: var(--panel-hi); border: 1px solid var(--line);
    border-left: 3px solid var(--dim); border-radius: 8px; width: 100%;
  }
  .chip-item:hover { border-color: var(--line-hi); }
  .ci-title {
    font-family: "Barlow Condensed", sans-serif; font-size: 16px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; line-height: 1.15;
  }
  .ci-sub { font-size: 11.5px; color: var(--dim); line-height: 1.4; }

  /* ---- the three weights ----
     Every kind carries its own colour (see the kind rules below); these decide
     how LOUD that colour is allowed to be. Two independent axes: colour says
     which, weight says how much it counts. */

  /* A game should be findable without reading: 27px, a 9px bar of its own
     colour down the full edge, the title in that colour, and the stronger of
     its two tints. */
  .chip-item.loud {
    padding: 14px 16px; border-left-width: 9px;
  }
  .chip-item.loud .ci-title {
    font-size: 27px; letter-spacing: .045em; line-height: 1.05;
  }
  .chip-item.loud .ci-sub { font-size: 13px; color: var(--chip-sub); }
  .chip-item.game.loud .ci-title       { color: var(--k-game); }
  .chip-item.tournament.loud .ci-title { color: var(--k-tournament); }
  .chip-item .ci-sub { color: var(--chip-sub); }

  /* The practice keeps the baseline look: it is the normal working substance. */
  .chip-item.mid .ci-title { font-size: 17px; }

  /* Context rather than an event - but it keeps its card, its colour and
     full-strength text. What marks it as quiet is that it is not shouting:
     normal weight, sentence case, a thin bar. The first version dropped the
     card and dimmed the text, and Dusan reported it had disappeared. */
  .chip-item.quiet { border-left-width: 3px; padding: 6px 10px; }
  .chip-item.quiet .ci-title {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 14.5px; font-weight: 700; text-transform: none;
    letter-spacing: 0; color: var(--text);
  }
  .chip-item.quiet .ci-sub { font-size: 11px; }
  .chip-item.quiet:hover { border-color: var(--line-hi); }

  /* Every kind is tinted, in both views. These come after the tier rules on
     purpose: the tier sets size and bar thickness, the kind sets the colour. */
  .chip-item.practice      { border-left-color: var(--k-practice);   background: var(--k-practice-bg); }
  .chip-item.practice.done { border-left-color: var(--k-done);       background: var(--k-done-bg); }
  .chip-item.game          { border-left-color: var(--k-game);       background: var(--k-game-bg); }
  .chip-item.tournament    { border-left-color: var(--k-tournament); background: var(--k-tournament-bg); }
  .chip-item.travel        { border-left-color: var(--k-travel);     background: var(--k-travel-bg); }
  .chip-item.off           { border-left-color: var(--k-off);        background: var(--k-off-bg); }
  .chip-item.gym           { border-left-color: var(--k-gym);        background: var(--k-gym-bg); }
  .chip-item.note          { border-left-color: var(--k-note);       background: var(--k-note-bg); }

  /* the loud tier gets the stronger tint of its own colour */
  .chip-item.loud.game       { background: var(--k-game-loud); }
  .chip-item.loud.tournament { background: var(--k-tournament-loud); }

  .month-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;
  }
  .mg-head { font-size: 10px; color: var(--dim); text-align: center; padding-bottom: 2px; }
  .mg-cell {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    min-height: 92px; padding: 5px; display: grid; gap: 3px; align-content: start;
    cursor: pointer; overflow: hidden;
  }
  .mg-cell:hover { border-color: var(--line-hi); }
  .mg-cell.outside { opacity: .38; }
  .mg-cell.today { border-color: var(--accent); }
  .mg-num {
    font-family: "Barlow Condensed", sans-serif; font-size: 13px; color: var(--dim);
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .mg-cell.today .mg-num { color: var(--accent-text); }
  .mg-item {
    font-size: 10px; line-height: 1.25; padding: 2px 4px; border-radius: 4px;
    font-weight: 600;
    background: var(--panel-hi); border-left: 2px solid var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* The same three weights, scaled to a month cell. A game has to be findable
     when a whole month is on screen at once. */
  .mg-item.loud {
    font-size: 11px; font-weight: 700; color: var(--text);
    border-left-width: 4px; padding: 3px 5px; text-transform: uppercase;
    letter-spacing: .02em;
  }
  .mg-item.quiet { color: var(--text); font-size: 10px;
                   border-left-width: 2px; padding: 2px 4px; }

  .mg-item.practice      { border-left-color: var(--k-practice);   background: var(--k-practice-bg); }
  .mg-item.practice.done { border-left-color: var(--k-done);       background: var(--k-done-bg); }
  .mg-item.game          { border-left-color: var(--k-game);       background: var(--k-game-bg); }
  .mg-item.tournament    { border-left-color: var(--k-tournament); background: var(--k-tournament-bg); }
  .mg-item.travel        { border-left-color: var(--k-travel);     background: var(--k-travel-bg); }
  .mg-item.off           { border-left-color: var(--k-off);        background: var(--k-off-bg); }
  .mg-item.gym           { border-left-color: var(--k-gym);        background: var(--k-gym-bg); }
  .mg-item.note          { border-left-color: var(--k-note);       background: var(--k-note-bg); }

  .mg-item.loud.game       { background: var(--k-game-loud); }
  .mg-item.loud.tournament { background: var(--k-tournament-loud); }

  .ev-form { display: grid; gap: 14px; }
  .ev-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  @media (max-width: 620px) {
    .day { grid-template-columns: 52px 1fr 38px; gap: 8px; }
    .month-grid { gap: 3px; }
    .mg-cell { min-height: 62px; padding: 3px; }
    .mg-item { font-size: 9px; }
    .cal-title { min-width: 0; font-size: 17px; }
  }

  /* ---------- drill picker ---------- */
  .modal-back {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,9,7,.72);
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
  }
  .modal {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 720px;
    max-height: 88dvh; overflow-y: auto; padding: 14px 16px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .modal-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: -14px; background: var(--ground);
    padding: 6px 0 12px; margin: -6px 0 0; z-index: 2;
  }
  .mtitle {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .06em; font-size: 22px; font-weight: 700;
  }
  .msearch { margin-bottom: 12px; }
  .mrows { display: grid; gap: 7px; }
  .mrow {
    display: grid; grid-template-columns: 78px 1fr 34px; gap: 12px; align-items: center;
    text-align: left; padding: 8px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .mrow:hover { border-color: var(--accent); }
  .mthumb {
    background: var(--court); height: 46px; border-radius: 5px; overflow: hidden;
  }
  .mthumb svg { width: 100%; height: 100%; display: block; }
  .mbody { min-width: 0; display: grid; gap: 3px; }
  .mname {
    font-family: "Barlow Condensed", sans-serif; font-size: 18px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; line-height: 1.15;
  }
  .mplus {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--dim); font-size: 17px; line-height: 1;
  }
  .mplus.on { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }

  .modal.choice { max-width: 520px; border-radius: 16px; align-self: center; }
  .modal-back:has(.choice) { align-items: center; padding: 16px; }
  .choice-body { font-size: 13.5px; line-height: 1.7; color: var(--dim); margin-bottom: 16px; }
  .choice-body b { color: var(--text); }
  .choice-opts { display: grid; gap: 8px; }
  .choice-btn {
    text-align: left; padding: 12px 14px; display: grid; gap: 3px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .choice-btn:hover { border-color: var(--accent); }
  .choice-btn b {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .05em; font-size: 16px; font-weight: 700;
  }

<script>
(function () {
  "use strict";

  /* The page is served inside a <head> we do not author, so the tags that make
     this behave like an installed app are added here. */
  function meta(name, content) {
    var m = document.querySelector('meta[name="' + name + '"]');
    if (!m) { m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
    m.content = content;
  }
  meta("viewport", "width=device-width, initial-scale=1, viewport-fit=cover");
  meta("apple-mobile-web-app-capable", "yes");          // full screen off the Home Screen
  meta("apple-mobile-web-app-status-bar-style", "black-translucent");
  meta("apple-mobile-web-app-title", "Practise");
  meta("theme-color", "#1D3E57");

  function link(rel, href, extra) {
    var l = document.createElement("link");
    l.rel = rel; l.href = href;
    if (extra) for (var k in extra) l.setAttribute(k, extra[k]);

  }
  if (!window.claude) {                                  // only meaningful when properly hosted
    link("manifest", "manifest.webmanifest");
    link("apple-touch-icon", "icon.svg");
    link("icon", "icon.svg", { type: "image/svg+xml" });
