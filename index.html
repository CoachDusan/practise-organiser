  function openEventEditor(e) {
    var back = el("div", "modal-back");
    var panel = el("div", "modal choice");

    var head = el("div", "modal-head");
    head.appendChild(el("div", "mtitle", kindLabel(e.kind)));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);
    var doneBtn = el("button", "chip primary", "Done");
    doneBtn.onclick = close;
    head.appendChild(doneBtn);
    panel.appendChild(head);

    var form = el("div", "ev-form");

    function field(label, node) {
      var f = el("div", "field");
      f.appendChild(el("div", "label", label));
      f.appendChild(node);
      return f;
    }

    function textInput(value, placeholder, set) {
      var i = document.createElement("input");
      i.type = "text"; i.value = value || ""; i.placeholder = placeholder || "";
      i.oninput = function () { set(i.value); touchEvent(e); };
      return i;
    }

    var whenRow = el("div", "ev-row");
    var di = document.createElement("input");
    di.type = "date"; di.value = e.date || "";
    di.onchange = function () {
      e.date = di.value; touchEvent(e); state.events.sort(byDateDesc);
    };
    whenRow.appendChild(field("Date", di));

    var ti = document.createElement("input");
    ti.type = "time"; ti.value = e.time || "";
    ti.onchange = function () { e.time = ti.value; touchEvent(e); };
    whenRow.appendChild(field("Time", ti));
    form.appendChild(whenRow);

    if (e.kind === "game") {
      form.appendChild(field("Opponent",
        textInput(e.title, "Who you play", function (v) { e.title = v; })));

      var venue = el("div", "field");
      venue.appendChild(el("div", "label", "Where"));
      var vr = el("div", "pips");
      [["home", "Home"], ["away", "Away"], ["neutral", "Neutral"]].forEach(function (v) {
        var b = el("button", null, v[1]);
        b.style.width = "auto";
        b.style.padding = "0 12px";
        b.setAttribute("aria-pressed", String(e.venue === v[0]));
        b.onclick = function () {
          e.venue = (e.venue === v[0] ? "" : v[0]);
          touchEvent(e);
          Array.prototype.forEach.call(vr.children, function (c, k) {
            c.setAttribute("aria-pressed", String(e.venue === ["home", "away", "neutral"][k]));
          });
        };
        vr.appendChild(b);
      });
      venue.appendChild(vr);
      form.appendChild(venue);

      var scoreRow = el("div", "ev-row");
      function scoreInput(value, set) {
        var i = document.createElement("input");
        i.type = "number"; i.min = "0"; i.max = "300";
        i.value = value === null || value === undefined ? "" : value;
        i.oninput = function () {
          set(i.value === "" ? null : Math.max(0, parseInt(i.value, 10) || 0));
          touchEvent(e);
        };
        return i;
      }
      scoreRow.appendChild(field("Us", scoreInput(e.scoreUs, function (v) { e.scoreUs = v; })));
      scoreRow.appendChild(field("Them", scoreInput(e.scoreThem, function (v) { e.scoreThem = v; })));
      form.appendChild(scoreRow);

      var unplayed = el("div", "hint");
      unplayed.innerHTML = "Leave the scores empty until it is played — " +
                           "a game with no score is counted as still to play, never as a draw.";
      form.appendChild(unplayed);
    } else {
      form.appendChild(field(e.kind === "tournament" ? "Tournament" : "What",
        textInput(e.title, kindLabel(e.kind), function (v) { e.title = v; })));
    }

    var noteField = el("div", "field");
    noteField.appendChild(el("div", "label", "Note"));
    var ta = document.createElement("textarea");
    ta.value = e.note || "";
    ta.style.minHeight = "60px";
    ta.oninput = function () { e.note = ta.value; touchEvent(e); };
    noteField.appendChild(ta);
    form.appendChild(noteField);

    panel.appendChild(form);

    var foot = el("div", "foot-row");
    foot.style.marginTop = "16px";
    var del = el("button", "chip danger", "Delete");
    del.onclick = function () {
      if (!confirm("Delete this " + kindLabel(e.kind).toLowerCase() + "?")) return;
      removeEvent(e.id);
      close();
    };
    foot.appendChild(del);
    panel.appendChild(foot);

    function close() {
      document.removeEventListener("keydown", onKey);
      back.remove();
      render();
    }
    function onKey(ev) { if (ev.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    back.onclick = function (ev) { if (ev.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  /* ---------- practices ---------- */

  function renderPractices() {
    var wrap = el("div", "wrap");

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    var doneList = state.practices.filter(function (p) { return p.status === "done"; });
    var planned = state.practices.length - doneList.length;

    var head = el("div", "lib-head");
    head.appendChild(el("h1", null, "Practices"));
    var bits = [];
    if (doneList.length) bits.push(doneList.length + " done");
    if (planned) bits.push(planned + " planned");
    head.appendChild(el("span", "count", bits.join(" · ")));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);
    var add = el("button", "chip primary", "+  New practice");
    add.onclick = function () {
      var p = newPractice();
      state.practices.unshift(p);
      touchPractice(p);
      go("practice", p.id);
    };
    head.appendChild(add);
    wrap.appendChild(head);

    if (state.practices.length > 1) {
      var f = el("div", "filters");
      [["", "All"], ["planned", "Planned"], ["done", "Done"]].forEach(function (o) {
        var b = el("button", null, o[1]);
        b.setAttribute("aria-pressed", String(route.pfilter === o[0]));
        b.onclick = function () { route.pfilter = o[0]; render(); };
        f.appendChild(b);
      });
      wrap.appendChild(f);
    }

    var list = state.practices.filter(function (p) {
      return !route.pfilter || p.status === route.pfilter;
    });

    var month = null;
    list.forEach(function (p) {
      var m = monthLabel(p.date);
      if (m !== month) { month = m; wrap.appendChild(el("div", "month label", m)); }
      wrap.appendChild(practiceRow(p));
    });

    if (!state.practices.length) {
      var e = el("div", "empty");
      e.innerHTML = "No practices yet.<br>Log a session and the library starts counting.";
      wrap.appendChild(e);
    } else if (!list.length) {
      wrap.appendChild(el("div", "empty", "Nothing with that status."));
    }

    app.appendChild(wrap);
  }

  function practiceRow(p) {
    var row = el("button", "prow");

    var left = el("div", "pwhen");
    left.appendChild(el("div", "pdate", prettyDate(p.date)));
    left.appendChild(el("div", "pbadge" + (p.status === "done" ? " done" : ""),
                       p.status === "done" ? "Done" : "Planned"));
    row.appendChild(left);

    var right = el("div", "pwhat");
    var n = p.items.length;
    var mins = practiceMinutes(p);
    var sub = [n + (n === 1 ? " drill" : " drills")];
    if (mins) sub.push(mins + " min");
    right.appendChild(el("div", "psub", sub.join(" · ")));
    right.appendChild(n
      ? el("div", "pnames", p.items.map(itemLabel).join("   ·   "))
      : el("div", "pnames dim", "Nothing added yet"));
    if (p.note) right.appendChild(el("div", "pnote", p.note));
    row.appendChild(right);

    row.onclick = function () { go("practice", p.id); };
    return row;
  }

  /* ---------- one practice ---------- */

  function renderPracticeEditor() {
    var p = findPractice(route.id);
    if (!p) { go("practices"); return; }

    backTo("practices", "Practices");

    var wrap = el("div", "wrap narrow");

    var head = el("div", "prac-head");

    var dateField = el("div", "field");
    dateField.appendChild(el("div", "label", "Date"));
    var di = document.createElement("input");
    di.type = "date"; di.value = p.date || "";
    di.onchange = function () {
      p.date = di.value;
      touchPractice(p);
      state.practices.sort(byDateDesc);
    };
    dateField.appendChild(di);
    head.appendChild(dateField);

    var timeField = el("div", "field");
    timeField.appendChild(el("div", "label", "Time"));
    var ti = document.createElement("input");
    ti.type = "time"; ti.value = p.time || "";
    ti.onchange = function () { p.time = ti.value; touchPractice(p); };
    timeField.appendChild(ti);
    head.appendChild(timeField);

    var statusField = el("div", "field");
    statusField.appendChild(el("div", "label", "Status"));
    var st = el("div");
    st.appendChild(el("span", "pbadge" + (p.status === "done" ? " done" : ""),
                      p.status === "done" ? "Done" : "Planned"));
    statusField.appendChild(st);
    head.appendChild(statusField);

    var totalField = el("div", "field");
    totalField.appendChild(el("div", "label", "Total"));
    var mins = practiceMinutes(p);
    totalField.appendChild(el("div", "ptotal", mins ? mins + " min" : "—"));
    head.appendChild(totalField);

    wrap.appendChild(head);

    var list = el("div", "items");
    p.items.forEach(function (it, i) { list.appendChild(itemRow(p, it, i)); });
    wrap.appendChild(list);

    if (!p.items.length) {
      wrap.appendChild(el("div", "empty",
        "Nothing in this practice yet. Add drills from the library."));
    }

    var addBtn = el("button", "add-row", "+  Add drill from library");
    addBtn.onclick = function () { openDrillPicker(p); };
    wrap.appendChild(addBtn);

    var noteField = el("div", "field");
    noteField.style.marginTop = "24px";
    noteField.appendChild(el("div", "label", "Session note"));
    var ta = document.createElement("textarea");
    ta.value = p.note || "";
    ta.placeholder = "How it went, who stood out, what to fix next time.";
    ta.oninput = function () { p.note = ta.value; touchPractice(p); };
    noteField.appendChild(ta);
    wrap.appendChild(noteField);

    var footer = el("div", "prac-foot");

    if (p.status === "planned") {
      var hint = el("div", "hint");
      hint.innerHTML = "This is still a <b>plan</b>, so nothing in it is counted yet. " +
                       "After the session, take out anything you did not get to — then mark it done.";
      footer.appendChild(hint);
    }

    var buttons = el("div", "foot-row");

    if (p.status === "planned") {
      var mark = el("button", "chip primary", "Mark this practice done");
      mark.onclick = function () { p.status = "done"; touchPractice(p); render(); };
      buttons.appendChild(mark);
    } else {
      var reopen = el("button", "chip ghost", "Reopen to change it");
      reopen.onclick = function () { p.status = "planned"; touchPractice(p); render(); };
      buttons.appendChild(reopen);
    }

    var print = el("button", "chip ghost", "Print");
    print.onclick = function () { window.print(); };
    buttons.appendChild(print);

    var del = el("button", "chip danger", "Delete practice");
    del.onclick = function () {
      if (!confirm("Delete the practice on " + prettyDate(p.date) + "? This cannot be undone.")) return;
      removePractice(p.id);
      go("practices");
    };
    buttons.appendChild(del);

    footer.appendChild(buttons);
    wrap.appendChild(footer);
    app.appendChild(wrap);
  }

  function itemRow(p, it, i) {
    var row = el("div", "item");

    row.appendChild(el("div", "inum", String(i + 1)));

    var d = it.drillId ? findDrill(it.drillId) : null;
    var gone = it.drillId && !d;

    var body = el("div", "ibody");
    body.appendChild(el("div", "iname", itemLabel(it)));
    var sub = [];
    if (d && d.tag) sub.push(d.tag);
    if (d && d.format) sub.push(d.format);
    if (gone) sub.push("no longer in the library");
    if (sub.length) body.appendChild(el("div", "isub" + (gone ? " gone" : ""), sub.join(" · ")));
    row.appendChild(body);

    var mi = document.createElement("input");
    mi.type = "number"; mi.min = "0"; mi.max = "240"; mi.className = "imin";
    mi.value = it.minutes;
    mi.setAttribute("aria-label", "Minutes");
    mi.oninput = function () {
      it.minutes = Math.max(0, parseInt(mi.value, 10) || 0);
      touchPractice(p);
      var t = app.querySelector(".ptotal");
      var m = practiceMinutes(p);
      if (t) t.textContent = m ? m + " min" : "—";
    };
    row.appendChild(mi);
    row.appendChild(el("div", "imunit", "min"));

    var moves = el("div", "imoves");
    var up = el("button", "mini", "↑");
    up.title = "Move earlier";
    up.disabled = i === 0;
    up.onclick = function () {
      p.items.splice(i - 1, 0, p.items.splice(i, 1)[0]);
      touchPractice(p); render();
    };
    var down = el("button", "mini", "↓");
    down.title = "Move later";
    down.disabled = i === p.items.length - 1;
    down.onclick = function () {
      p.items.splice(i + 1, 0, p.items.splice(i, 1)[0]);
      touchPractice(p); render();
    };
    var rm = el("button", "mini rm", "×");
    rm.title = "Take out of this practice";
    rm.onclick = function () {
      p.items.splice(i, 1);
      touchPractice(p); render();
    };
    moves.appendChild(up); moves.appendChild(down); moves.appendChild(rm);
    row.appendChild(moves);

    return row;
  }

  /* ---------- picking drills into a practice ----------
     The sheet stays open after each pick, because a practice is several drills
     and reopening the list every time would turn taps back into work. */

  function openDrillPicker(p) {
    var q = "", tag = "", filterRow = null, rows = null;

    var back = el("div", "modal-back");
    var panel = el("div", "modal");

    var mhead = el("div", "modal-head");
    mhead.appendChild(el("div", "mtitle", "Add drills"));
    var added = el("div", "count", "");
    mhead.appendChild(added);
    var gap = el("div"); gap.style.marginLeft = "auto";
    mhead.appendChild(gap);
    var closeBtn = el("button", "chip primary", "Done");
    closeBtn.onclick = close;
    mhead.appendChild(closeBtn);
    panel.appendChild(mhead);

    function paint() {
      if (filterRow) {
        Array.prototype.forEach.call(filterRow.children, function (b, idx) {
          b.setAttribute("aria-pressed", String(idx === 0 ? tag === "" : tag === b.textContent));
        });
      }
      rows.innerHTML = "";
      var hits = state.drills.filter(function (d) {
        if (tag && d.tag !== tag) return false;
        if (!q) return true;
        return (d.name || "").toLowerCase().indexOf(q) >= 0 ||
               (d.tag || "").toLowerCase().indexOf(q) >= 0 ||
               (d.points || "").toLowerCase().indexOf(q) >= 0;
      });
      if (!hits.length) { rows.appendChild(el("div", "empty", "No drill matches that.")); return; }
      hits.forEach(function (d) {
        var r = el("button", "mrow");
        var th = el("div", "mthumb");
        th.innerHTML = thumbFor(d);
        r.appendChild(th);
        var body = el("div", "mbody");
        body.appendChild(el("div", "mname", d.name || "Untitled"));
        var sub = [];
        if (d.tag) sub.push(d.tag);
        if (d.format) sub.push(d.format);
        if (d.minutes) sub.push(d.minutes + " min");
        body.appendChild(el("div", "isub", sub.join(" · ")));
        r.appendChild(body);
        var plus = el("div", "mplus", "+");
        r.appendChild(plus);
        r.onclick = function () {
          p.items.push(newItem(d));
          touchPractice(p);
          count();
          plus.textContent = "✓";
          plus.className = "mplus on";
          setTimeout(function () { plus.textContent = "+"; plus.className = "mplus"; }, 700);
        };
        rows.appendChild(r);
      });
    }

    if (!state.drills.length) {
      var e = el("div", "empty");
      e.innerHTML = "The library is empty.<br>Draw a drill first — practices are built from it.";
      panel.appendChild(e);
    } else {
      var search = document.createElement("input");
      search.type = "text"; search.placeholder = "Search drills";
      search.className = "msearch";
      search.oninput = function () { q = search.value.toLowerCase(); paint(); };
      panel.appendChild(search);

      var used = {};
      state.drills.forEach(function (d) { if (d.tag) used[d.tag] = 1; });
      var tagNames = Object.keys(used).sort();
      if (tagNames.length > 1) {
        filterRow = el("div", "filters");
        var all = el("button", null, "All");
        all.onclick = function () { tag = ""; paint(); };
        filterRow.appendChild(all);
        tagNames.forEach(function (t) {
          var b = el("button", null, t);
          b.onclick = function () { tag = (tag === t ? "" : t); paint(); };
          filterRow.appendChild(b);
        });
        panel.appendChild(filterRow);
      }

      rows = el("div", "mrows");
      panel.appendChild(rows);
      paint();
    }

    function count() {
      var n = p.items.length;
      added.textContent = n ? n + (n === 1 ? " drill in this practice" : " drills in this practice") : "";
    }
    count();

    function close() {
      document.removeEventListener("keydown", onKey);
      back.remove();
      render();
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    back.onclick = function (e) { if (e.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  /* ---------- editor ---------- */

  function renderEditor() {
    var drill = findDrill(route.id);
    if (!drill) { go("library"); return; }

    backTo("library", "Library");

    var shell = el("div", "editor");
    shell.appendChild(buildRail());

    var sheet = el("div", "sheet");

    var name = document.createElement("input");
    name.type = "text"; name.className = "name-input"; name.value = drill.name;
    name.placeholder = "Drill name  —  e.g. 5:0";
    name.oninput = function () { drill.name = name.value; touch(drill); };
    sheet.appendChild(name);

    sheet.appendChild(buildMeta(drill));

    var diagrams = el("div", "diagrams");
    drill.diagrams.forEach(function (dg, i) { diagrams.appendChild(buildDiagram(drill, dg, i)); });
    sheet.appendChild(diagrams);

    var add = el("button", "add-court", "+  Add another court");
    add.onclick = function () {
      drill.diagrams.push(newDiagram());
      touch(drill); render();
    };
    sheet.appendChild(add);

    var footer = el("div", null);
    footer.style.cssText = "margin-top:26px;display:flex;gap:8px;flex-wrap:wrap";
    var del = el("button", "chip danger", "Delete drill");
    del.onclick = function () {
      // Practices keep a name snapshot, so history survives — but say so plainly
      // rather than letting a season of records quietly lose their diagram.
      var used = state.practices.filter(function (p) {
        for (var i = 0; i < p.items.length; i++) if (p.items[i].drillId === drill.id) return true;
        return false;
      }).length;
      var msg = "Delete “" + (drill.name || "Untitled") + "”? This cannot be undone.";
      if (used) {
        msg += "\n\nIt is in " + used + " practice" + (used === 1 ? "" : "s") +
               ". Those still list the name, but the diagram and its details go for good.";
      }
      if (!confirm(msg)) return;
      removeDrill(drill.id);
      go("library");
    };
    var done = el("button", "chip primary", "Done");
    done.onclick = function () { go("library"); };
    footer.appendChild(done); footer.appendChild(del);
    sheet.appendChild(footer);

    shell.appendChild(sheet);
    app.appendChild(shell);
  }

  function buildMeta(drill) {
    var row = el("div", "metarow");

    row.appendChild(pickerField("Focus tag", TAGS, drill.tag, function (v) {
      drill.tag = v; touch(drill);
    }));
    row.appendChild(pickerField("Group format", FORMATS, drill.format, function (v) {
      drill.format = v; touch(drill);
    }));

    var mins = el("div", "field");
    mins.appendChild(el("div", "label", "Typical minutes"));
    var mi = document.createElement("input");
    mi.type = "number"; mi.min = "1"; mi.max = "180"; mi.value = drill.minutes;
    mi.oninput = function () {
      var v = parseInt(mi.value, 10);
      drill.minutes = isNaN(v) ? 0 : v; touch(drill);
    };
    mins.appendChild(mi);
    row.appendChild(mins);

    var wrapper = document.createElement("div");
    wrapper.appendChild(row);
    wrapper.appendChild(buildIntensity(drill));

    var pts = el("div", "field");
    pts.style.marginTop = "14px";
    pts.appendChild(el("div", "label", "Coaching points"));
    var ta = document.createElement("textarea");
    ta.value = drill.points;
    ta.placeholder = "The two or three things you are actually looking for.";
    ta.oninput = function () { drill.points = ta.value; touch(drill); };
    pts.appendChild(ta);
    wrapper.appendChild(pts);

    return wrapper;
  }

  // A select that also accepts a value it has never seen, so the lists grow with use.
  /* Intensity runs 1-10, not 1-5, because that is the scale the club's own
     measurements were taken on — 36 of the imported drills carry a real tracked
     number. Measured values have a decimal (8.59); the pips mark the nearest
     whole number and the exact figure is shown beside them, so tapping a pip is
     always a deliberate change rather than a silent rounding. The untouched
     original stays in `load.measured` either way. */

  function buildIntensity(drill) {
    var f = el("div", "field");
    f.style.marginTop = "14px";

    var head = el("div", "int-head");
    head.appendChild(el("div", "label", "Intensity"));
    var readout = el("div", "int-read");
    var measured = drill.load && typeof drill.load.measured === "number";
    function say() {
      var v = Number(drill.intensity) || 0;
      readout.textContent = (Math.round(v * 100) % 100 ? v.toFixed(2) : String(v)) + " / 10" +
        (measured && Math.abs(v - drill.load.measured) < 1e-9 ? "  ·  measured" : "");
    }
    head.appendChild(readout);
    f.appendChild(head);

    var pips = el("div", "pips");
    var lit = Math.round(Number(drill.intensity) || 0);
    for (var i = 1; i <= 10; i++) (function (n) {
      var b = el("button", null, String(n));
      b.setAttribute("aria-pressed", String(lit === n));
      b.onclick = function () {
        drill.intensity = n; touch(drill);
        measured = false;
        Array.prototype.forEach.call(pips.children, function (c, k) {
          c.setAttribute("aria-pressed", String(k + 1 === n));
        });
        say();
      };
      pips.appendChild(b);
    })(i);
    f.appendChild(pips);
    say();
    return f;
  }

  function pickerField(label, options, value, onSet) {
    var f = el("div", "field");
    f.appendChild(el("div", "label", label));
    var sel = document.createElement("select");
    var opts = options.slice();
    if (value && opts.indexOf(value) === -1) opts.push(value);
    sel.appendChild(new Option("—", ""));
    opts.forEach(function (o) { sel.appendChild(new Option(o, o)); });
    sel.appendChild(new Option("Add new…", "__new"));
    sel.value = value || "";
    sel.onchange = function () {
      if (sel.value === "__new") {
        var v = prompt("New " + label.toLowerCase());
        if (v && v.trim()) {
          v = v.trim();
          sel.insertBefore(new Option(v, v), sel.lastChild);
          sel.value = v; onSet(v);
        } else { sel.value = value || ""; }
        return;
      }
      value = sel.value; onSet(sel.value);
    };
    f.appendChild(sel);
    return f;
  }

  function buildDiagram(drill, dg, i) {
    var box = el("div", "diagram");
    var head = el("div", "diagram-head");
    head.appendChild(el("span", "num", "Court " + (i + 1)));

    var cap = document.createElement("input");
    cap.type = "text"; cap.value = dg.caption;
    cap.placeholder = "What this one shows — e.g. initial spacing";
    cap.oninput = function () { dg.caption = cap.value; touch(drill); };
    head.appendChild(cap);

    var grp = el("div", "grp");
    var pad;

    ["half", "full"].forEach(function (k) {
      var b = el("button", "chip", k === "half" ? "Half" : "Full");
      b.setAttribute("aria-pressed", String(dg.court === k));
      b.onclick = function () {
        dg.court = k; touch(drill);
        Array.prototype.forEach.call(grp.querySelectorAll("[data-court]"), function (x) {
          x.setAttribute("aria-pressed", String(x.getAttribute("data-court") === k));
        });
        pad.setCourt(k);
      };
      b.setAttribute("data-court", k);
      grp.appendChild(b);
    });

    ["S", "M", "L"].forEach(function (s) {
      var b = el("button", "chip", s);
      b.setAttribute("data-size", s);
      b.setAttribute("aria-pressed", String(dg.size === s));
      b.onclick = function () {
        dg.size = s; touch(drill);
        Array.prototype.forEach.call(grp.querySelectorAll("[data-size]"), function (x) {
          x.setAttribute("aria-pressed", String(x.getAttribute("data-size") === s));
        });
        pad.layout();
      };
      grp.appendChild(b);
    });

    var undo = el("button", "chip", "Undo");
    undo.onclick = function () { pad.undo(); };
    grp.appendChild(undo);

    if (drill.diagrams.length > 1) {
      var rm = el("button", "chip danger", "Remove");
      rm.onclick = function () {
        if (!confirm("Remove court " + (i + 1) + " from this drill?")) return;
        drill.diagrams.splice(i, 1); touch(drill); render();
      };
      grp.appendChild(rm);
    }

    head.appendChild(grp);
    box.appendChild(head);

    var holder = el("div", null);
    box.appendChild(holder);
    pad = Pad(holder, dg, function () { touch(drill); });
    pads.push(pad);

    return box;
  }

  /* ---------- tool rail ---------- */

  var ICONS = {
    pen: '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>',
    marker: '<path d="M5 19h5l9-9a2.8 2.8 0 0 0-4-4l-9 9v4z"/><path d="M3 21h8"/>',
    eraser: '<path d="M8 20l-4-4a1.8 1.8 0 0 1 0-2.5l8-8a1.8 1.8 0 0 1 2.5 0l4.5 4.5a1.8 1.8 0 0 1 0 2.5L14 20z"/><path d="M20 20h-9"/>'
  };

  function buildRail() {
    var rail = el("nav", "rail");
    rail.setAttribute("aria-label", "Drawing tools");

    ["pen", "marker", "eraser"].forEach(function (t) {
      var b = el("button", "tool");
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[t] + "</svg>";
      b.title = t.charAt(0).toUpperCase() + t.slice(1);
      b.setAttribute("aria-pressed", String(tool.name === t));
      b.onclick = function () {
        tool.name = t;
        Array.prototype.forEach.call(rail.querySelectorAll(".tool"), function (x, i) {
          x.setAttribute("aria-pressed", String(["pen", "marker", "eraser"][i] === t));
        });
      };
      rail.appendChild(b);
    });

    rail.appendChild(el("hr"));
    rail.appendChild(el("div", "cap label", "Ink"));
    [["#22201C", "Black"], ["#C8322B", "Red"], ["#2563B0", "Blue"], ["#2E8B4F", "Green"]]
      .forEach(function (c) {
        var b = el("button", "swatch");
        b.style.background = c[0]; b.title = c[1];
        b.setAttribute("data-color", c[0]);
        b.setAttribute("aria-pressed", String(tool.color === c[0]));
        b.onclick = function () {
          tool.color = c[0];
          Array.prototype.forEach.call(rail.querySelectorAll(".swatch"), function (x) {
            x.setAttribute("aria-pressed", String(x.getAttribute("data-color") === c[0]));
          });
        };
        rail.appendChild(b);
      });

    rail.appendChild(el("hr"));
    rail.appendChild(el("div", "cap label", "Size"));
    [[4, 2], [7, 4], [12, 7]].forEach(function (s) {
      var b = el("button", "size-btn");
      b.innerHTML = '<i style="width:20px;height:' + s[1] + 'px"></i>';
      b.setAttribute("data-size", String(s[0]));
      b.setAttribute("aria-pressed", String(tool.size === s[0]));
      b.onclick = function () {
        tool.size = s[0];
        Array.prototype.forEach.call(rail.querySelectorAll(".size-btn"), function (x) {
          x.setAttribute("aria-pressed", String(parseInt(x.getAttribute("data-size"), 10) === s[0]));
        });
      };
      rail.appendChild(b);
    });

    rail.appendChild(el("hr"));
    var finger = el("button", "tool");
    finger.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/>' +
      '<path d="M12 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 11V6.5a1.5 1.5 0 0 1 3 0V13a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2-3.5a1.5 1.5 0 0 1 2.5-1.7L9 14"/></svg>';
    finger.title = "Let a finger draw as well as the Pencil";
    finger.setAttribute("aria-pressed", String(tool.fingerDraws));
    finger.onclick = function () {
      tool.fingerDraws = !tool.fingerDraws;
      finger.setAttribute("aria-pressed", String(tool.fingerDraws));
    };
    rail.appendChild(finger);

    return rail;
  }

  /* ================= backup ================= */

  function stamp() { return todayISO(); }

  document.getElementById("exportBtn").onclick = async function () {
    var json = serialize(state);
    var filename = "practise-organiser-backup-" + stamp() + ".json";
    var downloads = null;
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    if (downloads) {
      try { await downloads.save({ filename: filename, data: json }); chip("Backup saved", false); }
      catch (e) { chip("Backup cancelled", false); }
      return;
    }
    var blob = new Blob([json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  };

  /* Import used to be replace-only, which is a bad thing to hand a coach whose
     season is already in the app. Merging by id means the same file can be
     imported twice without doubling the library. */

  function applyImport(incoming, mode) {
    if (mode === "replace") {
      state = incoming;
      state.drills.forEach(function (d) { dirty[d.id] = "drills"; });
      state.practices.forEach(function (p) { dirty[p.id] = "practices"; });
      if (Store.kind === "idb") {
        Promise.all([DB.clear("drills"), DB.clear("practices")]).then(flush);
      } else flush();
    } else {
      incoming.drills.forEach(function (d) {
        var at = -1;
        for (var i = 0; i < state.drills.length; i++) if (state.drills[i].id === d.id) at = i;
        if (at >= 0) state.drills[at] = d; else state.drills.push(d);
        dirty[d.id] = "drills";
      });
      incoming.practices.forEach(function (p) {
        var at = -1;
        for (var i = 0; i < state.practices.length; i++) if (state.practices[i].id === p.id) at = i;
        if (at >= 0) state.practices[at] = p; else state.practices.push(p);
        dirty[p.id] = "practices";
      });
      state.drills.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
      state.practices.sort(byDateDesc);
      flush();
    }
    render();
    chip("Imported", false);
  }

  function askImportMode(incoming, then) {
    var fresh = incoming.drills.filter(function (d) { return !findDrill(d.id); }).length;
    var again = incoming.drills.length - fresh;

    var back = el("div", "modal-back");
    var panel = el("div", "modal choice");

    var head = el("div", "modal-head");
    head.appendChild(el("div", "mtitle", "Import"));
    panel.appendChild(head);

    var lines = [];
    lines.push("<b>" + incoming.drills.length + "</b> drill" +
               (incoming.drills.length === 1 ? "" : "s") +
               (incoming.practices.length ? " and <b>" + incoming.practices.length +
                "</b> practice" + (incoming.practices.length === 1 ? "" : "s") : "") +
               " in this file.");
    if (again) {
      lines.push("<b>" + again + "</b> of them " + (again === 1 ? "is" : "are") +
                 " already here and would be updated to the version in the file.");
    }
    lines.push("This app currently holds <b>" + state.drills.length + "</b> drill" +
               (state.drills.length === 1 ? "" : "s") + " and <b>" +
               state.practices.length + "</b> practice" +
               (state.practices.length === 1 ? "" : "s") + ".");
    var body = el("div", "choice-body");
    body.innerHTML = lines.join("<br>");
    panel.appendChild(body);

    function close() { back.remove(); }

    var opts = el("div", "choice-opts");

    var merge = el("button", "choice-btn");
    merge.innerHTML = "<b>Add to what is here</b>" +
      "<span>Keeps everything already in the app. Nothing is lost.</span>";
    merge.onclick = function () { close(); then(incoming, "merge"); };
    opts.appendChild(merge);

    var replace = el("button", "choice-btn danger-choice");
    replace.innerHTML = "<b>Replace everything</b>" +
      "<span>Deletes what is in the app now and leaves only this file.</span>";
    replace.onclick = function () {
      if (!confirm("Delete the " + state.drills.length + " drill" +
                   (state.drills.length === 1 ? "" : "s") + " and " +
                   state.practices.length + " practice" +
                   (state.practices.length === 1 ? "" : "s") +
                   " in the app now? This cannot be undone.")) return;
      close(); then(incoming, "replace");
    };
    opts.appendChild(replace);

    var cancel = el("button", "choice-btn");
    cancel.innerHTML = "<b>Cancel</b><span>Change nothing.</span>";
    cancel.onclick = close;
    opts.appendChild(cancel);

    panel.appendChild(opts);
    back.onclick = function (e) { if (e.target === back) close(); };
    back.appendChild(panel);
    document.body.appendChild(back);
  }

  var fileInput = document.getElementById("importFile");
  document.getElementById("importBtn").onclick = function () { fileInput.click(); };
  fileInput.onchange = function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = deserialize(String(reader.result));
        if (!incoming) throw new Error("shape");
        askImportMode(incoming, applyImport);
      } catch (e) {
        alert("That file is not a Practise Organiser backup.");
      }
      fileInput.value = "";
    };
    reader.readAsText(f);
  };

  /* ================= boot ================= */

  chip("Opening…");
  initStore().then(function () {
    chip("");
    render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    if (!PREVIEW && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  });
})();
</script>
