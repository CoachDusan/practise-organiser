  /* ================= court geometry (FIBA, centimetres) ================= */

  function halfCourtMarks() {
    return '<rect class="court-line" x="505" y="0" width="490" height="580"/>' +
           '<path class="court-line" d="M 570 580 A 180 180 0 0 0 930 580"/>' +
           '<path class="court-line dash" d="M 570 580 A 180 180 0 0 1 930 580"/>' +
           '<path class="court-line" d="M 90 0 L 90 299 A 675 675 0 0 0 1410 299 L 1410 0"/>' +
           '<path class="court-line" d="M 625 157.5 A 125 125 0 0 0 875 157.5"/>' +
           '<path class="court-line thick" d="M 660 120 L 840 120"/>' +
           '<path class="court-line" d="M 750 120 L 750 135"/>' +
           '<circle class="rim" cx="750" cy="157.5" r="22.5"/>';
  }

  var COURTS = {
    half: { w: 1500, h: 1400, svg:
      '<rect class="court-line thick" x="0" y="0" width="1500" height="1400"/>' + halfCourtMarks() +
      '<path class="court-line" d="M 570 1400 A 180 180 0 0 1 930 1400"/>' },
    full: { w: 2800, h: 1500, svg:
      '<rect class="court-line thick" x="0" y="0" width="2800" height="1500"/>' +
      '<g transform="matrix(0 1 1 0 0 0)">' + halfCourtMarks() + '</g>' +
      '<g transform="matrix(0 1 -1 0 2800 0)">' + halfCourtMarks() + '</g>' +
      '<path class="court-line" d="M 1400 0 L 1400 1500"/>' +
      '<circle class="court-line" cx="1400" cy="750" r="180"/>' }
  };
  var BLEED = 8;   // keeps boundary lines off the viewBox edge

  function courtSvg(kind) {
    var c = COURTS[kind] || COURTS.half;
    return '<svg viewBox="' + (-BLEED) + ' ' + (-BLEED) + ' ' + (c.w + BLEED * 2) + ' ' +
           (c.h + BLEED * 2) + '" preserveAspectRatio="none">' + c.svg + '</svg>';
  }
  function courtAspect(kind) {
    var c = COURTS[kind] || COURTS.half;
    return (c.h + BLEED * 2) / (c.w + BLEED * 2);   // height / width
  }

  /* ================= state ================= */

  var TAGS = ["Warm-up", "Shooting", "Transition", "Offence", "Defence",
              "Live / scrimmage", "Pick & roll", "Post play", "Rebounding",
              "Conditioning", "Set plays", "Ball handling"];
  var FORMATS = ["Individual", "Pairs", "3v3", "4v4", "5v5", "5:0", "Whole team"];
  var SIZES = { S: 300, M: 460, L: 660 };   // css px, the court's drawn width

  var state = { version: 5, drills: [], practices: [], events: [], players: [], tactics: [] };
  var PREVIEW = !!(window.claude);   // running inside the claude.ai preview sandbox

  /* ================= storage =================
     IndexedDB, not localStorage: a far larger quota, and it stores structured
     records so saving one drill does not mean rewriting the whole library.
     Drills are held one record each, packed. localStorage is kept only as a
     fallback for a browser that refuses IndexedDB. */

  var Store = { kind: "memory" };
  var LS_KEY = "practise-organiser/v1";

  /* Which categories are open is a preference of this iPad, not something that
     belongs in the season's record — so it lives in localStorage and is never
     part of a backup. It survives a restart, so the library opens the way he
     left it. Storage being unavailable must never break a screen: every access
     is guarded and the app falls back to "closed". */
  var UI_KEY = "practise-organiser/ui";
  var ui = { open: {}, theme: "" };

  function loadUI() {
    try {
      var raw = localStorage.getItem(UI_KEY);
      var saved = raw ? JSON.parse(raw) : null;
      if (saved && saved.open) ui.open = saved.open;
      if (saved && saved.theme) ui.theme = saved.theme;
    } catch (e) { ui.open = {}; ui.theme = ""; }
  }

  /* Which theme is a preference of this iPad, exactly like which categories are
     open: it belongs to the device, not to the season, so it is never in a
     backup. Paper is the default; dark is an explicit choice, because a gym at
     21:00 and a gym at 10:00 are different rooms. */
  function applyTheme() {
    var root = document.documentElement;
    if (!root) return;
    if (ui.theme === "dark") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    var tc = document.querySelector ? document.querySelector('meta[name="theme-color"]') : null;
    if (tc) tc.setAttribute("content", ui.theme === "dark" ? "#24221D" : "#1D3E57");
  }

  function toggleTheme() {
    ui.theme = ui.theme === "dark" ? "light" : "dark";
    saveUI();
    applyTheme();
    if (themeBtn) themeBtn.textContent = ui.theme === "dark" ? "\u2600" : "\u263D";
  }

  function saveUI() {
    try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {}
  }

  /* Stored as an explicit 1 or 0 rather than "present means open", so a section
     that starts open can still be closed for good. Keys that were never touched
     fall back to the caller's default. */
  function isOpen(key, fallback) {
    if (Object.prototype.hasOwnProperty.call(ui.open, key)) return !!ui.open[key];
    return !!fallback;
  }

  function setOpen(key, on) {
    ui.open[key] = on ? 1 : 0;
    saveUI();
  }

  function setOpenAll(keys, on) {
    keys.forEach(function (k) { ui.open[k] = on ? 1 : 0; });
    saveUI();
  }

  /* A category that opens. The body is only built when it is open, so a library
     of forty drills does not draw forty thumbnails to show six headings. */
  function section(key, title, countText, buildBody, startOpen) {
    var open = isOpen(key, startOpen);
    var box = el("div", "sect" + (open ? " on" : ""));

    var head = el("button", "sect-head");
    head.setAttribute("aria-expanded", String(open));
    head.appendChild(el("span", "sect-caret", open ? "\u25be" : "\u25b8"));
    head.appendChild(el("span", "sect-title", title));
    head.appendChild(el("span", "sect-count", countText));
    head.onclick = function () { setOpen(key, !open); render(); };
    box.appendChild(head);

    if (open) {
      var body = el("div", "sect-body");
      buildBody(body);
      box.appendChild(body);
    }
    return box;
  }

  /* One object store per kind of record. Practices arrived at DB version 2 and
     schedule events at version 3, players at version 4 and tactics at version 5;
     each upgrade only creates what is missing, so data written under an older
     version is carried across untouched. */
  var DB = (function () {
    var opening = null;
    function open() {
      if (opening) return opening;
      opening = new Promise(function (resolve, reject) {
        var req = indexedDB.open("practise-organiser", 5);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains("drills")) db.createObjectStore("drills", { keyPath: "id" });
          if (!db.objectStoreNames.contains("practices")) db.createObjectStore("practices", { keyPath: "id" });
          if (!db.objectStoreNames.contains("events")) db.createObjectStore("events", { keyPath: "id" });
          if (!db.objectStoreNames.contains("players")) db.createObjectStore("players", { keyPath: "id" });
          if (!db.objectStoreNames.contains("tactics")) db.createObjectStore("tactics", { keyPath: "id" });
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
        req.onblocked = function () { reject(new Error("blocked")); };
      });
      return opening;
    }
    function run(store, mode, fn) {
      return open().then(function (db) {
        return new Promise(function (resolve, reject) {
          var t = db.transaction(store, mode);
          var req = fn(t.objectStore(store));
          t.oncomplete = function () { resolve(req ? req.result : undefined); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
        });
      });
    }
    return {
      all:   function (s)     { return run(s, "readonly",  function (o) { return o.getAll(); }); },
      put:   function (s, d)  { return run(s, "readwrite", function (o) { return o.put(d); }); },
      del:   function (s, id) { return run(s, "readwrite", function (o) { return o.delete(id); }); },
      clear: function (s)     { return run(s, "readwrite", function (o) { return o.clear(); }); }
    };
  })();

  function initStore() {
    return Promise.resolve()
      .then(function () {
        if (!window.indexedDB) throw new Error("no idb");
        return Promise.all([DB.all("drills"), DB.all("practices"), DB.all("events"),
                            DB.all("players"), DB.all("tactics")])
          .then(function (r) {
            Store.kind = "idb";
            return { drills: r[0] || [], practices: r[1] || [], events: r[2] || [],
                     players: r[3] || [], tactics: r[4] || [] };
          });
      })
      .catch(function () {
        try {
          localStorage.setItem("__probe", "1");
          var ok = localStorage.getItem("__probe") === "1";
          localStorage.removeItem("__probe");
          if (!ok) throw new Error("no ls");
          Store.kind = "local";
          var raw = localStorage.getItem(LS_KEY);
          var saved = raw ? JSON.parse(raw) : null;
          return { drills: (saved && saved.drills) || [],
                   practices: (saved && saved.practices) || [],
                   events: (saved && saved.events) || [],
                   players: (saved && saved.players) || [],
                   tactics: (saved && saved.tactics) || [] };
        } catch (e) {
          Store.kind = "memory";
          return { drills: [], practices: [], events: [], players: [], tactics: [] };
        }
      })
      .then(function (rows) {
        state.drills = rows.drills.map(inflateDrill)
          .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
        state.practices = rows.practices.map(inflatePractice).sort(byDateDesc);
        state.events = rows.events.map(inflateEvent).sort(byDateDesc);
        state.players = rows.players.map(inflatePlayer).sort(bySquadNumber);
        state.tactics = rows.tactics.map(inflateTactic)
          .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
        // Ask Safari not to evict this data when space runs low.
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(function () {});
        }
      });
  }

  function persistAll() {
    if (Store.kind === "local") {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          version: 5, drills: state.drills.map(deflateDrill),
          practices: state.practices.map(deflatePractice),
          events: state.events.map(deflateEvent),
          players: state.players.map(deflatePlayer),
          tactics: state.tactics.map(deflateTactic)
        }));
        return Promise.resolve();
      } catch (e) { return Promise.reject(e); }
    }
    return Promise.resolve();
  }

  /* dirty maps a record id to the store it belongs in, so one save queue can
     carry both drills and practices. */
  var dirty = {}, saveTimer = null;

  function touch(drill) {
    drill.updatedAt = Date.now();
    dirty[drill.id] = "drills";
    schedule();
  }

  function touchPractice(p) {
    p.updatedAt = Date.now();
    dirty[p.id] = "practices";
    schedule();
  }

  function touchEvent(e) {
    e.updatedAt = Date.now();
    dirty[e.id] = "events";
    schedule();
  }

  function touchPlayer(pl) {
    pl.updatedAt = Date.now();
    dirty[pl.id] = "players";
    schedule();
  }

  function touchTactic(t) {
    t.updatedAt = Date.now();
    dirty[t.id] = "tactics";
    schedule();
  }

  function schedule() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }

  function flush() {
    var queued = dirty;
    var ids = Object.keys(queued);
    dirty = {};
    if (Store.kind === "memory") { chip("Not being saved", true); return; }

    var work;
    if (Store.kind === "idb") {
      work = Promise.all(ids.map(function (id) {
        if (queued[id] === "practices") {
          var p = findPractice(id);
          return p ? DB.put("practices", deflatePractice(p)) : DB.del("practices", id);
        }
        if (queued[id] === "events") {
          var ev = findEvent(id);
          return ev ? DB.put("events", deflateEvent(ev)) : DB.del("events", id);
        }
        if (queued[id] === "players") {
          var pl = findPlayer(id);
          return pl ? DB.put("players", deflatePlayer(pl)) : DB.del("players", id);
        }
        if (queued[id] === "tactics") {
          var t = findTactic(id);
          return t ? DB.put("tactics", deflateTactic(t)) : DB.del("tactics", id);
        }
        var d = findDrill(id);
        return d ? DB.put("drills", deflateDrill(d)) : DB.del("drills", id);
      }));
    } else {
      work = persistAll();
    }
    work.then(flashSaved).catch(function () {
      Store.kind = "memory";
      chip("Could not save — export a backup now", true);
      render();
    });
  }

  function removeDrill(id) {
    state.drills = state.drills.filter(function (d) { return d.id !== id; });
    if (Store.kind === "idb") DB.del("drills", id).then(flashSaved).catch(function () {});
    else { dirty[id] = "drills"; schedule(); }
  }

  function removePractice(id) {
    state.practices = state.practices.filter(function (p) { return p.id !== id; });
    if (Store.kind === "idb") DB.del("practices", id).then(flashSaved).catch(function () {});
    else { dirty[id] = "practices"; schedule(); }
  }

  function removeEvent(id) {
    state.events = state.events.filter(function (e) { return e.id !== id; });
    if (Store.kind === "idb") DB.del("events", id).then(flashSaved).catch(function () {});
    else { dirty[id] = "events"; schedule(); }
  }

  function removePlayer(id) {
    state.players = state.players.filter(function (p) { return p.id !== id; });
    if (Store.kind === "idb") DB.del("players", id).then(flashSaved).catch(function () {});
    else { dirty[id] = "players"; schedule(); }
  }

  function removeTactic(id) {
    state.tactics = state.tactics.filter(function (t) { return t.id !== id; });
    if (Store.kind === "idb") DB.del("tactics", id).then(flashSaved).catch(function () {});
    else { dirty[id] = "tactics"; schedule(); }
  }

  /* Kept in step with VERSION in sw.js; there is a test that they match. */
  var BUILD = "v21";
  var buildTag = document.getElementById("buildTag");
  if (buildTag) buildTag.textContent = BUILD;

  var themeBtn = document.getElementById("themeBtn");
  var chipEl = document.getElementById("saveChip");
  function chip(msg, sticky) {
    chipEl.textContent = msg;
    chipEl.className = "savechip" + (sticky ? " on" : "");
  }
  var flashTimer = null;
  function flashSaved() {
    chip("Saved");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { chip(""); }, 1400);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function newDrill() {
    return {
      id: uid(), name: "", tag: "", format: "", minutes: 10, intensity: 5,
      points: "", diagrams: [newDiagram()], createdAt: Date.now(), updatedAt: Date.now()
    };
  }
  function newDiagram() { return { id: uid(), court: "half", size: "M", caption: "", strokes: [] }; }
  function findDrill(id) {
    for (var i = 0; i < state.drills.length; i++) if (state.drills[i].id === id) return state.drills[i];
    return null;
  }

  /* ================= practices =================
     A practice is a dated list of which drills were run. It holds no ink of its
     own: the diagram lives once, in the drill. An item keeps `drillId` as the
     fact and `name` only as a label to fall back on, so a practice from October
     still reads sensibly if the drill is deleted in March. Counting always goes
     through drillId, never the label.

     `status` is the honesty mechanism. A practice starts "planned" and becomes
     "done" only when the coach says the session happened. Nothing planned is
     ever counted, so the archive can never report an intention as a fact. */

  function newPractice() {
    return {
      id: uid(), date: todayISO(), time: "", timeEnd: "", status: "planned",
      items: [], attendance: {}, note: "",
      createdAt: Date.now(), updatedAt: Date.now()
    };
  }

  function newItem(drill) {
    return { id: uid(), kind: "drill", drillId: drill.id,
             name: drill.name || "Untitled", minutes: drill.minutes || 0 };
  }

  function newTacticItem(t, o) {
    return { id: uid(), kind: "tactic", tacticId: t.id, optionId: o.id,
             name: optionLabel(t, o), minutes: 0 };
  }

  function findPractice(id) {
    for (var i = 0; i < state.practices.length; i++) {
      if (state.practices[i].id === id) return state.practices[i];
    }
    return null;
  }

  // Practices carry no strokes, so there is nothing to pack; the pair exists so
  // the save path looks the same for both kinds of record.
  function deflatePractice(p) { return p; }

  function inflatePractice(p) {
    if (!Array.isArray(p.items)) p.items = [];
    if (p.status !== "done") p.status = "planned";
    if (!p.attendance || typeof p.attendance !== "object") p.attendance = {};
    p.items.forEach(function (it) {
      it.minutes = Number(it.minutes) || 0;
      // items written before tactics existed are all drills
      if (!it.kind) it.kind = "drill";
    });
    return p;
  }

  // Newest session first; ties broken by when the record was made.
  function byDateDesc(a, b) {
    var d = String(b.date || "").localeCompare(String(a.date || ""));
    return d !== 0 ? d : (b.createdAt || 0) - (a.createdAt || 0);
  }

  function itemLabel(it) {
    if (it.kind === "tactic") {
      var t = it.tacticId ? findTactic(it.tacticId) : null;
      var o = t ? findOption(t, it.optionId) : null;
      return t ? optionLabel(t, o) : (it.name || "Untitled");
    }
    var d = it.drillId ? findDrill(it.drillId) : null;
    return d ? (d.name || "Untitled") : (it.name || "Untitled");
  }

  function practiceMinutes(p) {
    var t = 0;
    for (var i = 0; i < p.items.length; i++) t += Number(p.items[i].minutes) || 0;
    return t;
  }

  /* How many completed sessions each drill has appeared in. Counted once per
     session, not once per entry — "run in 7 practices" is the honest sentence.
     Planned practices are excluded on purpose. */
  function usageMap() {
    var m = {};
    state.practices.forEach(function (p) {
      if (p.status !== "done") return;
      var seen = {};
      p.items.forEach(function (it) {
        if (!it.drillId || seen[it.drillId]) return;
        seen[it.drillId] = 1;
        m[it.drillId] = (m[it.drillId] || 0) + 1;
      });
    });
    return m;
  }

  /* ================= tactics =================
     The team's package, and it has two ends. A set holds options: "Horns" is the
     set, and Flare, Down and Slip are how it is actually run. Three options typed
     as three separate entries would be three strings that happen to start with
     the same word; held as options of one set they are one thing with three ways
     out of it, which is how it gets explained to a player.

     Defence is a first-class side, not a category tucked under offence. */

  var SIDES = ["Offence", "Defence", "Special situations"];

  var TACTIC_CATEGORIES = {
    "Offence": ["Half-court sets", "Early offence", "Zone offence", "Press break",
                "Baseline out of bounds", "Sideline out of bounds", "Delay / clock offence"],
    "Defence": ["Man-to-man", "Zone defence", "Full-court press", "Half-court trap",
                "Transition defence", "Defending out of bounds", "Defending the pick & roll"],
    "Special situations": ["Last shot", "End of quarter", "Free-throw situations",
                           "Fouling and clock", "Jump ball"]
  };

  function categoriesFor(side) { return TACTIC_CATEGORIES[side] || []; }

  function newTactic() {
    return {
      id: uid(), name: "", side: "Offence", category: "", note: "",
      options: [newOption()], createdAt: Date.now(), updatedAt: Date.now()
    };
  }

  function newOption() {
    return { id: uid(), name: "", points: "", diagrams: [newDiagram()] };
  }

  function findTactic(id) {
    for (var i = 0; i < state.tactics.length; i++) if (state.tactics[i].id === id) return state.tactics[i];
    return null;
  }

  function findOption(t, optionId) {
    if (!t) return null;
    for (var i = 0; i < t.options.length; i++) if (t.options[i].id === optionId) return t.options[i];
    return null;
  }

  function deflateTactic(t) {
    var copy = {};
    for (var k in t) if (k !== "options") copy[k] = t[k];
    copy.options = t.options.map(function (o) {
      return {
        id: o.id, name: o.name, points: o.points,
        diagrams: (o.diagrams || []).map(function (dg) {
          return { id: dg.id, court: dg.court, size: dg.size, caption: dg.caption,
                   strokes: dg.strokes.map(packStroke) };
        })
      };
    });
    return copy;
  }

  function inflateTactic(t) {
    if (!Array.isArray(t.options)) t.options = [];
    t.options.forEach(function (o) {
      if (!Array.isArray(o.diagrams)) o.diagrams = [];
      o.diagrams.forEach(function (dg) { dg.strokes = (dg.strokes || []).map(unpackStroke); });
    });
    if (SIDES.indexOf(t.side) === -1) t.side = "Offence";
    return t;
  }

  function optionLabel(t, o) {
    var setName = (t && t.name) || "Untitled";
    var optName = (o && o.name) || "";
    return optName ? setName + " · " + optName : setName;
  }

  /* How many completed practices each set, and each option, was worked in.
     Counted once per session, like the drill tallies. */
  function tacticUsage() {
    var sets = {}, options = {};
    state.practices.forEach(function (p) {
      if (p.status !== "done") return;
      var seenSet = {}, seenOpt = {};
      p.items.forEach(function (it) {
        if (it.kind !== "tactic" || !it.tacticId) return;
        if (!seenSet[it.tacticId]) {
          seenSet[it.tacticId] = 1;
          sets[it.tacticId] = (sets[it.tacticId] || 0) + 1;
        }
        var key = it.tacticId + "/" + it.optionId;
        if (it.optionId && !seenOpt[key]) {
          seenOpt[key] = 1;
          options[key] = (options[key] || 0) + 1;
        }
      });
    });
    return { sets: sets, options: options };
  }

  /* ================= roster =================
     A player is a record that outlives a season, so the profile is split in two:
     the facts that rarely change (name, number, position) and a list of dated
     **assessments**. An assessment is a snapshot, never an edit-in-place — Dusan's
     call, and the only version that can answer "is he better than in September".

     Ratings run 1-10, the same scale as drill intensity, so there is one number
     scale in the app rather than two. `null` means not rated, which is different
     from a low rating and is drawn as a gap, never as a zero. */

  /* The four areas are Dusan's own words from the roster pillar. The `what` line
     is on the record rather than in a help page, because the question he asked
     was "what should I write here" and the answer belongs next to the box. */
  /* The series colours are tokens, not literals, because the set validated
     against the dark panel is not readable on a light one - the gold was 2.8:1
     on cream. Each theme carries its own four, both sets checked for contrast
     and for separation from each other (worst pair dE 33). Used as CSS colours
     in inline style and in SVG fill/stroke, both of which resolve var(). */
  var AREAS = [
    { id: "physical",      label: "Physical",      hue: "var(--chart-1)",
      what: "Speed, strength, jumping, conditioning, size for his position." },
    { id: "tactical",      label: "Tactical",      hue: "var(--chart-2)",
      what: "Reading the game: spacing, decisions, running the sets, defensive rotations." },
    { id: "technical",     label: "Technical",     hue: "var(--chart-3)",
      what: "The skills themselves: shooting, handling, passing, footwork, finishing." },
    { id: "psychological", label: "Psychological", hue: "var(--chart-4)",
      what: "Competitiveness, coachability, composure late in a close game, consistency." }
  ];

  var POSITIONS = ["G", "F", "C"];

  function newPlayer() {
    return {
      id: uid(), name: "", number: "", position: "", birthDate: "",
      heightCm: null, note: "", assessments: [], active: true,
      createdAt: Date.now(), updatedAt: Date.now()
    };
  }

  function newAssessment() {
    var a = { id: uid(), date: todayISO(), note: "" };
    AREAS.forEach(function (x) { a[x.id] = null; });
    return a;
  }

  function findPlayer(id) {
    for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i];
    return null;
  }

  function deflatePlayer(p) { return p; }

  function inflatePlayer(p) {
    if (!Array.isArray(p.assessments)) p.assessments = [];
    p.assessments.forEach(function (a) {
      AREAS.forEach(function (x) { a[x.id] = numOrNull(a[x.id]); });
    });
    p.assessments.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    // birthYear was all the roster held at first. It is never thrown away: if a
    // full date has not been typed yet the year is still shown beside the field.
    if (!p.birthDate || !isoParts(p.birthDate)) p.birthDate = "";
    p.heightCm = numOrNull(p.heightCm);
    if (p.active !== false) p.active = true;
    return p;
  }

  // Squad order: numbered players first in numeric order, then the rest by name.
  function bySquadNumber(a, b) {
    var na = parseInt(a.number, 10), nb = parseInt(b.number, 10);
    var ha = !isNaN(na), hb = !isNaN(nb);
    if (ha && hb && na !== nb) return na - nb;
    if (ha !== hb) return ha ? -1 : 1;
    return String(a.name || "").localeCompare(String(b.name || ""));
  }

  function latestAssessment(p) {
    return p.assessments.length ? p.assessments[p.assessments.length - 1] : null;
  }

  /* ---------- attendance ----------
     Three states, matching the scale the other app already used: in (1),
     partial (0.5), out (0). A player with no mark is **not recorded** — which is
     not the same as absent, and is never counted as one. A practice nobody was
     marked on simply does not appear in anyone's attendance. */

  var ATTEND = [
    { id: "in",   label: "In",      weight: 1 },
    { id: "part", label: "Partial", weight: 0.5 },
    { id: "out",  label: "Out",     weight: 0 }
  ];

  function attendWeight(mark) {
    for (var i = 0; i < ATTEND.length; i++) if (ATTEND[i].id === mark) return ATTEND[i].weight;
    return null;
  }

  function attendanceTaken(p) {
    for (var k in p.attendance) if (p.attendance[k]) return true;
    return false;
  }

  /* Attendance over completed practices where a register was actually taken. */
  function attendanceFor(playerId) {
    var sessions = 0, credit = 0, missed = 0;
    state.practices.forEach(function (p) {
      if (p.status !== "done" || !attendanceTaken(p)) return;
      var w = attendWeight(p.attendance[playerId]);
      if (w === null) return;
      sessions++;
      credit += w;
      if (w === 0) missed++;
    });
    return {
      sessions: sessions, credit: credit, missed: missed,
      pct: sessions ? Math.round((credit / sessions) * 100) : null
    };
  }

  /* ================= schedule events =================
     Everything on the calendar that is not a practice. A season is not only
     the nights you coach: the game is what the week is built around, and a
     travel day or a shut gym is the reason a plan changes. Kept as one record
     type with a `kind`, rather than six near-identical ones. */

  var EVENT_KINDS = [
    { id: "game",       label: "Game",            hint: "Who you play, home or away, and the score when you have it" },
    { id: "tournament", label: "Tournament",      hint: "A multi-day competition" },
    { id: "travel",     label: "Travel",          hint: "On the road, not training" },
    { id: "off",        label: "Day off",         hint: "Deliberate rest" },
    { id: "gym",        label: "Gym unavailable", hint: "The hall is taken" },
    { id: "note",       label: "Note",            hint: "Anything else worth seeing on the calendar" }
  ];

  /* Weight, not category — Dusan's call. A week should show what *matters* first
     rather than what type everything is. A game is the fixed point the week is
     built around, so it is loud; a practice is the working substance; travel, a
     day off, a taken gym and a note are the context the week happens around, so
     they recede. Colour still says which kind it is; size and fill say how much
     it counts. */
  var LOUD_KINDS = { game: 1, tournament: 1 };

  function tierOf(it) {
    if (it.type === "practice") return "mid";
    return LOUD_KINDS[it.rec.kind] ? "loud" : "quiet";
  }

  function kindLabel(id) {
    for (var i = 0; i < EVENT_KINDS.length; i++) if (EVENT_KINDS[i].id === id) return EVENT_KINDS[i].label;
    return "Note";
  }

  function newEvent(kind, date) {
    return {
      id: uid(), kind: kind || "note", date: date || todayISO(), time: "",
      title: "", venue: "", scoreUs: null, scoreThem: null, note: "",
      createdAt: Date.now(), updatedAt: Date.now()
    };
  }

  function findEvent(id) {
    for (var i = 0; i < state.events.length; i++) if (state.events[i].id === id) return state.events[i];
    return null;
  }

  function deflateEvent(e) { return e; }

  function inflateEvent(e) {
    if (!e.kind) e.kind = "note";
    e.scoreUs = numOrNull(e.scoreUs);
    e.scoreThem = numOrNull(e.scoreThem);
    return e;
  }

  function numOrNull(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }

  function eventTitle(e) {
    if (e.kind === "game") {
      var who = e.title || "Game";
      var where = e.venue === "home" ? "H" : e.venue === "away" ? "A" : e.venue === "neutral" ? "N" : "";
      return where ? who + " (" + where + ")" : who;
    }
    return e.title || kindLabel(e.kind);
  }

  function gameResult(e) {
    if (e.kind !== "game") return "";
    if (e.scoreUs === null || e.scoreThem === null) return "";
    return e.scoreUs + "\u2013" + e.scoreThem;
  }

  /* Won-lost, from games that actually have both scores filled in. A game with
     no score is not a draw and is not counted — the record says only what the
     data supports. */
  function seasonRecord() {
    var w = 0, l = 0, d = 0, pending = 0;
    state.events.forEach(function (e) {
      if (e.kind !== "game") return;
      if (e.scoreUs === null || e.scoreThem === null) { pending++; return; }
      if (e.scoreUs > e.scoreThem) w++;
      else if (e.scoreUs < e.scoreThem) l++;
      else d++;
    });
    return { w: w, l: l, d: d, pending: pending };
  }

  /* ---------- dates ----------
     Parsed by hand rather than through Date(string): "2026-08-25" fed to the
     Date constructor is read as UTC and can come back as the 24th in a western
     timezone, which would put a session on the wrong day. */

  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                     "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July",
                    "August", "September", "October", "November", "December"];

  function todayISO() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function isoParts(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
  }

  function prettyDate(iso) {
    var p = isoParts(iso);
    if (!p) return "No date";
    var dt = new Date(p.y, p.m - 1, p.d);
    return DAY_NAMES[dt.getDay()] + " " + p.d + " " + MONTH_SHORT[p.m - 1] + " " + p.y;
  }

  function monthLabel(iso) {
    var p = isoParts(iso);
    return p ? MONTH_LONG[p.m - 1] + " " + p.y : "Undated";
  }

  function dateFromISO(iso) {
    var p = isoParts(iso);
    return p ? new Date(p.y, p.m - 1, p.d) : new Date();
  }

  function isoFromDate(dt) {
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
  }

  function addDays(iso, n) {
    var d = dateFromISO(iso);
    d.setDate(d.getDate() + n);
    return isoFromDate(d);
  }

  function addMonths(iso, n) {
    var p = isoParts(iso) || isoParts(todayISO());
    var d = new Date(p.y, p.m - 1 + n, 1);
    return isoFromDate(d);
  }

  // Weeks start on Monday: a basketball week runs to the weekend game.
  function startOfWeek(iso) {
    var d = dateFromISO(iso);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return isoFromDate(d);
  }

  /* Typed, not scrolled. A wheel picker costs several seconds per field and
     the coach already knows the number; these parse what he types and are
     forgiving about how he types it. */

  var DMY_RE = /^\s*(\d{1,2})[.\/\-\s](\d{1,2})[.\/\-\s](\d{4})\s*$/;

  // "5.3.2008", "05.03.2008", "5/3/2008" -> ISO. null if it is not a real date.
  function parseDMY(text) {
    var m = DMY_RE.exec(text || "");
    if (!m) return null;
    var d = +m[1], mo = +m[2], y = +m[3];
    var dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return isoFromDate(dt);
  }

  function formatDMY(iso) {
    var p = isoParts(iso);
    if (!p) return "";
    var z = function (n) { return (n < 10 ? "0" : "") + n; };
    return z(p.d) + "." + z(p.m) + "." + p.y;
  }

  // Age today, from a full date of birth. Not guessed from a year alone.
  function ageFrom(iso) {
    var p = isoParts(iso);
    if (!p) return null;
    var now = new Date();
    var years = now.getFullYear() - p.y;
    var hadBirthday = (now.getMonth() + 1 > p.m) ||
                      (now.getMonth() + 1 === p.m && now.getDate() >= p.d);
    return hadBirthday ? years : years - 1;
  }

  // "18", "18:00", "18.00", "1800" -> "18:00". "" clears it, null is a typo.
  function parseTime(text) {
    var t = String(text || "").trim();
    if (!t) return "";
    var m = /^(\d{1,2})[:.hH]?(\d{2})?$/.exec(t);
    if (!m) return null;
    var h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
    if (h > 23 || mi > 59) return null;
    var z = function (n) { return (n < 10 ? "0" : "") + n; };
    return z(h) + ":" + z(mi);
  }

  function minutesOfDay(hhmm) {
    var m = /^(\d{2}):(\d{2})$/.exec(hhmm || "");
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }

  // Length of a session from its start and end. Null unless both are real and
  // the end is after the start — never a negative or a guessed duration.
  function spanMinutes(from, to) {
    var a = minutesOfDay(from), b = minutesOfDay(to);
    if (a === null || b === null || b <= a) return null;
    return b - a;
  }

  function timeRange(from, to) {
    if (from && to) return from + "\u2013" + to;
    return from || to || "";
  }

  function shortDay(iso) { return DAY_NAMES[dateFromISO(iso).getDay()]; }
  function dayNum(iso) { var p = isoParts(iso); return p ? p.d : 0; }

  function shortDate(iso) {
    var p = isoParts(iso);
    return p ? p.d + " " + MONTH_SHORT[p.m - 1] : "";
  }

  // Everything on one day, practices first, then events in time order.
  function dayItems(iso) {
    var out = [];
    state.practices.forEach(function (p) {
      if (p.date === iso) out.push({ type: "practice", rec: p, time: p.time || "" });
    });
    state.events.forEach(function (e) {
      if (e.date === iso) out.push({ type: "event", rec: e, time: e.time || "" });
    });
    out.sort(function (a, b) {
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });
    return out;
  }

  /* ================= stroke storage =================
     Pencil samples arrive at up to 240 Hz, which is far more detail than a
     court diagram needs. Ramer-Douglas-Peucker drops the points that sit on a
     line their neighbours already describe: typically an 8-10x reduction with
     no visible change to the drawing, which is what keeps a season of diagrams
     small enough to hold and to back up. */

  function rdp(pts, eps) {
    if (pts.length < 3) return pts.slice();
    var first = pts[0], last = pts[pts.length - 1];
    var dx = last.x - first.x, dy = last.y - first.y;
    var len2 = dx * dx + dy * dy;
    var maxD = -1, idx = 0;

    for (var i = 1; i < pts.length - 1; i++) {
      var px = pts[i].x - first.x, py = pts[i].y - first.y, d;
      if (len2 === 0) { d = px * px + py * py; }
      else {
        var t = (px * dx + py * dy) / len2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var ex = px - t * dx, ey = py - t * dy;
        d = ex * ex + ey * ey;
      }
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > eps * eps) {
      var left = rdp(pts.slice(0, idx + 1), eps);
      var right = rdp(pts.slice(idx), eps);
      return left.slice(0, -1).concat(right);
    }
    return [first, last];
  }

  function simplify(stroke) {
    var pts = stroke.pts;
    if (pts.length > 2) {
      // Iterative for very long strokes, so deep recursion cannot blow the stack.
      var out = [], CHUNK = 400;
      for (var i = 0; i < pts.length; i += CHUNK) {
        var seg = rdp(pts.slice(i, Math.min(pts.length, i + CHUNK + 1)), 0.0018);
        out = out.length ? out.concat(seg.slice(1)) : seg;
      }
      stroke.pts = out;
    }
    return stroke;
  }

  /* ================= compact storage =================
     A hand-drawn point does not need 16 decimal places. Coordinates go to
     integers at 1/10000 of the court (0.15 cm - far finer than a pencil line),
     pressure to two places, and each point is stored as a DELTA from the last,
     which keeps the numbers tiny and the JSON short. Roughly 7x smaller than
     the raw objects, which is the difference between an archive that grows
     comfortably for years and one that hits a wall. */

  var TOOL_CODE = { pen: "p", marker: "m", eraser: "e" };
  var CODE_TOOL = { p: "pen", m: "marker", e: "eraser" };

  function packStroke(s) {
    var d = [], px = 0, py = 0;
    for (var i = 0; i < s.pts.length; i++) {
      var x = Math.round(s.pts[i].x * 10000);
      var y = Math.round(s.pts[i].y * 10000);
      d.push(x - px, y - py, Math.round(s.pts[i].p * 100));
      px = x; py = y;
    }
    return { t: TOOL_CODE[s.tool] || "p", c: s.color, w: s.size, d: d };
  }

  function unpackStroke(o) {
    if (o && o.pts) return o;                    // already expanded
    var pts = [], px = 0, py = 0;
    for (var i = 0; i + 2 < o.d.length; i += 3) {
      px += o.d[i]; py += o.d[i + 1];
      pts.push({ x: px / 10000, y: py / 10000, p: o.d[i + 2] / 100 });
    }
    return { tool: CODE_TOOL[o.t] || "pen", color: o.c, size: o.w, pts: pts };
  }

  function deflateDrill(d) {
    var copy = {};
    for (var k in d) if (k !== "diagrams") copy[k] = d[k];
    copy.diagrams = d.diagrams.map(function (dg) {
      return { id: dg.id, court: dg.court, size: dg.size, caption: dg.caption,
               strokes: dg.strokes.map(packStroke) };
    });
    return copy;
  }

  function inflateDrill(d) {
    if (!Array.isArray(d.diagrams)) d.diagrams = [];
    d.diagrams.forEach(function (dg) { dg.strokes = (dg.strokes || []).map(unpackStroke); });
    return d;
  }

  function serialize(st) {
    return JSON.stringify({
      version: 5, updatedAt: st.updatedAt,
      drills: st.drills.map(deflateDrill),
      practices: st.practices.map(deflatePractice),
      events: st.events.map(deflateEvent),
      players: st.players.map(deflatePlayer),
      tactics: st.tactics.map(deflateTactic)
    });
  }

  // Backups written before practices existed have no `practices` key; they are
  // still valid and simply restore an empty diary.
  function deserialize(raw) {
    var st = typeof raw === "string" ? JSON.parse(raw) : raw;
    if (!st || !Array.isArray(st.drills)) return null;
    st.drills.forEach(inflateDrill);
    st.practices = Array.isArray(st.practices) ? st.practices.map(inflatePractice) : [];
    st.practices.sort(byDateDesc);
    st.events = Array.isArray(st.events) ? st.events.map(inflateEvent) : [];
    st.events.sort(byDateDesc);
    st.players = Array.isArray(st.players) ? st.players.map(inflatePlayer) : [];
    st.players.sort(bySquadNumber);
    st.tactics = Array.isArray(st.tactics) ? st.tactics.map(inflateTactic) : [];
    return st;
  }

  /* Apple Scribble turns Pencil handwriting into typed text in any *editable*
     field near the nib, and its catch area reaches well past the box itself —
     which is why a stroke along the top of a court kept arriving as text in the
     name above it. There is no web API to switch Scribble off, but it only ever
     targets a field that can be typed into: a readonly box is not a target.

     So on the screens where the Pencil draws, every text box stays readonly
     until it is deliberately tapped or tabbed into, and goes back to readonly on
     the way out. Deliberate typing is unchanged — the field is already editable
     by the time the tap becomes focus, so the keyboard still comes up — but a
     pen stroke that merely passes nearby has nothing to write into.

     readOnly is cleared on pointerdown rather than on focus alone because iOS
     will not raise the keyboard for a field that was readonly when it was
     tapped; focus is covered too, so a hardware keyboard can still tab in. */
  function penSafe(root) {
    var boxes = root.querySelectorAll("input[type=text], input[type=number], textarea");
    for (var i = 0; i < boxes.length; i++) armPenSafe(boxes[i]);
    return root;
  }

  function armPenSafe(box) {
    box.readOnly = true;
    function open() { box.readOnly = false; }
    box.addEventListener("pointerdown", open);
    box.addEventListener("focus", open);
    box.addEventListener("blur", function () { box.readOnly = true; });
  }

  /* ================= ink engine =================
     Two layers per diagram: #base holds finished strokes, #live only the one in
     progress. Pen is opaque so it appends segment by segment (lowest latency);
     marker is see-through so it is repainted whole as ONE path or overlaps go
     blotchy; the eraser has to cut into finished work so it writes to base. */

  var tool = { name: "pen", color: "#22201C", size: 7, fingerDraws: false };

  function Pad(host, diagram, onChange) {
    var wrap = document.createElement("div");
    wrap.className = "court-wrap";
    wrap.innerHTML = courtSvg(diagram.court);

    var base = document.createElement("canvas"); base.className = "ink-base";
    var live = document.createElement("canvas"); live.className = "ink-live";
    wrap.appendChild(base); wrap.appendChild(live);
    host.appendChild(wrap);

    var bctx = base.getContext("2d"), lctx = live.getContext("2d");
    /* Both of these are one-at-a-time, so both have to say *which* pointer owns
       them. Without that, a palm resting on the court was answered as if it were
       the Pencil: see the pointerdown handler below. `activeId` is kept beside
       the stroke rather than on it, so nothing extra reaches the saved ink. */
    var active = null, activeId = null;
    var pan = null;      // a finger dragging to scroll, rather than to draw

    function dims() { return COURTS[diagram.court] || COURTS.half; }
    function unitScale() { return base.width / (dims().w + BLEED * 2); }

    function layout() {
      var want = SIZES[diagram.size] || SIZES.M;
      var avail = host.clientWidth || want;
      var cssW = Math.max(200, Math.min(want, avail));
      var cssH = Math.round(cssW * courtAspect(diagram.court));

      wrap.style.width = cssW + "px";
      wrap.style.height = cssH + "px";

      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      base.width = live.width = Math.round(cssW * dpr);
      base.height = live.height = Math.round(cssH * dpr);
      redraw();
    }

    function penWidth(s, p) { return Math.max(0.6, s.size * unitScale() * (0.35 + 0.85 * p)); }
    function flatWidth(s) { return s.size * unitScale() * (s.tool === "marker" ? 3.2 : 5.5); }

    function styleFor(ctx, s) {
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (s.tool === "eraser") {
        ctx.globalCompositeOperation = "destination-out";
        ctx.globalAlpha = 1; ctx.strokeStyle = "#000";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = s.tool === "marker" ? 0.42 : 1;
        ctx.strokeStyle = s.color;
      }
    }

    function dot(ctx, s, p) {
      var w = s.tool === "pen" ? penWidth(s, p.p) : flatWidth(s);
      ctx.beginPath();
      ctx.arc(p.x * ctx.canvas.width, p.y * ctx.canvas.height, w / 2, 0, Math.PI * 2);
      ctx.fillStyle = s.tool === "eraser" ? "#000" : s.color;
      ctx.fill();
    }

    function pathThrough(ctx, pts, from, to) {
      var W = ctx.canvas.width, H = ctx.canvas.height;
      var prev = pts[from - 2] || pts[from - 1], a = pts[from - 1];
      ctx.moveTo((prev.x * W + a.x * W) / 2, (prev.y * H + a.y * H) / 2);
      for (var i = from; i <= to; i++) {
        var c = pts[i - 1], b = pts[i];
        ctx.quadraticCurveTo(c.x * W, c.y * H, (c.x * W + b.x * W) / 2, (c.y * H + b.y * H) / 2);
      }
    }

    function paintWhole(ctx, s) {
      var pts = s.pts;
      if (!pts || !pts.length) return;
      ctx.save(); styleFor(ctx, s);
      if (pts.length === 1) { dot(ctx, s, pts[0]); ctx.restore(); return; }
      if (s.tool === "pen") {
        for (var i = 1; i < pts.length; i++) {
          ctx.beginPath(); ctx.lineWidth = penWidth(s, pts[i].p);
          pathThrough(ctx, pts, i, i); ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.lineWidth = flatWidth(s);
        pathThrough(ctx, pts, 1, pts.length - 1); ctx.stroke();
      }
      ctx.restore();
    }

    function paintNewest(ctx, s) {
      var pts = s.pts, n = pts.length;
      ctx.save(); styleFor(ctx, s);
      if (n < 2) { dot(ctx, s, pts[0]); ctx.restore(); return; }
      ctx.beginPath();
      ctx.lineWidth = s.tool === "pen" ? penWidth(s, pts[n - 1].p) : flatWidth(s);
      pathThrough(ctx, pts, n - 1, n - 1); ctx.stroke();
      ctx.restore();
    }

    function redraw() {
      bctx.clearRect(0, 0, base.width, base.height);
      for (var i = 0; i < diagram.strokes.length; i++) paintWhole(bctx, diagram.strokes[i]);
      lctx.clearRect(0, 0, live.width, live.height);
      if (active) paintWhole(lctx, active);
    }

    function accepts(e) {
      if (e.pointerType === "pen") return true;
      if (e.pointerType === "touch") return tool.fingerDraws;
      return true;
    }
    function toNorm(e) {
      var r = live.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
    }
    function pressureOf(e) {
      if (e.pointerType !== "pen") return 0.5;
      return e.pressure > 0 ? e.pressure : 0.25;
    }
    function surface(s) { return s.tool === "eraser" ? bctx : lctx; }

    live.addEventListener("pointerdown", function (e) {
      // A finger on the court scrolls the page, unless it has been given a pen.
      if (e.pointerType === "touch" && !tool.fingerDraws) {
        /* A hand resting on the court while the Pencil draws is a palm, not a
           scroll. This is the real palm rejection: ignoring touch for *drawing*
           was never enough, because the touch still claimed the pan and every
           pen event after it was answered as a scroll instead of a line. */
        if (active) return;
        pan = { id: e.pointerId, y: e.clientY, from: window.scrollY };
        live.setPointerCapture(e.pointerId);
        return;
      }
      if (!accepts(e)) return;
      e.preventDefault();
      // The Pencil outranks a finger already on the glass.
      pan = null;
      live.setPointerCapture(e.pointerId);
      var n = toNorm(e);
      activeId = e.pointerId;
      active = { tool: tool.name, color: tool.color, size: tool.size,
                 pts: [{ x: n.x, y: n.y, p: pressureOf(e) }] };
      paintNewest(surface(active), active);
    });

    live.addEventListener("pointermove", function (e) {
      if (pan && e.pointerId === pan.id) {
        window.scrollTo(0, pan.from - (e.clientY - pan.y));
        return;
      }
      if (!active || e.pointerId !== activeId) return;
      e.preventDefault();
      var evs = (typeof e.getCoalescedEvents === "function") ? e.getCoalescedEvents() : null;
      if (!evs || !evs.length) evs = [e];
      var added = false;
      for (var i = 0; i < evs.length; i++) {
        var n = toNorm(evs[i]);
        var last = active.pts[active.pts.length - 1];
        if (Math.abs(n.x - last.x) < 0.0004 && Math.abs(n.y - last.y) < 0.0004) continue;
        active.pts.push({ x: n.x, y: n.y, p: pressureOf(evs[i]) });
        added = true;
        if (active.tool !== "marker") paintNewest(surface(active), active);
      }
      if (added && active.tool === "marker") {
        lctx.clearRect(0, 0, live.width, live.height);
        paintWhole(lctx, active);
      }
    });

    function end(e) {
      var id = e ? e.pointerId : null;
      if (pan && (id === null || id === pan.id)) {
        pan = null;
        if (e && live.hasPointerCapture && live.hasPointerCapture(e.pointerId)) {
          live.releasePointerCapture(e.pointerId);
        }
        return;
      }
      // A palm lifting is not the end of the Pencil's stroke.
      if (!active || (id !== null && id !== activeId)) return;
      var done = active; active = null; activeId = null;
      lctx.clearRect(0, 0, live.width, live.height);
      if (done.pts.length) {
        diagram.strokes.push(simplify(done));
        if (done.tool !== "eraser") paintWhole(bctx, done);
        onChange();
      }
      if (e && live.hasPointerCapture && live.hasPointerCapture(e.pointerId)) {
        live.releasePointerCapture(e.pointerId);
      }
    }
    live.addEventListener("pointerup", end);
    live.addEventListener("pointercancel", end);

    /* iOS synthesises pointer events from touch events, and preventDefault() on a
       *pointer* event does not reliably cancel the touch default underneath it.
       That gap is how iPadOS gesture recognisers still reach a stroke, and it is
       why the ROUND characters were the ones going missing: a closed loop is
       Scribble's circle gesture, so the recogniser claimed the stroke, the moves
       were never delivered to the page, and a zero committed as a single point.

       Claiming the touch stream directly closes the gap. Only stylus touches are
       taken — `touchType` is how iOS says which is which — so finger scrolling
       over a court is completely unaffected. */
    function stylusTouch(e) {
      var t = e.changedTouches && e.changedTouches[0];
      return !!t && t.touchType === "stylus";
    }
    ["touchstart", "touchmove", "touchend"].forEach(function (name) {
      live.addEventListener(name, function (e) {
        if (stylusTouch(e) && e.cancelable) e.preventDefault();
      }, { passive: false });
    });

    return {
      el: wrap,
      layout: layout,
      redraw: redraw,
      undo: function () { diagram.strokes.pop(); redraw(); onChange(); },
      clear: function () { diagram.strokes.length = 0; redraw(); onChange(); },
      setCourt: function (kind) { diagram.court = kind; wrap.innerHTML = courtSvg(kind);
                                  wrap.appendChild(base); wrap.appendChild(live); layout(); onChange(); }
    };
  }

  /* ================= thumbnails ================= */

  function thumbFor(drill) {
    var d = drill.diagrams && drill.diagrams[0];
    var kind = d ? d.court : "half";
    var c = COURTS[kind] || COURTS.half;
    var ink = "";
    if (d && d.strokes.length) {
      for (var i = 0; i < d.strokes.length; i++) {
        var s = d.strokes[i];
        if (s.tool === "eraser" || !s.pts || s.pts.length < 2) continue;
        var dd = "";
        for (var j = 0; j < s.pts.length; j++) {
          dd += (j ? "L" : "M") + (s.pts[j].x * c.w).toFixed(0) + " " + (s.pts[j].y * c.h).toFixed(0) + " ";
        }
        ink += '<path d="' + dd + '" fill="none" stroke="' + s.color +
               '" stroke-width="' + (s.size * 1.6) + '" stroke-linecap="round" stroke-linejoin="round" opacity="' +
               (s.tool === "marker" ? 0.45 : 0.95) + '"/>';
      }
    }
    return '<svg viewBox="0 0 ' + c.w + ' ' + c.h + '" preserveAspectRatio="xMidYMid slice">' +
           c.svg + ink + '</svg>';
  }

  /* ================= views ================= */

  var app = document.getElementById("app");
  var crumb = document.getElementById("crumb");
  var route = { view: "schedule", id: null, pfilter: "",
                anchor: null, smode: "week", side: "" };
  var pads = [];

  /* `from` is where the crumb goes back to. A practice reached from the schedule
     belongs to the schedule: sending it back to the Practices list instead lost
     the day he was planning, and the week or month he was planning it in. */
  function go(view, id, from) {
    route.view = view; route.id = id || null; route.from = from || null;
    render();
    window.scrollTo(0, 0);
  }

  var tabsEl = document.getElementById("tabs");

  // The tabs are for moving between the two lists; inside a record the crumb
  // takes over as the way back, so both are never on screen at once.
  function setChrome() {
    var onList = route.view === "library" || route.view === "practices" ||
                 route.view === "schedule" || route.view === "roster" ||
                 route.view === "tactics";
    tabsEl.style.display = onList ? "" : "none";
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === route.view));
    });
    crumb.textContent = "";
    crumb.onclick = null;
    crumb.style.cursor = "";
  }

  Array.prototype.forEach.call(tabsEl.children, function (b) {
    b.onclick = function () { go(b.getAttribute("data-view")); };
  });

  function backTo(view, text) {
    crumb.textContent = "\u2039 " + text;
    crumb.style.cursor = "pointer";
    crumb.onclick = function () { go(view); };
  }

  function render() {
    pads = [];
    app.innerHTML = "";
    setChrome();
    if (route.view === "drill") renderEditor();
    else if (route.view === "schedule") renderSchedule();
    else if (route.view === "practices") renderPractices();
    else if (route.view === "practice") renderPracticeEditor();
    else if (route.view === "roster") renderRoster();
    else if (route.view === "player") renderPlayer();
    else if (route.view === "tactics") renderTactics();
    else if (route.view === "tactic") renderTacticEditor();
    else renderLibrary();
    relayout();
  }

  function relayout() { for (var i = 0; i < pads.length; i++) pads[i].layout(); }
  window.addEventListener("resize", function () { clearTimeout(window.__rl);
    window.__rl = setTimeout(relayout, 100); });

  /* `user-select: none` was not enough on its own. It stops an element being
     *selectable*, but iPadOS still starts the selection gesture when the Pencil
     drags, and the highlight then lands on whatever it can still reach — first
     the court, then, once the court was excluded, the Import button in the top
     bar. Chasing it with CSS moves it; it does not stop it.

     Cancelling the gesture itself does. Nothing outside a real text box may
     begin a selection or a drag, so there is nowhere left for it to land.
     Selecting and editing inside an input or a textarea is untouched. */
  function isTextBox(t) {
    if (!t || !t.tagName) return false;
    var tag = String(t.tagName).toUpperCase();
    return tag === "INPUT" || tag === "TEXTAREA";
  }
  document.addEventListener("selectstart", function (e) {
    if (!isTextBox(e.target)) e.preventDefault();
  });
  document.addEventListener("dragstart", function (e) {
    if (!isTextBox(e.target)) e.preventDefault();
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- library ---------- */

  // Always tell the truth about whether work is being kept.
  function storageBanner() {
    if (Store.kind === "idb" && !PREVIEW) return null;   // the good case: say nothing
    var w = el("div", "warn");
    if (PREVIEW) {
      w.innerHTML = "<b>Preview — nothing here is kept.</b> This page runs in a sandbox that " +
                    "wipes its storage when you close it. Try the app out, but do not build " +
                    "your real library until it has its own home on the web.";
    } else if (Store.kind === "local") {
      w.innerHTML = "<b>Saving, but to the smaller store.</b> This browser refused the main " +
                    "one, so the library will run out of room sooner. Export a backup regularly.";
    } else {
      w.innerHTML = "<b>Nothing is being saved.</b> This browser is blocking storage entirely — " +
                    "everything you do will vanish when you close the page. Export a backup now.";
    }
    return w;
  }

  function renderLibrary() {
    var wrap = el("div", "wrap");
    var usage = usageMap();

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    var head = el("div", "lib-head");
    head.appendChild(el("h1", null, "Drill Library"));
    head.appendChild(el("span", "count",
      state.drills.length ? state.drills.length + (state.drills.length === 1 ? " drill" : " drills") : ""));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);
    var add = el("button", "chip primary", "+  New drill");
    add.onclick = function () {
      var d = newDrill();
      state.drills.unshift(d);
      touch(d);
      go("drill", d.id);
    };
    head.appendChild(add);
    wrap.appendChild(head);

    if (!state.drills.length) {
      var e = el("div", "empty");
      e.innerHTML = "Nothing here yet.<br>Draw a drill once, then reuse it all season.";
      wrap.appendChild(e);
      app.appendChild(wrap);
      return;
    }

    // grouped by focus tag; untagged drills gather at the end rather than hide
    var groups = {};
    state.drills.forEach(function (d) {
      var t = d.tag || "Untagged";
      (groups[t] = groups[t] || []).push(d);
    });
    var names = Object.keys(groups).sort(function (a, b) {
      if (a === "Untagged") return 1;
      if (b === "Untagged") return -1;
      return a.localeCompare(b);
    });
    var keys = names.map(function (t) { return "drill:" + t; });

    wrap.appendChild(openAllRow(keys, names.length));

    names.forEach(function (t) {
      var list = groups[t];
      wrap.appendChild(section("drill:" + t, t,
        list.length + (list.length === 1 ? " drill" : " drills"),
        function (body) {
          var grid = el("div", "grid");
          list.forEach(function (d) { grid.appendChild(drillCard(d, usage)); });
          body.appendChild(grid);
        }));
    });

    app.appendChild(wrap);
  }

  function openAllRow(keys, howMany) {
    var row = el("div", "sect-tools");
    var anyOpen = keys.some(isOpen);
    var b = el("button", "chip ghost", anyOpen ? "Close all" : "Open all");
    b.onclick = function () { setOpenAll(keys, !anyOpen); render(); };
    row.appendChild(b);
    row.appendChild(el("span", "count",
      howMany + (howMany === 1 ? " category" : " categories")));
    return row;
  }

  function drillCard(d, usage) {
    var card = el("button", "card");
    var thumb = el("div", "thumb");
    thumb.innerHTML = thumbFor(d);
    var meta = el("div", "meta");
    meta.appendChild(el("div", "name", d.name || "Untitled"));
    var sub = el("div", "sub");
    var bits = [];
    if (d.format) bits.push(d.format);
    if (d.minutes) bits.push(d.minutes + " min");
    if (d.intensity) bits.push((Math.round(d.intensity * 10) / 10) + "/10");
    var n = d.diagrams.length;
    bits.push(n + (n === 1 ? " court" : " courts"));
    sub.appendChild(el("span", null, bits.join(" · ")));
    meta.appendChild(sub);
    // The countable fact the library exists to produce.
    if (usage[d.id]) {
      meta.appendChild(el("div", "usage",
        "Run in " + usage[d.id] + (usage[d.id] === 1 ? " practice" : " practices")));
    }
    card.appendChild(thumb); card.appendChild(meta);
    card.onclick = function () { go("drill", d.id); };
    return card;
  }

  /* ---------- tactics ---------- */

  function renderTactics() {
    var wrap = el("div", "wrap");

    var banner = storageBanner();
    if (banner) wrap.appendChild(banner);

    var use = tacticUsage();

    var head = el("div", "lib-head");
    head.appendChild(el("h1", null, "Tactics"));
    var opts = 0;
    state.tactics.forEach(function (t) { opts += t.options.length; });
    head.appendChild(el("span", "count", state.tactics.length
      ? state.tactics.length + (state.tactics.length === 1 ? " set" : " sets") +
        "  ·  " + opts + (opts === 1 ? " option" : " options")
      : ""));
    var gap = el("div"); gap.style.marginLeft = "auto";
    head.appendChild(gap);
    var add = el("button", "chip primary", "+  New set");
    add.onclick = function () {
      var t = newTactic();
      if (route.side) t.side = route.side;
      state.tactics.unshift(t);
      touchTactic(t);
      go("tactic", t.id);
    };
    head.appendChild(add);
    wrap.appendChild(head);

    // filter by end of the floor, because that is how a package divides
    var f = el("div", "filters");
    var all = el("button", null, "All");
    all.setAttribute("aria-pressed", String(!route.side));
    all.onclick = function () { route.side = ""; render(); };
    f.appendChild(all);
    SIDES.forEach(function (s) {
      var n = state.tactics.filter(function (t) { return t.side === s; }).length;
      var b = el("button", null, s + (n ? " (" + n + ")" : ""));
      b.setAttribute("aria-pressed", String(route.side === s));
      b.onclick = function () { route.side = (route.side === s ? "" : s); render(); };
      f.appendChild(b);
    });
    wrap.appendChild(f);

    var shown = state.tactics.filter(function (t) {
      return !route.side || t.side === route.side;
    });

    var allKeys = [];
    var blocks = [];
    SIDES.forEach(function (side) {
      var mine = shown.filter(function (t) { return t.side === side; });
      if (!mine.length) return;

      var byCat = {};
      mine.forEach(function (t) {
        var c = t.category || "Uncategorised";
        (byCat[c] = byCat[c] || []).push(t);
      });
      // the side's own categories first, in the order they are offered
      var cats = categoriesFor(side).filter(function (c) { return byCat[c]; });
      Object.keys(byCat).forEach(function (c) { if (cats.indexOf(c) === -1) cats.push(c); });

      blocks.push({ side: side, cats: cats, byCat: byCat });
      cats.forEach(function (c) { allKeys.push("tactic:" + side + "/" + c); });
    });

  // the drill thumbnail, but for any single diagram
  function thumbForDiagram(d) {
    var kind = d ? d.court : "half";
    var c = COURTS[kind] || COURTS.half;
    var ink = "";
    if (d && d.strokes && d.strokes.length) {
      for (var i = 0; i < d.strokes.length; i++) {
        var s = d.strokes[i];
        if (s.tool === "eraser" || !s.pts || s.pts.length < 2) continue;
        var dd = "";
        for (var j = 0; j < s.pts.length; j++) {
          dd += (j ? "L" : "M") + (s.pts[j].x * c.w).toFixed(0) + " " + (s.pts[j].y * c.h).toFixed(0) + " ";
        }
        ink += '<path d="' + dd + '" fill="none" stroke="' + s.color +
               '" stroke-width="' + (s.size * 1.6) + '" stroke-linecap="round" stroke-linejoin="round" opacity="' +
               (s.tool === "marker" ? 0.45 : 0.95) + '"/>';
      }
    }
    return '<svg viewBox="0 0 ' + c.w + ' ' + c.h + '" preserveAspectRatio="xMidYMid slice">' +
           c.svg + ink + '</svg>';
  }
